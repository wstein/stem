# SPDX-License-Identifier: Apache-2.0
[package]
name = "stem_examples"
version = "0.0.1"
edition = "2021"
description = "Embedder examples for the stem_native engine: a compile-time macro and a dynamic-evaluation binary, both adding custom transformers via the host-getter hook."
publish = false

[lib]
name = "stem_examples"
path = "src/lib.rs"

[dependencies]
stem_native = { path = "../stem_native" }
stem_macros = { path = "../stem_macros" }
# Match stem_native's serde_json feature so the whole graph shares one `Value`
# type (the proc-macro dependency otherwise splits feature unification).
serde_json = { version = "1", features = ["float_roundtrip"] }
jsonata-core = { version = "2.1.4", default-features = false }

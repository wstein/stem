    <title>Stem Playground — IDE</title>
    <style>
      /* ── Design tokens ───────────────────────────────────────────── */
      :root {
        /* Light — violet-kissed whites */
        --bg: #ffffff;
        --bg-1: #faf8ff;      /* barely-violet wash */
        --bg-2: #f2effc;      /* violet-8 at 70% */
        --bg-3: #e8e3f8;
        --bg-toolbar: #ffffff;
        --bg-statusbar: #faf8ff;
        --bg-tab-active: #ffffff;
        --bg-tab-inactive: transparent;
        --bg-pane: #ffffff;
        --bg-gutter: #f7f4fe;

        --fg: #18181b;             /* near-black for readability */
        --fg-secondary: #3b1b6b;   /* brand violet-4 */
        --fg-muted: #6b5ca5;       /* muted purple */
        --fg-faint: #9e8dc4;       /* light purple-gray */

        --border: #ddd6f8;         /* violet-tinted */
        --border-strong: #c8bff2;

        /* Brand palette — Stem Identity v0.1 */
        --accent: #7c4dff;        /* Elixir Purple · violet-6 */
        --accent-2: #5a2ea6;      /* violet-5 */
        --accent-soft: #e7defc;   /* violet-8 */
        --accent-softer: #f0ebfe;
        --stem-green: #10b981;    /* Growth Green · green-5 */
        --stem-mint: #3ee0a3;     /* mint · green-6 */

        --danger: #b91c1c;
        --danger-faint: #fee2e2;
        --success: #10b981;       /* Growth Green */
        --success-faint: #dcfce7;
        --warn: #b45309;          /* capability violations */
        --warn-faint: #fef3c7;

        --tok-tag: #7c4dff;       /* violet-6 */
        --tok-cmt: #94a3b8;
        --tok-key: #1d4ed8;
        --tok-str: #047857;
        --tok-num: #b45309;

        --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

        --topbar-h: 44px;
        --statusbar-h: 26px;
        /* One tab height across every tab strip (template, output view, and the
           data sub-pane) for a consistent look. */
        --tabs-h: 24px;
        --radius: 6px;

        --shadow-pop: 0 12px 32px -8px rgba(24,24,27,.18), 0 0 0 1px rgba(24,24,27,.06);
      }

      /* First-paint background before the inline theme script runs, so a
         dark/System-dark load doesn't flash the light default. */
      html { background: #ffffff; }
      @media (prefers-color-scheme: dark) { html { background: #16141d; } }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: var(--font-ui);
        font-size: 13px; line-height: 1.45;
        color: var(--fg); background: var(--bg-1);
        -webkit-font-smoothing: antialiased;
      }

      button { font: inherit; color: inherit; }
      input, select { font: inherit; color: inherit; }
      kbd {
        font: 11px/1 var(--font-mono);
        background: var(--bg-2); border: 1px solid var(--border);
        border-bottom-width: 2px; padding: 2px 5px; border-radius: 4px;
        color: var(--fg-secondary);
      }

      /* ── App shell ───────────────────────────────────────────────── */
      #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

      /* ── Top bar ─────────────────────────────────────────────────── */
      .topbar {
        height: var(--topbar-h); flex: 0 0 auto;
        display: flex; align-items: center; gap: 14px; padding: 0 12px;
        background: var(--bg-toolbar); border-bottom: 1px solid var(--border);
        user-select: none;
      }
      .brand {
        display: flex; align-items: center; gap: 8px;
        font-weight: 600; font-size: 13px; letter-spacing: -.01em; padding-right: 8px;
      }
      .brand .mark {
        width: 22px; height: 22px; flex: 0 0 22px; display: block;
      }
      .brand .brand-name { font-weight: 400; color: var(--fg-secondary); }
      .brand .brand-name b { font-weight: 700; color: var(--fg); }
      .brand .brand-ver {
        font: 500 10px/1 var(--font-mono); letter-spacing: .02em;
        color: var(--accent-2); background: var(--accent-soft);
        padding: 2px 5px; border-radius: 4px;
      }
      .brand .brand-ver:empty { display: none; }
      .topbar .divider { width: 1px; height: 18px; background: var(--border); }
      .topbar-group { display: flex; align-items: center; gap: 6px; }
      .field-label { color: var(--fg-muted); font-size: 12px; padding-right: 2px; }

      select.select, button.btn {
        height: 26px; padding: 0 8px;
        border: 1px solid var(--border-strong); border-radius: var(--radius);
        background: var(--bg); color: var(--fg); font-size: 12px; cursor: pointer;
        transition: background 80ms ease, border-color 80ms ease;
      }
      select.select:hover, button.btn:hover { background: var(--bg-2); }
      button.btn.active { color: var(--accent-2); border-color: var(--accent-soft); background: var(--accent-softer); }
      select.select:focus, button.btn:focus {
        outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
      }
      button.btn .kbd-inline { color: var(--fg-faint); margin-left: 6px; font: 11px/1 var(--font-mono); }

      /* Custom example dropdown — always opens downward (top: 100%). */
      .dropdown { position: relative; }
      .dropdown-trigger {
        height: 26px; min-width: 210px; padding: 0 8px;
        display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
        border: 1px solid var(--border-strong); border-radius: var(--radius);
        background: var(--bg); color: var(--fg); font-size: 12px; cursor: pointer;
        transition: background 80ms ease, border-color 80ms ease;
      }
      .dropdown-trigger:hover { background: var(--bg-2); }
      .dropdown-trigger:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .dropdown-trigger #example-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dropdown-caret { width: 11px; height: 11px; flex: 0 0 auto; opacity: .6; }
      .dropdown[data-open="true"] .dropdown-caret { transform: rotate(180deg); }
      .dropdown-menu {
        position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
        min-width: 100%; max-height: 60vh; overflow-y: auto;
        margin: 0; padding: 4px; list-style: none;
        background: var(--bg-pane); border: 1px solid var(--border); border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0,0,0,.18);
      }
      .dropdown-menu[hidden] { display: none; }
      .dropdown-item {
        padding: 5px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;
        font: 12px var(--font-ui); color: var(--fg-secondary);
      }
      .dropdown-item:hover, .dropdown-item.active { background: var(--accent-soft); color: var(--accent-2); }

      .spacer { flex: 1 1 auto; }
      .hint { font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; }

      /* ── Workspace ───────────────────────────────────────────────── */
      .workspace {
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: row;
        background: var(--border);
      }
      .pane {
        flex: 1 1 0; min-width: 220px; background: var(--bg-pane);
        display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      }

      /* ── Splitter ────────────────────────────────────────────────── */
      .splitter {
        flex: 0 0 6px; background: var(--border); cursor: col-resize;
        position: relative; transition: background 100ms ease;
      }
      .splitter::after { content: ""; position: absolute; inset: 0; margin: 0 -3px; }
      .splitter:hover, .splitter.dragging { background: var(--accent); }
      body.dragging-col { cursor: col-resize !important; }
      body.dragging-row { cursor: row-resize !important; }
      body.dragging-col *, body.dragging-row * { user-select: none !important; }
      body.dragging-col iframe, body.dragging-row iframe { pointer-events: none !important; }

      /* The pane focus (maximize) toggle is pushed to the far right of the tab
         strip (the panes have no separate title header). */
      .tabs-wrap > .focus-toggle { flex: 0 0 auto; align-self: center; margin-left: auto; margin-right: 6px; }

      /* ── Tabs ────────────────────────────────────────────────────── */
      .tabs-wrap {
        flex: 0 0 var(--tabs-h); height: var(--tabs-h);
        display: flex; align-items: stretch;
        border-bottom: 1px solid var(--border); background: var(--bg-2); min-width: 0;
      }
      .tabs {
        flex: 1 1 0; min-width: 0; height: 100%;
        display: flex; align-items: flex-end; padding: 0 4px; gap: 1px;
        overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
      }
      .tabs::-webkit-scrollbar { height: 4px; }
      .tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

      .tab {
        flex: 0 0 auto; height: calc(var(--tabs-h) - 1px);
        display: inline-flex; align-items: center; gap: 6px;
        padding: 0 10px 0 12px; border-right: 1px solid var(--border);
        background: var(--bg-tab-inactive); color: var(--fg-secondary);
        font-size: 12px; font-family: var(--font-mono);
        cursor: pointer; position: relative; user-select: none; white-space: nowrap;
      }
      .tab:hover { background: var(--bg-3); color: var(--fg); }
      .tab.active { background: var(--bg-tab-active); color: var(--fg); font-weight: 600; }
      .tab.active::after {
        content: ""; position: absolute; left: 0; right: 0; top: 0;
        height: 2px; background: var(--accent);
      }
      .tab.is-main::before { content: none; }
      .tab .close {
        width: 16px; height: 16px; display: grid; place-items: center;
        border-radius: 3px; color: var(--fg-faint); font-size: 12px; margin-left: 2px;
      }
      .tab .close:hover { background: var(--border); color: var(--fg); }
      .tab-add {
        flex: 0 0 auto; height: calc(var(--tabs-h) - 1px);
        padding: 0 10px; border: 0; background: transparent;
        color: var(--fg-muted); font-family: var(--font-mono); font-size: 12px;
        cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
      }
      .tab-add:hover { color: var(--accent); background: var(--bg-3); }

      /* ── Inline tab rename (active partial tab) ──────────────────── */
      .tab .tab-edit {
        border: 0; background: transparent; color: inherit;
        font: inherit; padding: 0; margin: 0; outline: none; min-width: 3ch;
      }

      /* ── Editor panes (CodeMirror) ───────────────────────────────── */
      /* Template + data editors shown together, perpendicular to the workspace:
         stacked when the workspace is split (the default), side-by-side when the
         workspace is stacked. A draggable .esplitter sits between them. */
      .editors { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; min-width: 0; }
      .editors > .editor-pane { flex: 1 1 0; }
      .editor-cell { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .editor-cell > .editor-pane { flex: 1 1 auto; }
      .cell-label {
        flex: 0 0 auto; height: 24px; display: flex; align-items: center; gap: 6px;
        padding: 0 12px; font: 11px/1 var(--font-mono); color: var(--tok-key);
        background: var(--accent-softer); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      }
      .data-tabs {
        flex: 0 0 auto; height: var(--tabs-h); display: flex;
        background: var(--accent-softer); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      }
      .data-tab {
        height: 100%; display: inline-flex; align-items: center; gap: 6px;
        padding: 0 12px; border: 0; border-right: 1px solid var(--border);
        background: transparent; color: var(--fg-faint);
        font: 11px/1 var(--font-mono); cursor: pointer;
      }
      .data-tab:hover { color: var(--fg-secondary); }
      .data-tab.active { color: var(--tok-key); background: var(--bg-pane); }
      .data-tab .yaml-ver { margin-left: 0; }
      /* Output-pane view tabs: flat underline tabs in a tab strip (.tabs-wrap),
         sitting flush with its bottom border (no pill borders — real tabs). */
      .view-tabs { display: inline-flex; align-self: stretch; height: 100%; }
      .view-tab {
        height: 100%; display: inline-flex; align-items: center; padding: 0 12px;
        border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
        background: transparent; color: var(--fg-faint);
        font: 11px/1 var(--font-mono); cursor: pointer; white-space: nowrap;
      }
      .view-tab:hover { color: var(--fg-secondary); }
      .view-tab.active { color: var(--tok-key); border-bottom-color: var(--accent); }
      /* Contextual controls row: only the controls relevant to the active view
         (Highlight for Plain Text, Escape for rendered views, Allow scripts for
         previews). Hidden entirely when the view needs none. */
      .view-controls {
        flex: 0 0 auto; min-height: 30px; display: flex; align-items: center; gap: 8px;
        padding: 4px 12px; border-bottom: 1px solid var(--border); background: var(--bg-pane);
      }
      .view-controls[hidden] { display: none; }
      /* Read-only inspector panels shown in place of the data editor. */
      .data-inspect { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--bg-pane); }
      .data-inspect[hidden] { display: none; }
      .yaml-ver {
        margin-left: auto; color: var(--fg-faint);
        font-size: 10px; font-weight: bold; letter-spacing: .02em; opacity: .7;
      }
      .workspace.stacked .editors { flex-direction: row; }
      .editor-pane { display: block; overflow: hidden; min-width: 0; min-height: 0; }

      .esplitter {
        flex: 0 0 6px; background: var(--border); position: relative;
        cursor: row-resize; transition: background 100ms ease;
      }
      .esplitter::after { content: ""; position: absolute; inset: -3px; }
      .workspace.stacked .esplitter { cursor: col-resize; }
      .esplitter:hover, .esplitter.dragging { background: var(--accent); }

      .editor-pane .cm-editor { height: 100%; font-size: var(--editor-font-size, 13px); }
      /* The picked editor font applies to the file content only (CodeMirror sets
         the family on .cm-scroller); the tab/UI chrome keeps --font-mono. */
      .editor-pane .cm-scroller { overflow: auto; font-family: var(--editor-font, var(--font-mono)); }
      .editor-pane .cm-gutters {
        background: var(--bg-gutter); border-right: 1px solid var(--border);
        color: var(--fg-faint); min-width: 38px;
      }
      .editor-pane .cm-activeLineGutter { background: var(--accent-softer); color: var(--fg-muted); }
      .editor-pane .cm-content { padding: 8px 0; }
      .editor-pane .cm-line { padding: 0 12px; }
      .editor-pane .cm-selectionBackground { background: var(--accent-soft) !important; }

      /* Handlebars token colours for CM decorations */
      .cm-hb-comment { color: var(--tok-cmt); font-style: italic; }
      .cm-hb-block   { color: var(--tok-tag); font-weight: 500; }
      .cm-hb-partial { color: var(--tok-str); font-weight: 500; }
      .cm-hb-raw     { color: var(--tok-num); }
      .cm-hb-expr    { color: var(--tok-key); }
      /* YAML scalar keywords (true/false/null/…) and numbers — the YAML grammar
         leaves these as plain content, so they are highlighted via a decorator. */
      .cm-yaml-kw    { color: var(--tok-tag); font-weight: 600; }
      .cm-yaml-num   { color: var(--tok-num); }

      /* ── Output pane ─────────────────────────────────────────────── */
      .output-body {
        flex: 1 1 auto; min-height: 0; position: relative;
        background: var(--bg-pane); overflow: hidden;
      }
      .output-body iframe { width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }
      /* The Plain Text + Render Data outputs share one read-only CodeMirror editor
         (syntax-highlighted, language auto-switched). It overlays the iframe area. */
      .src-view { position: absolute; inset: 0; background: var(--bg-1); }
      #output-text .cm-editor { height: 100%; font-size: var(--editor-font-size, 13px); }
      #output-text .cm-scroller { font-family: var(--editor-font, var(--font-mono)); }
      .output-body[data-empty="true"]::after {
        content: "no output"; position: absolute; inset: 0;
        display: grid; place-items: center;
        color: var(--fg-faint); font-size: 12px; pointer-events: none;
      }

      /* Plain Text view: each run of output is a segment (a CM mark decoration)
         tracing back to the file (and, for expressions, the tag) that produced it.
         Hover to highlight + tooltip; click (or Enter on the cursor) to jump. */
      #output-text .seg { border-radius: 2px; cursor: pointer; }
      #output-text .seg-expr {
        font-weight: 700; color: var(--tok-key);
        box-shadow: inset 0 -1px 0 var(--accent-soft);
      }
      #output-text .seg:hover,
      #output-text .cm-out-linked {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      /* The editor/tab side of the link: hovering an output run highlights its
         source span in the editor (if shown) or tints its tab (if not). Visually
         kin to .seg:hover, distinct from the text selection and lint marks. */
      .cm-link-highlight {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent);
        border-radius: 2px;
      }
      .tab.tab-linked { box-shadow: inset 0 -2px 0 var(--accent); }
      .seg-tip {
        position: fixed; z-index: 60; max-width: 340px; padding: 6px 9px;
        border-radius: 7px; background: var(--bg-pane); color: var(--fg);
        border: 1px solid var(--border); box-shadow: var(--shadow-pop);
        font: 11.5px/1.45 system-ui, sans-serif; pointer-events: none;
      }
      .seg-tip .seg-tip-file { color: var(--accent-2); font-weight: 600; }
      .seg-tip code {
        display: block; margin-top: 3px; font: 11px/1.4 var(--font-mono);
        color: var(--fg-secondary); word-break: break-all;
      }
      .seg-tip .seg-tip-hint {
        display: flex; align-items: center; gap: 4px; margin-top: 5px;
        padding-top: 4px; border-top: 1px solid var(--border);
        color: var(--fg-faint); font-size: 10.5px;
      }
      .seg-tip[hidden] { display: none; }

      /* ── Diagnostics dock ────────────────────────────────────────── */
      .dock {
        flex: 0 0 auto; height: 240px; min-height: 28px;
        display: flex; flex-direction: column;
        background: var(--bg-pane); border-top: 1px solid var(--border);
        position: relative;
      }
      .dock[hidden] { display: none; }
      .dock.collapsed { height: 30px; }
      .dock-grip {
        position: absolute; top: -3px; left: 0; right: 0; height: 6px;
        cursor: row-resize; background: transparent;
      }
      .dock-grip:hover, .dock-grip.dragging { background: var(--accent); }
      /* While dragging the dock grip, let the iframe not swallow the pointer. */
      body.dragging-dock { cursor: row-resize; user-select: none; }
      body.dragging-dock #output-preview { pointer-events: none; }
      .dock-header {
        flex: 0 0 30px; display: flex; align-items: stretch;
        border-bottom: 1px solid var(--border); background: var(--bg-1);
      }
      .dock-tabs { display: flex; align-items: stretch; }
      .dock-tab {
        appearance: none; border: 0; background: transparent; cursor: pointer;
        padding: 0 12px; font: 11px var(--font-ui); color: var(--fg-muted);
        display: flex; align-items: center; gap: 6px; position: relative;
      }
      .dock-tab:hover { background: var(--bg-2); color: var(--fg); }
      .dock-tab.active { color: var(--fg); background: var(--bg-pane); }
      .dock-tab.active::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
        height: 2px; background: var(--accent);
      }
      .dock-tab .badge {
        font: 10px var(--font-mono); padding: 0 5px; border-radius: 8px;
        background: var(--bg-3); color: var(--fg-muted);
      }
      .dock-tab .badge.danger  { background: var(--danger-faint); color: var(--danger); }
      .dock-tab .badge.warn    { background: var(--warn-faint); color: var(--warn); }
      .dock-tab .badge.success { background: var(--success-faint); color: var(--success); }
      .dock-actions { margin-left: auto; display: flex; align-items: center; padding: 0 8px; }
      .dock-actions button {
        appearance: none; border: 0; background: transparent; cursor: pointer;
        color: var(--fg-muted); padding: 4px; border-radius: 4px; display: flex;
      }
      .dock-actions button:hover { background: var(--bg-2); color: var(--fg); }
      .dock-actions svg { width: 12px; height: 12px; }
      .dock-body { flex: 1 1 auto; overflow: auto; min-height: 0; }
      .dock.collapsed .dock-body { display: none; }

      .problem {
        display: grid; grid-template-columns: 18px 130px 1fr auto;
        gap: 10px; align-items: baseline;
        padding: 8px 14px; border-bottom: 1px solid var(--bg-2);
        font-size: 12px;
      }
      .problem { cursor: pointer; }
      .problem:hover { background: var(--bg-1); }
      .problem .sev {
        width: 14px; height: 14px; border-radius: 3px; color: #fff;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700;
      }
      .problem.error .sev, .problem.render .sev { background: var(--danger); }
      .problem.cap .sev { background: var(--warn); }
      .problem .where { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }
      .problem .msg { color: var(--fg); }
      .problem .src { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }
      .problem-empty { padding: 20px; text-align: center; color: var(--fg-faint); font-size: 12px; }
      .problem-empty b { color: var(--success); }

      .dep-pane { position: relative; height: 100%; display: grid; grid-template-columns: 1fr 220px; }
      .dep-svg-wrap { position: relative; overflow: auto; }
      .dep-svg { display: block; width: 100%; height: 100%; }
      .dep-side {
        border-left: 1px solid var(--border); background: var(--bg-1);
        padding: 10px 12px; font-size: 12px; overflow-y: auto;
      }
      .dep-side h4 {
        margin: 0 0 6px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--fg-secondary);
      }
      .dep-side ul { list-style: none; padding: 0; margin: 0 0 12px; }
      .dep-side li {
        padding: 4px 0; display: flex; gap: 8px; align-items: baseline;
        font-family: var(--font-mono); font-size: 11px;
      }
      .dep-side li .arrow { color: var(--fg-faint); }
      .dep-side li.cycle { color: var(--danger); }
      .dep-side li.linked { cursor: pointer; border-radius: 4px; }
      .dep-side li.linked:hover { color: var(--accent-2); background: var(--accent-softer); }
      .dep-empty { padding: 20px; text-align: center; color: var(--fg-faint); font-size: 12px; }
      .dep-node rect { fill: var(--bg); stroke: var(--border-strong); stroke-width: 1.2; }
      .dep-node.main rect { fill: var(--accent-softer); stroke: var(--accent); stroke-width: 1.6; }
      .dep-node.cycle rect { stroke: var(--danger); stroke-width: 1.6; }
      .dep-node.missing rect { fill: var(--warn-faint); stroke: var(--warn); stroke-dasharray: 3 2; }
      .dep-node text { font: 11.5px var(--font-mono); fill: var(--fg); }
      .dep-node.main text { fill: var(--accent-2); font-weight: 600; }
      .dep-edge { stroke: var(--border-strong); stroke-width: 1.4; fill: none; marker-end: url(#dep-arrow); }
      .dep-edge.cycle { stroke: var(--danger); stroke-width: 1.8; }
      .dep-edge.missing { stroke: var(--warn); stroke-dasharray: 3 2; }

      .ctx-pane { padding: 12px 14px; display: grid; gap: 10px; }
      .ctx-hint {
        padding: 8px 12px; border-radius: 6px; font-size: 12px;
        background: var(--accent-softer); border: 1px dashed var(--accent-soft);
        color: var(--accent-2);
      }
      .ctx-snap { border: 1px solid var(--border); border-radius: 6px; background: var(--bg-1); overflow: hidden; }
      .ctx-snap-head {
        display: flex; align-items: center; gap: 8px; padding: 6px 12px;
        background: var(--bg-2); border-bottom: 1px solid var(--border);
        font-family: var(--font-mono); font-size: 11px;
      }
      .ctx-snap-head .ix { background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 3px; font-weight: 700; }
      .ctx-snap-head .src { color: var(--accent-2); background: var(--accent-softer); padding: 1px 5px; border-radius: 3px; }
      .ctx-snap-table {
        display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px;
        padding: 8px 12px; font: 11.5px/1.45 var(--font-mono);
      }
      .ctx-snap-table .key { color: var(--accent-2); font-weight: 600; }
      .ctx-snap-table .val { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
      .ctx-snap-table .val .ty { color: var(--fg-faint); font-style: italic; margin-left: 6px; }

      .ast-pane { padding: 6px 0; font: 12px/1.6 var(--font-mono); }
      .ast-row { display: flex; align-items: baseline; padding: 1px 14px 1px 0; color: var(--fg-secondary); }
      .ast-row.linked { cursor: pointer; color: var(--fg); }
      .ast-row.linked:hover { background: var(--accent-softer); }
      .ast-ln {
        flex: 0 0 auto; width: 38px; text-align: right; padding-right: 12px;
        color: var(--fg-faint); user-select: none;
      }
      .ast-content { flex: 1 1 auto; min-width: 0; white-space: pre; }
      .ast-kw { color: var(--tok-key); }

      .dock-toggle {
        appearance: none; border: 1px solid var(--border); background: var(--bg);
        color: var(--fg-muted); cursor: pointer; font: 11px var(--font-ui);
        display: flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 4px;
      }
      .dock-toggle:hover { background: var(--bg-2); color: var(--fg); }
      .dock-toggle.active { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-softer); }

      /* ── Status bar ──────────────────────────────────────────────── */
      .statusbar {
        flex: 0 0 var(--statusbar-h); height: var(--statusbar-h);
        display: flex; align-items: center; gap: 14px; padding: 0 12px;
        background: var(--bg-statusbar); border-top: 1px solid var(--border);
        font-size: 11.5px; color: var(--fg-secondary); user-select: none;
      }
      .statusbar .status-pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 2px 8px; border-radius: 999px;
      }
      .statusbar .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--success); display: inline-block;
      }
      .statusbar.has-error .dot { background: var(--danger); }
      .statusbar.has-error .status-pill {
        background: var(--danger-faint); color: var(--danger); font-weight: 500;
      }
      .statusbar:not(.has-error) .status-pill { color: var(--success); }
      .statusbar .status-msg { color: inherit; font-family: var(--font-mono); }
      .statusbar .meta { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }
      .statusbar .status-sub { color: var(--fg-faint); font-family: var(--font-mono); font-size: 11px; }
      .statusbar .status-sub:empty { display: none; }
      .statusbar .meta b { color: var(--fg-secondary); font-weight: 600; }

      /* ── Command palette ─────────────────────────────────────────── */
      .palette-backdrop {
        position: fixed; inset: 0; background: rgba(24,24,27,.28);
        display: grid; place-items: start center; padding-top: 14vh; z-index: 100;
      }
      .palette {
        width: 480px; max-width: 92vw; background: var(--bg);
        border-radius: 10px; box-shadow: var(--shadow-pop);
        overflow: hidden; border: 1px solid var(--border);
      }
      .palette input {
        width: 100%; border: 0; border-bottom: 1px solid var(--border);
        padding: 12px 14px; font-size: 14px; outline: none;
        background: var(--bg); color: var(--fg);
      }
      .palette ul { list-style: none; margin: 0; padding: 6px 0; max-height: 50vh; overflow-y: auto; }
      .palette li {
        padding: 8px 14px; display: flex; align-items: center; gap: 10px;
        cursor: pointer; font-size: 13px; color: var(--fg);
      }
      .palette li.sel { background: var(--accent-soft); color: var(--accent-2); }
      .palette li .pkind {
        font: 10px/1 var(--font-mono); color: var(--fg-muted); background: var(--bg-2);
        padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: .04em;
      }
      .palette li.sel .pkind { color: var(--accent-2); }

      /* Toast */
      .toast {
        position: fixed; bottom: calc(var(--statusbar-h) + 12px); left: 50%;
        transform: translateX(-50%) translateY(8px); opacity: 0;
        background: #18181b; color: #fff; padding: 8px 14px; border-radius: 6px;
        font-size: 12px; z-index: 200; pointer-events: none;
        transition: opacity 160ms ease, transform 160ms ease;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* ── Focus mode ──────────────────────────────────────────────── */
      .workspace.focus-sources .pane:not(.pane-sources),
      .workspace.focus-sources .splitter,
      .workspace.focus-output .pane:not(.pane-output),
      .workspace.focus-output .splitter { display: none; }
      .workspace.focus-sources .pane-sources,
      .workspace.focus-output .pane-output { flex: 1 1 100% !important; }

      .focus-toggle {
        width: 24px; height: 24px; border-radius: 4px;
        border: 1px solid transparent; background: transparent;
        display: grid; place-items: center; cursor: pointer; color: var(--fg-faint);
      }
      .focus-toggle:hover { background: var(--bg-2); color: var(--fg); }
      .focus-toggle.on { background: var(--accent-soft); color: var(--accent-2); }
      .focus-toggle svg { width: 13px; height: 13px; }

      /* ── Themes ──────────────────────────────────────────────────── */
      /* Dark — mid-dark violet. Used by the explicit Dark theme, and by
         System when the OS prefers a dark color scheme. Light is :root. */
      body[data-theme="dark"] {
        --bg: #16141d; --bg-1: #1b1925; --bg-2: #232030; --bg-3: #2c2940;
        --bg-toolbar: #16141d; --bg-statusbar: #121019;
        --bg-tab-active: #232030; --bg-pane: #1b1925; --bg-gutter: #16141d;
        --fg: #ece9f5; --fg-secondary: #c5bedd; --fg-muted: #968fb0; --fg-faint: #6f6987;
        --border: #2c2940; --border-strong: #423c5c;
        --accent: #9b7dff; --accent-2: #bca6ff;
        --accent-soft: #2e2747; --accent-softer: #221d36;
        --tok-tag: #c4b5fd; --tok-cmt: #76708e; --tok-key: #93c5fd;
        --tok-str: #86efac; --tok-num: #fbbf24;
        --success: #4ade80;
        --danger: #f87171; --danger-faint: #3a1414; --warn: #fbbf24; --warn-faint: #3a2e10; --success-faint: #14321f;
        --shadow-pop: 0 12px 32px -8px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.4);
        background-color: var(--bg) !important;
      }
      body[data-theme="dark"] iframe { background: #16141d; }

      @media (prefers-color-scheme: dark) {
        body[data-theme="system"] {
          --bg: #16141d; --bg-1: #1b1925; --bg-2: #232030; --bg-3: #2c2940;
          --bg-toolbar: #16141d; --bg-statusbar: #121019;
          --bg-tab-active: #232030; --bg-pane: #1b1925; --bg-gutter: #16141d;
          --fg: #ece9f5; --fg-secondary: #c5bedd; --fg-muted: #968fb0; --fg-faint: #6f6987;
          --border: #2c2940; --border-strong: #423c5c;
          --accent: #9b7dff; --accent-2: #bca6ff;
          --accent-soft: #2e2747; --accent-softer: #221d36;
          --tok-tag: #c4b5fd; --tok-cmt: #76708e; --tok-key: #93c5fd;
          --tok-str: #86efac; --tok-num: #fbbf24;
          --success: #4ade80;
          --danger: #f87171; --danger-faint: #3a1414; --warn: #fbbf24; --warn-faint: #3a2e10; --success-faint: #14321f;
          --shadow-pop: 0 12px 32px -8px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.4);
          background-color: var(--bg) !important;
        }
        body[data-theme="system"] iframe { background: #16141d; }
      }

      /* ── Stacked layout ──────────────────────────────────────────── */
      .workspace.stacked { flex-direction: column; }
      .workspace.stacked > .splitter {
        width: 100%; height: 6px; cursor: row-resize; flex: 0 0 6px;
      }
      .workspace.stacked .pane { min-width: 0; min-height: 160px; }

      /* ── Dependencies popup (draggable + resizable) ──────────────── */
      .dep-panel {
        position: fixed; z-index: 150;
        width: 560px; height: 440px; min-width: 320px; min-height: 220px;
        background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
        box-shadow: var(--shadow-pop); display: flex; flex-direction: column;
        overflow: hidden; resize: both;
      }
      .dep-panel[hidden] { display: none; }
      .dep-panel .tw-header { flex: 0 0 auto; }
      .dep-panel .dep-body { flex: 1 1 auto; min-height: 0; }
      .dep-panel .dep-pane { height: 100%; }

      /* Find-in-files Search panel (draggable/resizable, like the dep panel). */
      .search-panel {
        position: fixed; z-index: 150;
        width: 460px; height: 520px; min-width: 320px; min-height: 240px;
        background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
        box-shadow: var(--shadow-pop); display: flex; flex-direction: column;
        overflow: hidden; resize: both;
      }
      .search-panel[hidden] { display: none; }
      .search-panel .tw-header { flex: 0 0 auto; }
      .search-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
      .search-bar input[type="text"] {
        flex: 1 1 auto; height: 28px; padding: 0 8px;
        border: 1px solid var(--border-strong); border-radius: 5px;
        background: var(--bg-pane); color: var(--fg); font: 12px var(--font-mono);
      }
      .search-bar input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .search-case { font: 11px var(--font-mono); color: var(--fg-muted); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
      .search-results { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 0; }
      .search-file { padding: 6px 10px 2px; font: 600 11px var(--font-mono); color: var(--tok-key); position: sticky; top: 0; background: var(--bg); }
      .search-file .n { color: var(--fg-faint); font-weight: 400; margin-left: 6px; }
      .search-hit { display: flex; gap: 8px; padding: 2px 10px 2px 18px; cursor: pointer; font: 12px/1.5 var(--font-mono); color: var(--fg-secondary); }
      .search-hit:hover { background: var(--accent-softer); }
      .search-hit .ln { flex: 0 0 auto; width: 52px; text-align: right; color: var(--fg-faint); }
      .search-hit .txt { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: pre; }
      .search-hit .txt mark { background: var(--accent-soft); color: var(--accent-2); border-radius: 2px; padding: 0 1px; }
      .search-empty { padding: 18px; color: var(--fg-muted); font: 12px var(--font-ui); text-align: center; }

      /* ── Tweaks panel ────────────────────────────────────────────── */
      .tw-panel {
        position: fixed; right: 18px; bottom: 42px; width: 300px;
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 10px; box-shadow: var(--shadow-pop); z-index: 150;
        font-family: var(--font-ui); color: var(--fg); overflow: hidden;
      }
      .tw-header {
        display: flex; align-items: center; gap: 8px; padding: 10px 12px;
        border-bottom: 1px solid var(--border); background: var(--bg-1); cursor: move;
      }
      .tw-title {
        display: flex; align-items: center; gap: 8px;
        font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
      }
      .tw-pill {
        width: 8px; height: 8px; border-radius: 2px;
        background: linear-gradient(135deg, #7c4dff 0%, #10b981 100%);
      }
      .tw-close {
        margin-left: auto; width: 22px; height: 22px; border: 0;
        background: transparent; color: var(--fg-muted); font-size: 18px;
        line-height: 1; border-radius: 4px; cursor: pointer;
      }
      .tw-close:hover { background: var(--bg-2); color: var(--fg); }
      .tw-section { padding: 12px 12px 14px; border-bottom: 1px solid var(--border); }
      .tw-section:last-of-type { border-bottom: 0; }
      .tw-section-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
      .tw-section-title {
        font-size: 10px; font-weight: 700; letter-spacing: .1em;
        text-transform: uppercase; color: var(--fg-secondary);
      }
      .tw-section-hint { font-size: 11px; color: var(--fg-faint); margin-left: auto; }
      .tw-section-body { display: flex; gap: 6px; flex-wrap: wrap; }
      .tw-swatch {
        flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
        align-items: center; gap: 6px; padding: 8px 6px;
        border: 1px solid var(--border); border-radius: 6px; background: var(--bg); cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease;
      }
      .tw-swatch:hover { background: var(--bg-1); }
      .tw-swatch.on { border-color: var(--accent); background: var(--accent-softer); }
      .tw-swatch-grid {
        width: 100%; height: 28px; border-radius: 4px; border: 1px solid var(--border);
        background: linear-gradient(135deg, var(--c1) 0%, var(--c1) 40%, var(--c2) 40%, var(--c2) 70%, var(--c3) 70%);
      }
      .tw-swatch-label { font-size: 11px; font-weight: 600; color: var(--fg-secondary); }
      .tw-swatch.on .tw-swatch-label { color: var(--accent-2); }
      .tw-segmented { display: flex; flex: 1 1 100%; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
      .tw-segmented button {
        flex: 1 1 0; border: 0; background: var(--bg); padding: 8px 10px;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        font-size: 12px; font-weight: 500; color: var(--fg-secondary); cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }
      .tw-segmented button svg { width: 14px; height: 14px; flex: 0 0 auto; }
      .tw-segmented button + button { border-left: 1px solid var(--border); }
      .tw-segmented button:hover { background: var(--bg-1); }
      .tw-segmented button.on { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
      .tw-foot {
        padding: 8px 12px 10px; font-size: 11px; color: var(--fg-faint);
        background: var(--bg-1); border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <!-- Apply the saved theme before first paint (the module below loads
         CodeMirror from a CDN and would otherwise set it seconds later, flashing
         the light default). Mirrors the tweaks defaults in the module. -->
    <script>
      (function () {
        var theme = "system";
        try {
          var tw = JSON.parse(localStorage.getItem("stem-playground:tweaks") || "{}");
          if (tw.theme === "dim") tw.theme = "dark";
          if (["light", "dark", "system"].indexOf(tw.theme) >= 0) theme = tw.theme;
        } catch (e) {}
        document.body.dataset.theme = theme;
      })();
    </script>
    <div id="app">
      <!-- ── Top bar ──────────────────────────────────────────────── -->
      <header class="topbar">
        <div class="brand">
          <!-- Nested-brace mark from the cheat-sheet reference header, themed via
               CSS vars so it tracks light/dark. Outer braces solid, inner braces
               faded; a green stem with two branches threads through the middle. -->
          <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M10 11 C6 11 6 13 6 17 L6 21 C6 23 3 24 3 24 C3 24 6 25 6 27 L6 31 C6 35 6 37 10 37" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 11 C12 11 12 13 12 17 L12 21 C12 23 9 24 9 24 C9 24 12 25 12 27 L12 31 C12 35 12 37 16 37" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
            <path d="M32 11 C36 11 36 13 36 17 L36 21 C36 23 39 24 39 24 C39 24 36 25 36 27 L36 31 C36 35 36 37 32 37" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
            <path d="M38 11 C42 11 42 13 42 17 L42 21 C42 23 45 24 45 24 C45 24 42 25 42 27 L42 31 C42 35 42 37 38 37" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="stem-line" d="M24 13 L24 38" stroke="var(--stem-green)" stroke-width="2.4" stroke-linecap="round"/>
            <path class="stem-line" d="M24 22 C21 20 19 20 17 21" stroke="var(--stem-green)" stroke-width="2" stroke-linecap="round"/>
            <path class="stem-line" d="M24 29 C27 27 29 27 31 28" stroke="var(--stem-green)" stroke-width="2" stroke-linecap="round"/>
            <circle class="stem-dot" cx="24" cy="13" r="2" fill="var(--stem-green)"/>
          </svg>
          <span class="brand-name"><b>Stem</b> Playground</span>
          <span class="brand-ver" id="brand-ver" title="Compiled engine version (from the wasm build)"></span>
        </div>
        <div class="divider"></div>
        <div class="topbar-group">
          <span class="field-label">Example</span>
          <!-- Custom dropdown (not a native <select>) so the menu always opens
               downward — a native select centres its popup on the selection and
               can overflow above the control. -->
          <div id="example-select" class="dropdown">
            <button id="example-trigger" class="select dropdown-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-label="Load example">
              <span id="example-label">(custom)</span>
              <svg class="dropdown-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul id="example-menu" class="dropdown-menu" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="topbar-group">
          <button id="share-btn" class="btn" title="Copy a link that restores this template and data">Copy link</button>
          <button id="cmd-btn" class="btn" title="Open command palette">Commands <span class="kbd-inline">⌘⇧P</span></button>
          <button id="search-btn" class="btn" title="Find in all files (⌘⇧F)">Search <span class="kbd-inline">⌘⇧F</span></button>
          <button id="deps-btn" class="btn" title="Partial dependency graph">Dependencies</button>
          <button id="tweaks-btn" class="btn" title="Appearance settings (theme, layout)">Appearance</button>
        </div>
        <div class="spacer"></div>
      </header>

      <!-- ── Workspace ────────────────────────────────────────────── -->
      <main class="workspace">
        <!-- Sources pane: template + partial tabs + data.yaml tab -->
        <section class="pane pane-sources" aria-label="Sources">
          <div class="tabs-wrap">
            <div class="tabs" id="tmpl-tabs"></div>
            <button class="focus-toggle" data-pane="sources" title="Focus this pane (Esc to exit)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/>

          </div>

          <!-- Contextual controls for Sources: the capability groups the engine
               loads for rendering. Minimum is always on; the rest are opt-in. A
               template that uses a transformer from an unchecked group is
               refused, surfacing the engine's group-naming message — the
               secure-by-default model, made interactive. -->
          <div class="view-controls">
            <span class="field-label" style="font-size:11px" title="Transformer capability groups — controls which built-in transformers the template may use">Groups</span>
            <span id="caps-select" role="group" aria-label="Capability groups" style="display:inline-flex;gap:8px;align-items:center;font-size:11px">

                  class="grp-dot" style="color:#6b7280">●</span> default</label>
              <label data-group="format"><input type="checkbox" class="cap" value="format"> <span class="grp-dot"
                  style="color:#22c55e">●</span> format</label>
              <label data-group="transform"><input type="checkbox" class="cap" value="transform"> <span class="grp-dot" style="color:#f59e0b">●</span> transform</label>
              <label data-group="eval"><input type="checkbox" class="cap" value="eval"> <span class="grp-dot" style="color:#a855f7">●</span> eval</label>

          <!-- Template + data shown together: side-by-side (split) or

          <div class="editors">

            <div class="esplitter" id="editor-splitter" title="Drag to resize · double-click to reset"></div>

              <!-- Read-only introspection panels (Context Inspector / Syntax Tree),
                   shown in place of the data editor when their tab is active. -->

        <div id="splitter-1" class="splitter" role="separator" aria-orientation="vertical"
             title="Drag to resize · double-click to reset"></div>

        <!-- Output pane -->
        <section class="pane pane-output" aria-label="Output">
          <!-- Output view tabs (same layout as the Sources tab strip). "source"
               = the output as text with click-to-source provenance;
               "rendered"/"markdown" = the iframe; "data" = the post-transform
               view-model as YAML; "bytecode" = the wire disassembly. The view
               keys are kept stable (used by examples + URL state). Painted by
               renderViewTabs(). -->
          <div class="tabs-wrap">
            <div id="view-tabs" class="view-tabs" role="tablist" aria-label="Output view"></div>
            <button class="focus-toggle" data-pane="output" title="Focus this pane (Esc to exit)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/>

          <!-- Contextual controls for the active view; toggled by setOutputView. -->
          <div id="view-controls" class="view-controls" hidden>
            <span class="field-label" id="out-lang-label" style="font-size:11px" hidden>Highlight</span>
            <input id="out-lang-input" class="select" style="width:130px" list="out-lang-list" aria-label="Plain Text highlight language" title="Type to search ~140 languages" placeholder="Plain text" autocomplete="off" hidden />
            <datalist id="out-lang-list"></datalist>

              <option value="">(as compiled)</option>

            <!-- HTML/Markdown preview: run <script> in the preview. The frame
                 is re-sandboxed to allow-scripts WITHOUT allow-same-origin, so

            <label id="scripts-toggle" class="field-label"
                   style="font-size:11px; display:none; align-items:center; gap:4px; cursor:pointer"
                   title="Run &lt;script&gt; in the preview (sandboxed: isolated origin, no access to this page)">

      <div id="grp-tip" class="seg-tip" role="tooltip" hidden style="max-width:200px;white-space:normal;line-height:1.6"></div>
      </main>

      <!-- ── Diagnostics dock ──────────────────────────────────────── -->
      <aside id="dock" class="dock" aria-label="Diagnostics" hidden>
        <div id="dock-grip" class="dock-grip" title="Drag to resize"></div>
        <header class="dock-header">
          <div class="dock-tabs">
            <button class="dock-tab active" data-dock="problems">
              Problems <span class="badge" id="dock-badge-problems">0</span>
            </button>
          </div>
          <div class="dock-actions">
            <button id="dock-collapse" title="Close" aria-label="Close diagnostics">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
          </div>
        </header>
        <div id="dock-body" class="dock-body"></div>
      </aside>

      <!-- ── Status bar ────────────────────────────────────────────── -->
      <footer class="statusbar">
        <span class="status-pill">
          <span class="dot"></span>
          <span id="status-msg" class="status-msg">no errors</span>
        </span>
        <!-- Contextual note for the active source tab (e.g. "partial · referenced
             as {{> styles}}"); empty for main. Lives here now that the panes have
             no title header. -->
        <span id="sources-sub" class="status-sub"></span>
        <button id="dock-toggle" class="dock-toggle" title="Show/hide diagnostics dock" aria-pressed="false">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="11" height="11" rx="1"/><path d="M2.5 10.5h11"/></svg>
          Diagnostics
        </button>
        <span class="spacer"></span>
        <span id="status-meta" class="meta"></span>
      </footer>
    </div>

    <!-- Apply the stored split ratios synchronously, before first paint, so the
         layout doesn't flash the CSS default and then snap when the deferred
         module's applySplits() runs. Uses flex-basis percentages (no measuring);
         the module later refines them to exact pixels, imperceptibly. -->
    <script>
      (function () {
        try {
          var splits = JSON.parse(localStorage.getItem("stem-playground:splits.v3") || "{}");
          var tweaks = JSON.parse(localStorage.getItem("stem-playground:tweaks") || "{}");
          var stacked = tweaks.layout === "stacked";
          var panes = document.querySelectorAll(".workspace > .pane");
          var w = splits[stacked ? "h0" : "w0"];
          if (panes[0] && typeof w === "number") {
            panes[0].style.flex = "0 0 " + w * 100 + "%";
            if (panes[1]) panes[1].style.flex = "1 1 0";
          }
          var e = splits[stacked ? "ew" : "eh"];
          var tpl = document.getElementById("template-editor-container");
          if (tpl && typeof e === "number") tpl.style.flex = "0 0 " + e * 100 + "%";
        } catch (e) {}
      })();
    </script>

    <script type="module">
      import { createRenderer } from "./stem.mjs";
      import {
        astOutline,
        buildDependencyGraph,
        byteRangeToCharRange,
        charToByte,
        charToLineColumn,
        debounce,
        decodeState,
        disassemble,
        encodeState,
        partialNameAt
      } from "./playground_utils.mjs";
      import { EditorState, Annotation, StateField, StateEffect, Compartment } from "https://esm.sh/@codemirror/state@6.5.2/es2022/state.mjs";
      import {
        Decoration,
        EditorView,
        MatchDecorator,
        ViewPlugin,
        keymap,
        lineNumbers,
        highlightActiveLine,
        highlightActiveLineGutter
      } from "https://esm.sh/@codemirror/view@6.38.8/X-ZEBjb2RlbWlycm9yL3N0YXRlQDYuNS4y/es2022/view.mjs";
      import { defaultKeymap, history as cmHistory, historyKeymap, indentWithTab } from "https://esm.sh/@codemirror/commands@6.10.3?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      import { HighlightStyle, StreamLanguage, bracketMatching, syntaxHighlighting } from "https://esm.sh/@codemirror/language@6.11.3?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      import { tags as t } from "https://esm.sh/@lezer/highlight@1.2.3?target=es2022";
      import { lintGutter, linter, setDiagnosticsEffect } from "https://esm.sh/@codemirror/lint@6.8.5?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      import { yaml } from "https://esm.sh/@codemirror/lang-yaml@6.1.3?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8,@codemirror/language@6.11.3";
      import { html } from "https://esm.sh/@codemirror/lang-html@6.4.11?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8,@codemirror/language@6.11.3";
      import { markdown } from "https://esm.sh/@codemirror/lang-markdown@6.3.4?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8,@codemirror/language@6.11.3,@codemirror/lang-html@6.4.11";
      // The full CodeMirror language registry (~140 langs): metadata + a lazy
      // load() per language. Dep-pinned so the lazily-imported grammars reuse this
      // page's @codemirror/state·view·language instances (no duplicate-instance bug).
      import { languages as cmLanguages } from "https://esm.sh/@codemirror/language-data@6.5.1?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8,@codemirror/language@6.11.3";
      import { load as loadYaml, dump as dumpYaml } from "./vendor/js-yaml.mjs";
      import { marked } from "./vendor/marked.mjs";
      import jsonata from "./vendor/jsonata.mjs";

      // ── Bootstrap ─────────────────────────────────────────────────────
      const WASM = "./wasm/stem_native_bg.wasm";
      const LS_SPLIT  = "stem-playground:splits.v3";
      const LS_TWEAKS = "stem-playground:tweaks";
      const LS_OUTLANG = "stem-playground:outlang";

      const byId = (id) => document.getElementById(id);
      const qs   = (sel) => document.querySelector(sel);

      const renderer = await createRenderer(await (await fetch(WASM)).arrayBuffer());
      // Show the version baked into the compiled wasm engine.
      byId("brand-ver").textContent = "v" + renderer.version;
      const examples = await (await fetch("./examples.json")).json();

      // ── State ─────────────────────────────────────────────────────────
      let tabs        = [{ name: "main", source: "" }];
      let activeTabIdx = 0;
      let loadedExampleIdx = -1;      // which example is loaded (-1 = custom/edited)
      let exampleModified  = false;  // true when a loaded example has been edited
      let activeView   = "tmpl";      // "tmpl" | "data"
      let outputView   = "rendered";  // "rendered" | "source"
      let allowScripts = false;       // HTML/Markdown preview: run <script> in an isolated sandbox
      let escapeMode   = "";
      // Opt-in capability groups loaded for rendering (Minimum is always on).
      // Groups are risk-based: format (low — value transforms),
      // transform (moderate — structural/iterative). Default group is always on.
      // Examples declare their own required groups; fresh page state has none enabled.
      const DEFAULT_GROUPS = ["format", "transform"];
      let groups       = [];
      let focusMode    = null;
      let templateDiagnostics = [];
      let yamlSrc      = "";
      // Optional transform applied to the parsed data before rendering
      // (the data->view-model "Controller"). Empty string = pass data through.
      let transformSrc = "";
      let dataTab      = "data";    // "data" | "transform"
      let yamlDirty      = false;
      let transformDirty = false;

      const GROUP_META = {
        default: {
          risk: "always", color: "#6b7280",
          sections: [
            { label: "Escaping",   items: [["escape_html"],["escape_json"]] },
            { label: "Encoding",   items: [["inspect"],["json"]] },
            { label: "Utility",   items: [["default"],["join"],["log"]] },
            { label: "Access",     items: [["first"],["last"],["lookup"]] },
            { label: "Predicates", items: [["contains"],["empty?"],["len"],["present?"]] },
            { label: "Strings",    items: [["ends_with"],["starts_with"]] },
          ]
        },
        format: {
           risk: "low", color: "#22c55e",
          sections: [
            { label: "Case",    items: [["capitalize"],["downcase"],["upcase"]] },
            { label: "Shaping", items: [["replace"],["trim"],["truncate"]] },
          ]
        },
        transform: {
            risk: "medium", color: "#f59e0b",
          sections: [
            { label: "Sequences",  items: [["drop"],["reverse"],["slice"],["split"],["take"]] },
            { label: "Cleanup",    items: [["compact"],["flatten"],["uniq"]] },
            { label: "Ordering",   items: [["group_by"],["sort"],["sort_by"]] },
            { label: "Projection", items: [["filter"],["map"]] },
          ]
        },
        eval: {
          risk: "dynamic", color: "#a855f7",
          sections: [
            { label: "Expression", items: [["eval"]] },
          ]
        },
      };

      const activeTab = () => tabs[activeTabIdx];

      function partialsMap() {
        const map = {};
        for (let i = 1; i < tabs.length; i++) map[tabs[i].name] = tabs[i].source;
        return map;
      }

      // ── CodeMirror ────────────────────────────────────────────────────
      const hbExprMark    = Decoration.mark({ class: "cm-hb-expr" });
      const hbCommentMark = Decoration.mark({ class: "cm-hb-comment" });
      const hbBlockMark   = Decoration.mark({ class: "cm-hb-block" });
      const hbPartialMark = Decoration.mark({ class: "cm-hb-partial" });
      const hbRawMark     = Decoration.mark({ class: "cm-hb-raw" });

      const handlebarsDecorator = new MatchDecorator({
        regexp: /\{\{!--[\s\S]*?--\}\}|\{\{![\s\S]*?\}\}|\{\{\{[\s\S]*?\}\}\}|\{\{[\s\S]*?\}\}/g,
        decoration(match) {
          const t = match[0];
          if (t.startsWith("{{!--") || t.startsWith("{{!")) return hbCommentMark;
          if (t.startsWith("{{{"))  return hbRawMark;
          if (t.startsWith("{{>") || t.startsWith("{{ >")) return hbPartialMark;
          if (t.startsWith("{{#") || t.startsWith("{{/") || /^\{\{\s*else\b/.test(t)) return hbBlockMark;
          return hbExprMark;
        }
      });

      const handlebarsHighlighting = ViewPlugin.fromClass(
        class {
          constructor(view) { this.decorations = handlebarsDecorator.createDeco(view); }
          update(update) { this.decorations = handlebarsDecorator.updateDeco(update, this.decorations); }
        },
        { decorations: (v) => v.decorations }
      );

        // YAML scalar-value highlighting. The YAML grammar tags bare scalars as
        // plain content, so booleans/null keywords and numbers get no color. This
        // decorator highlights them when they sit in value position — after `key:`
        // or a `-` sequence dash and spanning the rest of the line (an optional
        // trailing comment aside) — so keys and string values are left untouched.
        const yamlKwMark = Decoration.mark({ class: "cm-yaml-kw" });
        const yamlNumMark = Decoration.mark({ class: "cm-yaml-num" });
        const yamlDecorator = new MatchDecorator({
          regexp: /(?<=:[^\S\n]+|^[^\S\n]*-[^\S\n]+)(?:true|false|null|True|False|Null|TRUE|FALSE|NULL|~|[-+]?\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?)(?=[^\S\n]*(?:#.*)?$)/gm,
          decoration: (match) => (/^[-+.\d]/.test(match[0]) ? yamlNumMark : yamlKwMark)
        });

        const yamlHighlighting = ViewPlugin.fromClass(
          class {
            constructor(view) { this.decorations = yamlDecorator.createDeco(view); }
            update(update) { this.decorations = yamlDecorator.updateDeco(update, this.decorations); }
          },
          { decorations: (v) => v.decorations }
        );

      // Link highlight: a single transient decoration over the source span of
      // the output run currently hovered. It is a decoration (not a selection),
      // so the caret never moves — hovering only highlights; clicking moves the
      // caret. Lives on the template editor only (the data editor hosts no
      // provenance). `setLinkHighlight.of({from,to})` sets it; `.of(null)` clears.
      const linkMark = Decoration.mark({ class: "cm-link-highlight" });
      const setLinkHighlight = StateEffect.define();
      const linkHighlightField = StateField.define({
        create() { return Decoration.none; },
        update(deco, tr) {
          deco = deco.map(tr.changes);
          for (const e of tr.effects) {
            if (e.is(setLinkHighlight)) {
              deco = e.value
                ? Decoration.set([linkMark.range(e.value.from, e.value.to)])
                : Decoration.none;
            }
          }
          return deco;
        },
        provide: (f) => EditorView.decorations.from(f),
      });

      // Make CM fill its container (height driven by flex parent)
      const fillTheme = EditorView.theme({
        "&": { height: "100%" },
        ".cm-scroller": { overflow: "auto" }
      });

      // Theme-aware syntax colors. CodeMirror's defaultHighlightStyle is tuned
      // for light backgrounds and is unreadable on the dark theme, so map the
      // grammar tags to the per-theme --tok-* variables instead. The tags come
      // from the same @lezer/highlight build the language packages use, so the
      // styleTags they declare resolve to these rules in both light and dark.
      const themeHighlight = HighlightStyle.define([
        { tag: t.comment, color: "var(--tok-cmt)", fontStyle: "italic" },
        { tag: [t.tagName, t.keyword, t.typeName, t.labelName], color: "var(--tok-tag)" },
        { tag: [t.attributeName, t.propertyName, t.definition(t.propertyName)], color: "var(--tok-key)" },
        { tag: [t.string, t.attributeValue, t.special(t.string)], color: "var(--tok-str)" },
        { tag: [t.number, t.bool, t.null, t.atom], color: "var(--tok-num)" },
        { tag: [t.angleBracket, t.punctuation, t.separator, t.meta], color: "var(--fg-muted)" },
        { tag: t.invalid, color: "var(--danger)" },
      ]);

      // Lightweight highlighter for the JSONata transform editor: $functions and
      // variables, strings, numbers, block comments, and operators. Token style
      // names map through themeHighlight (already in the editors' extensions).
      const jsonataLang = StreamLanguage.define({
        token(stream) {
          if (stream.match(/\/\*/)) {
            while (!stream.match(/\*\//) && !stream.eol()) stream.next();
            return "comment";
          }
          if (stream.match(/"(?:[^"\\]|\\.)*"/) || stream.match(/'(?:[^'\\]|\\.)*'/)) return "string";
          if (stream.match(/\$[a-zA-Z_]\w*/) || stream.match(/\$/)) return "keyword";
          if (stream.match(/-?\d+(\.\d+)?([eE][+-]?\d+)?/)) return "number";
          if (stream.match(/(?:true|false|null)\b/)) return "atom";
          if (stream.match(/[a-zA-Z_]\w*/)) return "variableName";
          if (stream.match(/[+\-*/%=<>!&|~?:^@.]+/)) return "operator";
          stream.next();
          return null;
        },
      });

      // Highlighter for the Bytecode disassembly view: uppercase opcodes/operands
      // as keywords, quoted literals as strings, plus numbers and nil/bool atoms.
      const BC_KEYWORDS =
        /^(?:EMIT_TEXT|EMIT|IF|THEN|ELSE|EACH|WITH|DO|SCOPE|GET|ASSIGNS|ASSIGN|LOCAL|THIS|PARENT|ROOT|INDEX0|INDEX1|KEY|FIRST|LAST|LIT|CALL|ESCAPE|AS)\b/;
      const bytecodeLang = StreamLanguage.define({
        token(stream) {
          if (stream.sol() && stream.match(/;.*/)) return "comment";
          if (stream.eatSpace()) return null;
          if (stream.match(/"(?:[^"\\]|\\.)*"/)) return "string";
          if (stream.match(BC_KEYWORDS)) return "keyword";
          if (stream.match(/-?\d+(\.\d+)?/)) return "number";
          if (stream.match(/(?:true|false|nil|null)\b/)) return "atom";
          if (stream.match(/[A-Za-z_]\w*/)) return "variableName";
          stream.next();
          return null;
        },
      });

      // The line-number gutter lives in a compartment so the Appearance toggle
      // can switch it on/off live (applyTweaks reconfigures both editors).
      const lineNumberComp = new Compartment();
      // The data pane hosts two tabs (YAML data + JSONata transform); its language
      // support lives in a compartment so showDataTab can swap it live.
      const dataLangComp = new Compartment();
      const sharedExts = [
        lineNumberComp.of(lineNumbers()), highlightActiveLineGutter(), highlightActiveLine(),
        bracketMatching(), syntaxHighlighting(themeHighlight),
        cmHistory(), keymap.of([...defaultKeymap, ...historyKeymap, indentWithTab]),
        fillTheme,
      ];

      const templateView = new EditorView({
        parent: byId("template-editor-container"),
        state: EditorState.create({
          doc: "",
          extensions: [
            ...sharedExts,
            html(),
            handlebarsHighlighting,
            linkHighlightField,
            lintGutter(),
            linter(() => templateDiagnostics),
            EditorView.updateListener.of((u) => {
              if (u.docChanged && !isProgrammatic(u)) {
                activeTab().source = u.state.doc.toString();
                tabs[activeTabIdx].dirty = true;
                renderTabs();
                scheduleRun();
              }
              if (u.selectionSet) { updateStatusMeta(); syncOutputToCaret(); }
            })
          ]
        })
      });

      const dataView = new EditorView({
        parent: byId("data-editor-container"),
        state: EditorState.create({
          doc: "",
          extensions: [
            ...sharedExts,
            dataLangComp.of([yaml(), yamlHighlighting]),
            EditorView.updateListener.of((u) => {
              if (u.docChanged && !isProgrammatic(u)) {
                if (dataTab === "transform") { transformSrc = u.state.doc.toString(); transformDirty = true; }
                else { yamlSrc = u.state.doc.toString(); yamlDirty = true; }
                renderDataTabs();
                scheduleRun();
              }
              if (u.selectionSet) updateStatusMeta();
            })
          ]
        })
      });

      // ── Output editor (read-only CodeMirror) ──────────────────────────
      // The Plain Text + Render Data views share one read-only editor: syntax
      // highlighting (language auto-switched per view/example) plus two decoration
      // layers — provenance (.seg marks tracing output->source) and the caret link
      // (.cm-out-linked, the run(s) the template caret produced).
      const outLangComp = new Compartment();
      const setProvenance = StateEffect.define();
      const provenanceField = StateField.define({
        create() { return Decoration.none; },
        update(deco, tr) {
          deco = deco.map(tr.changes);
          for (const e of tr.effects) if (e.is(setProvenance)) deco = e.value;
          return deco;
        },
        provide: (f) => EditorView.decorations.from(f),
      });
      const outLinkMark = Decoration.mark({ class: "cm-out-linked" });
      const setOutLink = StateEffect.define();
      const outLinkField = StateField.define({
        create() { return Decoration.none; },
        update(deco, tr) {
          deco = deco.map(tr.changes);
          for (const e of tr.effects) if (e.is(setOutLink)) deco = e.value;
          return deco;
        },
        provide: (f) => EditorView.decorations.from(f),
      });

      const outputEditor = new EditorView({
        parent: byId("output-text"),
        state: EditorState.create({
          doc: "",
          extensions: [
            lineNumberComp.of(lineNumbers()),
            syntaxHighlighting(themeHighlight),
            outLangComp.of([]),
            provenanceField,
            outLinkField,
            fillTheme,
            EditorState.readOnly.of(true),
            EditorView.editable.of(false),
            // Enter jumps from the cursor's run to its source (keyboard parity with
            // click); arrows/Home/End navigate via the default keymap.
            keymap.of([{ key: "Enter", run: jumpToSourceAtCursor }, ...defaultKeymap]),
          ],
        }),
      });

      // Marks editor doc swaps we make ourselves (tab switch, example load, hash
      // restore) so the update listeners can tell them apart from user typing and
      // skip the recompile those programmatic swaps don't warrant.
      const programmatic = Annotation.define();
      const isProgrammatic = (u) => u.transactions.some((tr) => tr.annotation(programmatic));

      function setEditorText(view, text) {
        const cur = view.state.doc.toString();
        if (cur !== text) {
          view.dispatch({
            changes: { from: 0, to: cur.length, insert: text },
            annotations: programmatic.of(true),
          });
        }
      }

      // Both editors are visible, so "active view" follows whichever has focus —
      // it drives the status bar, copy, and save actions.
      byId("template-editor-container").addEventListener("focusin", () => { activeView = "tmpl"; updateStatusMeta(); });
      byId("data-editor-container").addEventListener("focusin", () => { activeView = "data"; updateStatusMeta(); });

      // ── Tabs ──────────────────────────────────────────────────────────
      function renderTabs() {
        const bar = byId("tmpl-tabs");
        bar.innerHTML = "";

        tabs.forEach((tab, i) => {
          const isActive = activeView === "tmpl" && i === activeTabIdx;
          const t = document.createElement("div");
          t.className = "tab" + (isActive ? " active" : "") + (i === 0 ? " is-main" : "");
          t.title = i === 0 ? "entry template" : `partial · {{> ${tab.name}}}`;
          t.addEventListener("click", () => selectTemplateTab(i));

          if (i !== 0 && isActive) {
            // Active partial: rename it inline, right on the tab.
            const input = document.createElement("input");
            input.className = "tab-edit";
            input.value = tab.name;
            input.spellcheck = false;
            input.size = Math.max(tab.name.length, 4);
            input.setAttribute("aria-label", "partial name");
            input.title = `referenced as {{> ${tab.name}}}`;
            input.addEventListener("click", (e) => e.stopPropagation());
            input.addEventListener("input", () => {
              tab.name = input.value;
              input.size = Math.max(input.value.length, 4);
              input.title = `referenced as {{> ${input.value}}}`;
              byId("sources-sub").textContent = `partial · referenced as {{> ${input.value}}}`;
              scheduleRun();
            });
            t.append(input);
          } else {
            t.append(document.createTextNode(i === 0 ? "main" : (tab.name || "(unnamed)")));
            if (tab.dirty) {
              const dirtyDot = document.createElement("span");
              dirtyDot.style.cssText = "color:#f59e0b;font-size:8px;margin-left:3px;vertical-align:super";
              dirtyDot.textContent = "●";
              t.append(dirtyDot);
            }
          }

          if (i !== 0) {
            const x = document.createElement("span");
            x.className = "close"; x.title = "remove partial"; x.textContent = "×";
            x.addEventListener("click", (e) => { e.stopPropagation(); removeTab(i); });
            t.append(x);
          }
          bar.append(t);
        });

        const add = document.createElement("button");
        add.className = "tab-add"; add.title = "add partial"; add.textContent = "＋ partial";
        add.addEventListener("click", addPartial);
        bar.append(add);
      }

      function selectTemplateTab(i) {
        activeView = "tmpl"; activeTabIdx = i; showActiveTab();
      }
      const DATA_TABS = ["data", "transform", "context", "ast"];
      const isInspectTab = (name) => name === "context" || name === "ast";

      function selectDataTab(name = "data") {
        dataTab = DATA_TABS.includes(name) ? name : "data";
        activeView = "data";
        showDataTab();
        if (!isInspectTab(dataTab)) dataView.focus();
        updateStatusMeta();
      }

      // Render the data-pane tab bar, highlighting active. Beyond the data and
      // transform editors it hosts the read-only Context Inspector and Syntax Tree.
      function renderDataTabs() {
        const bar = byId("data-tabs");
        bar.innerHTML = "";
        const mk = (name, label, badge, dirty) => {
          const b = document.createElement("button");
          b.className = "data-tab" + (dataTab === name ? " active" : "");
          b.append(label);
          if (badge) {
            const v = document.createElement("span"); v.className = "yaml-ver"; v.textContent = badge;
            b.append(v);
          }
          if (dirty) {
            const d = document.createElement("span");
            d.style.cssText = "color:#f59e0b;font-size:8px;margin-left:3px;vertical-align:super";
            d.textContent = "●";
            b.append(d);
          }
          b.addEventListener("click", () => selectDataTab(name));
          bar.append(b);
        };
        mk("data", "data", "YAML 1.2", yamlDirty);
        mk("transform", "transform · JSONata", null, transformDirty);
        mk("context", "Context Inspector", null, false);
        mk("ast", "Syntax Tree", null, false);
      }

      // Show the active data tab: the data/transform editor, or a read-only
      // inspector panel (Context Inspector / Syntax Tree) in its place.
      function showDataTab() {
        const inspect = isInspectTab(dataTab);
        byId("data-editor-container").hidden = inspect;
        byId("data-inspect").hidden = !inspect;
        if (inspect) {
          renderDataInspect();
        } else {
          setEditorText(dataView, dataTab === "transform" ? transformSrc : yamlSrc);
          dataView.dispatch({
            effects: dataLangComp.reconfigure(dataTab === "transform" ? [jsonataLang] : [yaml(), yamlHighlighting]),
          });
        }
        renderDataTabs();
      }

      // (Re)render the active inspector panel into the data pane.
      function renderDataInspect() {
        if (!isInspectTab(dataTab)) return;
        const panel = byId("data-inspect");
        panel.textContent = "";
        if (dataTab === "context") renderContext(panel);
        else renderAst(panel);
      }
      function addPartial() {
        let n = 1, name;
        do { name = "partial" + n++; } while (tabs.some((t) => t.name === name));
        tabs.push({ name, source: "" });
        activeView = "tmpl"; activeTabIdx = tabs.length - 1;
        markCustom();
        showActiveTab(); run(); // the partial set changed, so re-render
      }
      function removeTab(i) {
        if (i === 0) return;
        if (!confirm(`Remove the "${tabs[i].name}" partial? This can't be undone.`)) return;
        if (activeTabIdx === i) activeTabIdx = i - 1;
        else if (activeTabIdx > i) activeTabIdx -= 1;
        tabs.splice(i, 1);
        markCustom();
        showActiveTab(); run(); // the partial set changed, so re-render
      }

      // Display the active tab in the template editor. Switching which source is
      // shown does not change the compiled program, so this never recompiles or
      // rebuilds the output — only callers that change the sources call run().
      function showActiveTab() {
        setEditorText(templateView, activeTab().source); // programmatic → no auto-run
        byId("sources-sub").textContent = activeTabIdx === 0
          ? ""
          : `partial · referenced as {{> ${activeTab().name}}}`;

        renderTabs();
        updateStatusMeta();
        caretLinkKey = null; syncOutputToCaret();
        if (dataTab === "ast") renderDataInspect(); // Syntax Tree follows the active tab
      }

      // ── Compile + render ──────────────────────────────────────────────
      function applyEscape(program, mode) {
        if (!mode) return program;
        const rewrite = (instructions) =>
          instructions.map((inst) => {
            const next = { ...inst };
            if (next.t === "emit") next.escape = mode;
            for (const key of ["then", "else", "body"]) {
              if (Array.isArray(next[key])) next[key] = rewrite(next[key]);
            }
            return next;
          });
        return { ...program, instructions: rewrite(program.instructions) };
      }

      // When scripting is off, a strict CSP (no scripts) is the inner boundary on
      // top of the same-origin sandbox. When the author opts into scripts, the
      // CSP is dropped — the isolated `allow-scripts` (null-origin) sandbox is the
      // boundary instead — so the rendered <script> actually runs.
      function previewDoc(body, allowScripts = false) {
        const cspMeta = allowScripts
          ? ""
          : '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src * data:; style-src \'unsafe-inline\'; font-src *;">';
        return (
          '<!doctype html><html><head><meta charset="utf-8">' +
          cspMeta +
          "<style>html,body{margin:0}body{font:13px/1.5 system-ui,sans-serif;padding:14px;color:#18181b;background:#fff}</style>" +
          `</head><body>${body}</body></html>`
        );
      }

      let lastOutput = "";
      let lastSegments = [];
      let lastData = null; // the post-transform data the template rendered (Render Data view)
      let lastSegViews = []; // [{from,to,file,kind,start,end}] — segment char ranges in the output editor
      let lastProgram = null; // the compiled wire program, for the Bytecode view
      let dockProblems = []; // diagnostics for the Problems tab, refreshed each run()
      let hadProblems = false; // tracks the 0->>0 transition so the dock auto-opens once

      // Whether the given output view has content to show (drives the empty-state
      // placeholder): the Render Data needs data, Bytecode needs a compiled program,
      // the rest need rendered output.
      function outputHasContent(view) {
        if (view === "data") return lastData != null;
        if (view === "bytecode") return lastProgram != null;
        return !!lastOutput;
      }

      function setOutput(str, segments = []) {
        lastOutput = str;
        lastSegments = segments;
        paintTextView();
        renderPreview();
        qs(".output-body").dataset.empty = outputHasContent(outputView) ? "false" : "true";
        renderDock();
        renderDataInspect();
        refreshDepsPanel();
        refreshSearchPanel();
      }

      // Paint the read-only output editor for the active text view. The "View
      // Model" view shows the view-model as highlighted YAML (no provenance); the
      // "Plain Text" view shows the output, highlighted in the example's output
      // language, with the source-map provenance as decorations.
      function paintTextView() {
        if (outputView === "bytecode") {
          lastSegViews = [];
          setOutputDoc(lastProgram ? disassemble(lastProgram) : "", Decoration.none);
        } else if (outputView === "data") {
          let text = "";
          if (lastData != null) {
            try { text = dumpYaml(lastData, { indent: 2, lineWidth: -1, noRefs: true }); }
            catch { text = String(lastData); }
          }
          lastSegViews = [];
          setOutputDoc(text, Decoration.none);
        } else {
          const { segViews, deco } = buildProvenance(lastOutput, lastSegments);

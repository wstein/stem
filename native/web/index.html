          lastSegViews = segViews;
          setOutputDoc(lastOutput, deco);
        }
        updateOutLang();
      }

      // Output highlight language. The choice is "Auto" (follow the example's
      // output format), "Plain text", or any of the ~140 languages in the
      // CodeMirror language registry (cmLanguages). Each registry entry lazy-loads
      // its grammar via desc.load() on first use (cached here), so the playground
      // stays light. (AsciiDoc has no CodeMirror grammar, so it is not listed.)
      let outLangChoice = "Auto";
      let lastExView = "source"; // view kind of the last loaded example; survives markCustom()

      function exViewLangName(view) {
        return view === "markdown" ? "Markdown" : view === "rendered" ? "HTML" : "Plain text";
      }
      function updateLangPlaceholder() {
        byId("out-lang-input").placeholder = exViewLangName(lastExView);
      }
      const langCache = new Map(); // language name -> resolved Extension

      // Canonicalize a typed/picked value to "Auto", "Plain text", or a registry
      // language name (case-insensitive, also matching aliases). null = unknown.
      function normalizeLangChoice(v) {
        const s = (v || "").trim().toLowerCase();
        if (s === "" || s === "auto") return "Auto";
        if (s === "plain text" || s === "none" || s === "plain") return "Plain text";
        const byName = cmLanguages.find((l) => l.name.toLowerCase() === s);
        if (byName) return byName.name;
        const byAlias = cmLanguages.find((l) => l.alias.some((a) => a.toLowerCase() === s));
        return byAlias ? byAlias.name : null;
      }

      async function resolveLangByName(name) {
        if (name === "Plain text") return [];
        if (langCache.has(name)) return langCache.get(name);
        const desc = cmLanguages.find((l) => l.name === name);
        if (!desc) return null;
        let ext;
        try { ext = await desc.load(); } catch { ext = []; }
        langCache.set(name, ext);
        return ext;
      }

      // Resolve the active output language and apply it to the read-only editor's
      // language compartment. Render Data is always YAML; Plain Text uses the manual
      // pick, or the example's output format when "Auto". The autoswitch cases use
      // the statically-imported grammars (instant); manual picks may lazy-load, so
      // the highlight appears as soon as the grammar resolves.
      // The highlight choice is a sticky UI preference (persisted across reloads),
      // reset to "Auto" whenever an example is loaded.
      function persistOutLang() {
        try { localStorage.setItem(LS_OUTLANG, outLangChoice); } catch {}
      }

      async function updateOutLang() {
        if (outputView === "data") {
          outputEditor.dispatch({ effects: outLangComp.reconfigure([yaml(), yamlHighlighting]) });
          return;
        }
        if (outputView === "bytecode") {
          outputEditor.dispatch({ effects: outLangComp.reconfigure([bytecodeLang]) });
          return;
        }
        if (outputView !== "source") return;
        if (outLangChoice === "Auto") {
          const kind = loadedExampleIdx !== -1 ? examples[loadedExampleIdx].view : lastExView;
          const ext = kind === "markdown" ? markdown() : kind === "source" ? [] : html();
          outputEditor.dispatch({ effects: outLangComp.reconfigure(ext) });
          return;
        }
        const ext = await resolveLangByName(outLangChoice);
        if (ext != null) outputEditor.dispatch({ effects: outLangComp.reconfigure(ext) });
      }

      // Swap the output editor's document and provenance in one programmatic
      // transaction (and clear any stale caret-link highlight). Language is applied
      // separately by updateOutLang, which may lazy-load a grammar.
      function setOutputDoc(text, provenanceDeco) {
        const cur = outputEditor.state.doc.toString();
        outputEditor.dispatch({
          changes: cur === text ? undefined : { from: 0, to: cur.length, insert: text },
          effects: [
            setProvenance.of(provenanceDeco),
            setOutLink.of(Decoration.none),
          ],
        });
        caretLinkKey = null;
      }

      // Map the renderer's byte-offset segments to output character ranges in one
      // forward pass (monotonic cursor; UTF-8 widths computed arithmetically), and
      // build the provenance mark decorations. Each mark carries its index in
      // lastSegViews via data-i so hover/click can recover the segment.
      function buildProvenance(output, segments) {
        const segViews = [];
        if (!segments.length) return { segViews, deco: Decoration.none };
        let ci = 0, bytes = 0;
        const charAt = (targetByte) => {
          while (bytes < targetByte && ci < output.length) {
            const cp = output.codePointAt(ci);
            bytes += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
            ci += cp > 0xffff ? 2 : 1;
          }
          return ci;
        };
        const ranges = [];
        for (const seg of segments) {
          const from = charAt(seg.out);
          if (from >= output.length) continue; // nothing to mark at/after EOF
          let to = Math.max(from + 1, charAt(seg.out + seg.len));
          if (to > output.length) to = output.length;
          const i = segViews.length;
          segViews.push({
            from, to, file: seg.file, kind: seg.kind,
            start: typeof seg.start === "number" ? seg.start : null,
            end: typeof seg.end === "number" ? seg.end : null,
          });
          ranges.push(Decoration.mark({
            class: "seg" + (seg.kind === "emit" ? " seg-expr" : ""),
            attributes: { "data-i": String(i) },
          }).range(from, to));
        }
        return { segViews, deco: Decoration.set(ranges, true) };
      }

      // Fill the iframe for the current iframe view: raw output HTML for
      // "Preview", or the output interpreted as Markdown for "Markdown". Both
      // honour the "Allow scripts" toggle, swapping to an isolated `allow-scripts`
      // sandbox (no `allow-same-origin`, so it cannot reach this page).
      function renderPreview() {
        const scripts = (outputView === "rendered" || outputView === "markdown") && allowScripts;
        const frame = byId("output-preview");
        frame.setAttribute("sandbox", scripts ? "allow-scripts" : "allow-same-origin");
        const body = outputView === "markdown" ? marked.parse(lastOutput) : lastOutput;
        frame.srcdoc = previewDoc(body, scripts);
      }

      // The file behind a segment ("main" is tab 0; partials are the rest).
      function tabIndexByFile(file) {
        return file === "main" ? 0 : tabs.findIndex((t, i) => i > 0 && t.name === file);
      }
      function fileSource(file) {
        const i = tabIndexByFile(file);
        return i >= 0 ? tabs[i].source : "";
      }

      function run() {
        // run() is synchronous, so once it returns the output and its segments
        // match the current sources again — clear the stale-offset guard.
        renderPending = false;
        lastData = null; // reset; reassigned once data is parsed + transformed below
        dockProblems = []; // success leaves this empty; error paths populate it below
        const dataSource = yamlSrc; // the YAML tab's source (editor may show the transform)
        const mainSource = tabs[0].source;
        // Compile with span provenance so the rendered output can be mapped back
        // to its source files/tags in the Source view.
        const compiled = renderer.compile(mainSource, partialsMap(), { map: true });

        if (compiled.errors) {
          lastProgram = null;
          // The compiler reports every recoverable parse error in one pass, in
          // source order. Each names the file ("main" or a partial) it occurred
          // in; map its byte span into that file's source for line/column, and
          // underline only the errors in the tab currently shown.
          const activeFile = tabs[activeTabIdx]?.name;
          const diags = [];
          const seen = new Set();
          const problems = [];
          for (const e of compiled.errors) {
            const file = e.file || "main";
            const src = fileSource(file);
            const [from, to] = byteRangeToCharRange(src, e.start, e.end);
            const pos = charToLineColumn(src, from);
            // Dedupe identical errors (e.g. a partial expanded at several sites).
            const key = `${file}:${pos.line}:${pos.column}:${e.message}`;
            if (seen.has(key)) continue;
            seen.add(key);
            if (file === activeFile) diags.push({ from, to, severity: "error", message: e.message });
            problems.push({ severity: "error", file, line: pos.line, col: pos.column, message: e.message });
          }
          updateDiagnostics(diags);
          const more = problems.length > 1 ? ` (+${problems.length - 1} more)` : "";
          const first = problems[0];
          setError(`compile error: ${first.file} · ${first.message} (Ln ${first.line}, Col ${first.col})${more}`);
          dockProblems = problems;
          setOutput(""); saveHash(); return;
        }

        lastProgram = compiled.program;
        clearDiagnostics();

        let data;
        try {
          data = loadYaml(dataSource || "null");
          if (typeof data === "undefined") data = null;
        } catch (err) {
          setError("invalid YAML: " + err.message);
          dockProblems = [{ severity: "error", file: "data.yaml", line: (err.mark?.line ?? 0) + 1, col: (err.mark?.column ?? 0) + 1, message: "YAML · " + err.message }];
          setOutput(""); saveHash(); return;
        }

        // Controller step: a JSONata transform maps the raw data to the view-model
        // the template renders. JSONata is sandboxed (no JS/DOM), so it is safe to
        // run from editable/shared content.
        if (transformSrc.trim()) {
          try {
            data = jsonata(transformSrc).evaluate(data);
          } catch (err) {
            lastData = null;
            const message = "transform · " + (err.message || err.code || "invalid JSONata");
            setError("transform error: " + (err.message || err.code || "invalid JSONata"));
            dockProblems = [{ severity: "error", file: "transform", line: 1, col: 1, message }];
            setOutput(""); saveHash(); return;
          }
        }
        lastData = data; // expose the view-model to the "Render Data" output view

        try {
          const program = applyEscape(compiled.program, escapeMode);
          const { output, segments } = renderer.render(program, data, { map: true, transformers: groups });
          // The engine reports a feature it can't render by returning a
          // `stem_native error: …` string rather than throwing — surface that in
          // the status bar instead of presenting it as if it were the output.
          if (output.startsWith("stem_native error:")) {
            const message = output.replace(/^stem_native error:\s*/, "");
            // A capability-group refusal names the missing group; badge it amber.
            const isCap = /capability group/.test(message);
            setError(output.replace(/^stem_native error:/, "render error:"));
            dockProblems = [{ severity: isCap ? "cap" : "render", file: "main", line: 1, col: 1, message }];
            setOutput("");
          } else {
            setOutput(output, segments);
            setError("");
          }
        } catch (err) {
          setError("render error: " + err.message);
          dockProblems = [{ severity: "render", file: "main", line: 1, col: 1, message: err.message }];
          setOutput("");
        }
        saveHash();
        // Re-apply the caret→output highlight against the freshly rendered runs.
        caretLinkKey = null;
        syncOutputToCaret();
      }

      const debouncedRun = debounce(run, 100);

      // True between a source edit and the debounced render that follows it: in
      // that window the output segments still carry the pre-edit byte offsets, so
      // the hover link-highlight is suppressed to avoid pointing at stale source.
      let renderPending = false;
      function scheduleRun() { markCustom(); renderPending = true; debouncedRun(); }

      function updateDiagnostics(diags) {
        templateDiagnostics = diags;
        templateView.dispatch({ effects: setDiagnosticsEffect.of(diags) });
      }
      function clearDiagnostics() {
        if (!templateDiagnostics.length) return;
        templateDiagnostics = [];
        templateView.dispatch({ effects: setDiagnosticsEffect.of([]) });
      }

      // ── Status bar ────────────────────────────────────────────────────
      function setError(msg) {
        const bar = qs(".statusbar");
        const txt = byId("status-msg");
        if (msg) { bar.classList.add("has-error"); txt.textContent = msg; }
        else { bar.classList.remove("has-error"); txt.textContent = "no errors"; }
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      function updateStatusMeta() {
        // The inspector tabs have no editor/caret — show a plain label.
        if (activeView === "data" && isInspectTab(dataTab)) {
          const name = dataTab === "context" ? "Context Inspector" : "Syntax Tree";
          byId("status-meta").innerHTML = `<b>${name}</b>  ·  read-only`;
          return;
        }
        const view = activeView === "data" ? dataView : templateView;
        const sel  = view.state.selection.main;
        const line = view.state.doc.lineAt(sel.head);
        const col  = sel.head - line.from + 1;
        const onTransform = activeView === "data" && dataTab === "transform";
        const fileName = activeView !== "data" ? activeTab().name
          : onTransform ? "transform" : "data.yaml";
        const lang = activeView !== "data" ? "Handlebars"
          : onTransform ? "JSONata" : "YAML";
        byId("status-meta").innerHTML =
          `<b>${escapeHtml(fileName)} · Ln ${line.number}, Col ${col}</b>` +
          `  ·  ${lang}  ·  UTF-8  ·  Escape: <b>${escapeMode || "as compiled"}</b>`;
      }

      // ── Output view ───────────────────────────────────────────────────
      // Valid output views; anything else (e.g. an old share link) falls back to
      // the iframe Preview.
      const validView = (v) =>
        (["source", "rendered", "markdown", "data", "bytecode"].includes(v) ? v : "rendered");

      // The output view tabs, mirroring the data sub-pane tab strip. Order and
      // keys match validView; labels are the user-facing names.
      const VIEW_TABS = [
        ["source", "Plain Text"],
        ["rendered", "HTML Preview"],
        ["markdown", "Markdown Preview"],
        ["data", "Render Data"],
        ["bytecode", "Bytecode"],
      ];

      function renderViewTabs() {
        const bar = byId("view-tabs");
        bar.innerHTML = "";
        for (const [view, label] of VIEW_TABS) {
          const b = document.createElement("button");
          b.className = "view-tab" + (outputView === view ? " active" : "");
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", outputView === view ? "true" : "false");
          b.textContent = label;
          b.addEventListener("click", () => {
            if (outputView === view) return;
            setOutputView(view);
            run();
          });
          bar.append(b);
        }
      }

      function setOutputView(view) {
        outputView = view;
        // "source" (provenance), "data" (view-model YAML), and "bytecode" (wire
        // disassembly) use the text pane; "rendered" and "markdown" use the iframe.
        const isText = view === "source" || view === "data" || view === "bytecode";
        byId("output-text").hidden = !isText;
        byId("output-preview").hidden = isText;
        hideSegTip(); clearLink();
        renderViewTabs();
        // Contextual controls row: show only what applies to the active view.
        // Highlight → Plain Text; Escape → the rendered views (not the YAML/wire
        // dumps); Allow scripts → the iframe previews. Hide the row when empty.
        const showLang = view === "source";
        const showEscape = view === "source" || view === "rendered" || view === "markdown";
        const isPreview = view === "rendered" || view === "markdown";
        byId("out-lang-input").hidden = !showLang;
        byId("out-lang-label").hidden = !showLang;
        byId("escape-select").hidden = !showEscape;
        byId("escape-label").hidden = !showEscape;
        byId("scripts-toggle").style.display = isPreview ? "inline-flex" : "none";
        byId("view-controls").hidden = !(showLang || showEscape || isPreview);
        if (isText) { paintTextView(); outputEditor.requestMeasure(); } else renderPreview();
        qs(".output-body").dataset.empty = outputHasContent(view) ? "false" : "true";
        caretLinkKey = null; syncOutputToCaret();
      }

      // ── Source-map interactions (Source view) ─────────────────────────
      const segTip = byId("seg-tip");
      function hideSegTip() { segTip.hidden = true; }

      function appendHint() {
        const hint = document.createElement("div");
        hint.className = "seg-tip-hint";
        hint.textContent = "click to jump to source";
        segTip.append(hint);
      }

      function showSegTip(sv, anchorEl) {
        const file = sv.file;
        const isExpr = sv.kind === "emit";
        segTip.textContent = "";

        // "expression from <file> template" / "literal from <file> partial".
        const head = document.createElement("div");
        const kindEl = document.createElement("b");
        kindEl.textContent = isExpr ? "expression" : "literal";
        head.append(kindEl, document.createTextNode(" from "));
        const fileEl = document.createElement("span");
        fileEl.className = "seg-tip-file";
        fileEl.textContent = file;
        head.append(fileEl, document.createTextNode(file === "main" ? " template" : " partial"));
        segTip.append(head);

        // For expressions, show the originating tag (literals just echo the
        // output, so a snippet would be redundant).
        if (isExpr && sv.start !== null) {
          const src = fileSource(file);
          const [s, e] = byteRangeToCharRange(src, sv.start, sv.end);
          const tag = src.slice(s, e).trim();
          if (tag) {
            const code = document.createElement("code");
            code.textContent = tag;
            segTip.append(code);
          }
        }

        appendHint();

        // Position above the segment, flipping below / clamping to the viewport.
        segTip.hidden = false;
        const r = anchorEl.getBoundingClientRect();
        const t = segTip.getBoundingClientRect();
        let top = r.top - t.height - 6;
        if (top < 4) top = r.bottom + 6;
        let left = Math.min(r.left, window.innerWidth - t.width - 6);
        segTip.style.top = `${top}px`;
        segTip.style.left = `${Math.max(4, left)}px`;
      }

      // Mirror an output-run hover into the source. `linkState` (the run's
      // "file:start:end") dirty-checks the editor/tab mutation so a sweep across
      // many segments doesn't thrash; `linkedTabEl` tracks any tinted tab.
      let linkState = null;
      let linkedTabEl = null;

      function clearLink() {
        if (linkState === null && !linkedTabEl) return;
        linkState = null;
        if (linkedTabEl) { linkedTabEl.classList.remove("tab-linked"); linkedTabEl = null; }
        templateView.dispatch({ effects: setLinkHighlight.of(null) });
      }

      // If the run's source file is the one shown in the template editor,
      // highlight its span there (no caret move); otherwise tint that file's tab.
      // Suppressed mid-edit (renderPending), when the segment offsets are stale.
      function linkHover(sv) {
        if (renderPending || sv.start === null) return;
        const file = sv.file;
        const start = sv.start, end = sv.end;
        const idx = tabIndexByFile(file);
        const active = idx === activeTabIdx;

        // Refine the tooltip hint every hover (the tooltip is rebuilt each time).
        const hint = segTip.querySelector(".seg-tip-hint");
        if (hint) {
          hint.textContent = active ? "click to place the cursor"
            : idx >= 0 ? `click to open the ${file} tab`
            : "click to jump to source";
        }

        const key = `${file}:${start}:${end}`;
        if (key === linkState) return; // highlight already applied — skip the work
        linkState = key;
        if (linkedTabEl) { linkedTabEl.classList.remove("tab-linked"); linkedTabEl = null; }

        if (active) {
          const [from, to] = byteRangeToCharRange(tabs[idx].source, start, end);
          templateView.dispatch({ effects: setLinkHighlight.of({ from, to }) });
        } else {
          templateView.dispatch({ effects: setLinkHighlight.of(null) });
          const tabEl = idx >= 0 ? byId("tmpl-tabs").children[idx] : null;
          if (tabEl) { tabEl.classList.add("tab-linked"); linkedTabEl = tabEl; }
        }
      }

      // Reverse direction: the template caret highlights the output run(s) it
      // produced, as a `.cm-out-linked` decoration over their output ranges. A
      // caret byte offset matches a run when the file agrees and start <= byte < end.
      let caretLinkKey = null; // dirty-check: `${file}:${byteOffset}`

      function syncOutputToCaret() {
        // Suppressed mid-render (offsets stale) and when the Plain Text view is hidden.
        if (renderPending || outputView !== "source") {
          outputEditor.dispatch({ effects: setOutLink.of(Decoration.none) });
          caretLinkKey = null;
          return;
        }
        const file = activeTabIdx === 0 ? "main" : activeTab().name;
        const src = templateView.state.doc.toString();
        const caretChar = templateView.state.selection.main.head;
        const byte = charToByte(src, caretChar);

        // A `{{> name}}` tag expands inline and emits no run of its own, so a
        // caret on it has no covering span; map it to every run that partial
        // produced instead.
        const partial = partialNameAt(src, caretChar);
        const key = partial ? `>${partial}` : `${file}:${byte}`;
        if (key === caretLinkKey) return;
        caretLinkKey = key;
        const ranges = [];
        for (const sv of lastSegViews) {
          const hit = partial
            ? sv.file === partial
            : (sv.file === file && sv.start !== null && sv.start <= byte && byte < sv.end);
          if (hit) ranges.push(outLinkMark.range(sv.from, sv.to));
        }
        outputEditor.dispatch({ effects: setOutLink.of(Decoration.set(ranges, true)) });
      }

      // Jump from a rendered run to the file/tag that produced it: open the file's
      // tab and, for an expression, select its source span in the editor.
      function openSourceLocation(file, start, end) {
        const idx = tabIndexByFile(file);
        if (idx < 0) return;
        clearLink();
        selectTemplateTab(idx);
        templateView.focus();
        if (start !== null) {
          const [from, to] = byteRangeToCharRange(tabs[idx].source, start, end);
          templateView.dispatch({ selection: { anchor: from, head: to }, scrollIntoView: true });
        }
        hideSegTip();
      }

      // Keyboard parity: Enter on the output editor jumps from the run under the
      // cursor to its source (arrows/Home/End navigate via the default keymap).
      function jumpToSourceAtCursor(view) {
        if (outputView !== "source" || !lastSegViews.length) return false;
        const pos = view.state.selection.main.head;
        const sv = lastSegViews.find((s) => pos >= s.from && pos < s.to)
          || lastSegViews.find((s) => pos === s.to);
        if (!sv) return false;
        openSourceLocation(sv.file, sv.start, sv.end);
        return true;
      }

      // Hover/click on the output editor's runs. The provenance marks render as
      // `.seg` spans carrying data-i (index into lastSegViews); event delegation
      // on the stable contentDOM survives CM's viewport re-rendering.
      (() => {
        const content = outputEditor.contentDOM;
        const svOf = (el) => { const s = el?.closest?.(".seg"); return s ? lastSegViews[Number(s.dataset.i)] : null; };
        // Debounce hover so sweeping the pointer across many runs only shows the
        // tooltip + link-highlight for the run the pointer settles on.
        let hoverTimer = null;
        const cancelHover = () => { if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; } };
        content.addEventListener("mouseover", (e) => {
          const el = e.target.closest?.(".seg");
          const sv = svOf(el);
          if (!sv) return;
          cancelHover();
          hoverTimer = setTimeout(() => { hoverTimer = null; showSegTip(sv, el); linkHover(sv); }, 55);
        });
        content.addEventListener("mouseout", (e) => {
          if (e.target.closest?.(".seg")) { cancelHover(); hideSegTip(); clearLink(); }
        });
        outputEditor.scrollDOM.addEventListener("scroll", () => { cancelHover(); hideSegTip(); clearLink(); });
        content.addEventListener("click", (e) => {
          const sv = svOf(e.target);
          if (sv) { openSourceLocation(sv.file, sv.start, sv.end); setContextTarget(sv); }
        });
      })();

      // ── Splitter ──────────────────────────────────────────────────────
      let splits = { w0: null, h0: null, ew: null, eh: null };
      try { const r = localStorage.getItem(LS_SPLIT); if (r) splits = { ...splits, ...JSON.parse(r) }; } catch {}

      function saveSplits() { try { localStorage.setItem(LS_SPLIT, JSON.stringify(splits)); } catch {} }

      function isStacked() { return qs(".workspace")?.classList.contains("stacked"); }

      // Generic two-child flex splitter. axisRow() reports whether the container
      // currently lays its children in a row (resize width) or column (resize
      // height) — so one helper drives both the workspace and the editors, whose
      // orientations are perpendicular and flip with the layout.
      function makeSplitter({ el, container, first, second, axisRow, keyRow, keyCol, min, ratio }) {
        // Splits are stored as a fraction of the usable space (not pixels), so a
        // browser-canvas resize keeps the panes' proportions instead of pinning
        // the first pane to a fixed width.
        function size() {
          if (!container) return;
          const row = axisRow();
          const total = row ? container.clientWidth : container.clientHeight;
          if (total <= 0) return;
          const usable = total - 6;
          const key = row ? keyRow : keyCol;
          const minR = min / usable;
          let r = splits[key] ?? ratio;
          r = Math.max(minR, Math.min(1 - minR, r));
          splits[key] = r;
          first.style.flex = `0 0 ${r * usable}px`;
          second.style.flex = "1 1 0";
        }
        el.addEventListener("mousedown", (e) => {
          e.preventDefault();
          el.classList.add("dragging");
          const row = axisRow();
          document.body.classList.add(row ? "dragging-col" : "dragging-row");
          const rect = container.getBoundingClientRect();
          const key = row ? keyRow : keyCol;
          const usable = (row ? rect.width : rect.height) - 6;
          const startPx = (splits[key] ?? ratio) * usable;
          const startPos = row ? e.clientX : e.clientY;
          const onMove = (ev) => {
            const cur = row ? ev.clientX : ev.clientY;
            const px = Math.max(min, Math.min(usable - min, startPx + (cur - startPos)));
            splits[key] = px / usable;
            size();
          };
          const onUp = () => {
            el.classList.remove("dragging");
            document.body.classList.remove("dragging-col", "dragging-row");
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            saveSplits();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });
        el.addEventListener("dblclick", () => {
          splits[keyRow] = null; splits[keyCol] = null; size(); saveSplits();
        });
        return size;
      }

      let sizeWorkspace = () => {};
      let sizeEditors = () => {};
      function applySplits() { sizeWorkspace(); sizeEditors(); }

      // ── Focus mode ────────────────────────────────────────────────────
      function setFocus(mode) {
        focusMode = mode;
        const ws = qs(".workspace");
        ws.classList.remove("focus-sources", "focus-output");
        for (const b of document.querySelectorAll(".focus-toggle")) b.classList.remove("on");
        if (mode) {
          ws.classList.add("focus-" + mode);
          const btn = document.querySelector(`.focus-toggle[data-pane="${mode}"]`);
          if (btn) btn.classList.add("on");
        }
      }
      function toggleFocus(mode) { setFocus(focusMode === mode ? null : mode); }

      // ── Examples ──────────────────────────────────────────────────────
      // The example picker is a custom dropdown (see the markup note): build the
      // menu items, wire the trigger to open it downward, and close on
      // click-outside / Escape.
      function buildExampleSelect() {
        const menu = byId("example-menu");
        menu.innerHTML = "";
        examples.forEach((ex, i) => {
          const li = document.createElement("li");
          li.className = "dropdown-item";
          li.setAttribute("role", "option");
          li.dataset.idx = String(i);
          li.textContent = ex.label;
          li.addEventListener("click", () => { closeExampleMenu(); loadExample(i); });
          menu.append(li);
        });

        const trigger = byId("example-trigger");
        trigger.addEventListener("click", () => {
          byId("example-menu").hidden ? openExampleMenu() : closeExampleMenu();
        });
      }

      function openExampleMenu() {
        const menu = byId("example-menu");
        // Mark the loaded example active.
        menu.querySelectorAll(".dropdown-item").forEach((li) => {
          li.classList.toggle("active", Number(li.dataset.idx) === loadedExampleIdx);
        });
        menu.hidden = false;
        byId("example-select").dataset.open = "true";
        byId("example-trigger").setAttribute("aria-expanded", "true");
      }

      function closeExampleMenu() {
        byId("example-menu").hidden = true;
        byId("example-select").dataset.open = "false";
        byId("example-trigger").setAttribute("aria-expanded", "false");
      }

      function setExampleLabel(text) {
        byId("example-label").textContent = text;
      }

      async function loadExample(idx) {
        const ex = examples[idx];
        if (!ex) return;
        const dir = `./examples/${ex.id}/`;
        const [mainSrc, dataText, ...partialSrcs] = await Promise.all([
          fetch(dir + ex.main).then((r) => r.text()),
          fetch(dir + ex.data).then((r) => r.text()),
          ...ex.partials.map((name) => fetch(`${dir}${name}.stem`).then((r) => r.text())),
        ]);
        tabs = [{ name: "main", source: mainSrc }];
        ex.partials.forEach((name, i) => tabs.push({ name, source: partialSrcs[i] }));
        activeTabIdx = 0; activeView = "tmpl";
        // Examples ship their data as YAML; an optional transform is the Controller.
        yamlSrc = dataText;
        transformSrc = ex.transform
          ? await fetch(dir + ex.transform).then((r) => r.text())
          : "";
        dataTab = "data";
        showDataTab();
        escapeMode = "";
        byId("escape-select").value = "";
        groups = [...(ex.groups ?? [])]; // activate only what the example needs
        syncCapsUI();
        setExampleLabel(ex.label);
        loadedExampleIdx = idx;
        exampleModified = false;
        tabs.forEach(t => { t.dirty = false; });
        yamlDirty = false; transformDirty = false;
        outLangChoice = "Auto";
        persistOutLang();
        lastExView = ex.view;
        byId("out-lang-input").value = "";
        updateLangPlaceholder();
        setOutputView(validView(ex.view));
        showActiveTab(); run();
      }

      // Once the user edits anything, the state no longer matches a shipped
      // example: flag it custom so the URL state reflects that. The dropdown
      // keeps showing the example name but appends ● to signal modification.
      function markCustom() {
        if (loadedExampleIdx === -1) return;
        if (exampleModified) return;
        const prevIdx = loadedExampleIdx;
        exampleModified = true;
        loadedExampleIdx = -1;
        // The dropdown keeps showing the example name; the URL state flips to
        // custom (-1) so a share link records the edits, not the pristine example.
        setExampleLabel(examples[prevIdx].label);
      }

      // ── URL state ─────────────────────────────────────────────────────
      function snapshotState() {
        return {
          tabs: tabs.map((t) => ({ n: t.name, s: t.source })),
          d: yamlSrc,
          t: transformSrc,
          e: escapeMode, v: outputView,
          g: groups, // loaded capability groups
          av: activeView, ai: activeTabIdx,
          x: loadedExampleIdx, // which example (or -1 for an edited "custom" state)
        };
      }

      // Reflect the `groups` state into the capability checkboxes.
      function syncCapsUI() {
        document.querySelectorAll("#caps-select .cap").forEach((box) => {
          box.checked = groups.includes(box.value);
        });
      }

      function saveHash() {
        try { history.replaceState(null, "", "#" + encodeState(snapshotState())); } catch {}
      }

      async function restoreHash() {
        if (!location.hash.length) return false;
        try {
          const s = decodeState(location.hash.slice(1));
          // Hashes written before example tracking carry no `x`: treat them as
          // "no state" so a stale browsing snapshot doesn't pin the page to it.
          if (s.x === undefined) return false;
          // A clean example reference: reload it fresh so it reflects the current
          // example files and selects the dropdown (not a stale embedded copy).
          if (Number.isInteger(s.x) && s.x >= 0 && examples[s.x]) {
            await loadExample(s.x);
            return true;
          }
          // Otherwise it is a genuine custom edit (x === -1): restore verbatim.
          tabs = Array.isArray(s.tabs) && s.tabs.length
            ? s.tabs.map((t, i) => ({ name: i === 0 ? "main" : (t.n ?? "partial"), source: t.s ?? "", dirty: false }))
            : [{ name: "main", source: "", dirty: false }];
          activeTabIdx = Math.max(0, Math.min(tabs.length - 1, s.ai ?? 0));
          activeView = s.av === "data" ? "data" : "tmpl";
          yamlSrc = s.d ?? "";
          transformSrc = s.t ?? "";
          yamlDirty = false; transformDirty = false;
          exampleModified = false;
          dataTab = "data";
          showDataTab();
          escapeMode = s.e ?? "";
          byId("escape-select").value = escapeMode;
          // "strings"/"predicates" were old names for inspect (now always-on, drop from list).
          // "inspect" itself is also always-on now. "collections" → "transform".
          const OLD_GROUP_NAMES = { strings: null, predicates: null, inspect: null, collections: "transform" };
          groups = Array.isArray(s.g)
            ? [...new Set(s.g.map(g => OLD_GROUP_NAMES[g] ?? g).filter(Boolean))]
            : [...DEFAULT_GROUPS];
          syncCapsUI();
          loadedExampleIdx = -1;
          setExampleLabel("(custom)");
          setOutputView(validView(s.v));
          showActiveTab(); run();
          return true;
        } catch { return false; }
      }

      // ── Command palette ───────────────────────────────────────────────
      function buildCommands() {
        return [
          ...examples.map((ex, i) => ({
            label: `Load example · ${ex.label}`, kind: "example",
            run: () => loadExample(i),
          })),
          { label: "Open data",           kind: "sources", run: () => selectDataTab("data") },
          { label: "Open transform",     kind: "sources", run: () => selectDataTab("transform") },
          { label: "Open main template", kind: "sources", run: () => selectTemplateTab(0) },
          { label: "Add partial",        kind: "sources", run: addPartial },
          { label: "Toggle focus · Sources", kind: "view", run: () => toggleFocus("sources") },
          { label: "Toggle focus · Output",  kind: "view", run: () => toggleFocus("output") },
          { label: "View · Plain Text",       kind: "view", run: () => { setOutputView("source"); run(); } },
          { label: "View · HTML Preview",     kind: "view", run: () => { setOutputView("rendered"); run(); } },
          { label: "View · Markdown Preview", kind: "view", run: () => { setOutputView("markdown"); run(); } },
          { label: "View · Render Data",       kind: "view", run: () => { setOutputView("data"); run(); } },
          { label: "Reset layout", kind: "view",
            run: () => { splits = { w0: null, h0: null, ew: null, eh: null }; applySplits(); saveSplits(); setFocus(null); } },
          { label: "Copy share link", kind: "share", run: copyShareLink },
          ...["", "html", "xml", "json", "none"].map((m) => ({
            label: `Escape · ${m || "(as compiled)"}`, kind: "render",
            run: () => { escapeMode = m; byId("escape-select").value = m; run(); updateStatusMeta(); },
          })),
        ];
      }

      let paletteOpen = false;
      function openPalette() {
        if (paletteOpen) return;
        paletteOpen = true;
        const all = buildCommands();
        let filtered = all, sel = 0;

        const back = document.createElement("div");
        back.className = "palette-backdrop";
        const box = document.createElement("div");
        box.className = "palette";
        const input = document.createElement("input");
        input.type = "text"; input.placeholder = "Type a command…"; input.spellcheck = false;
        const list = document.createElement("ul");

        // Rebuild the list only when the filter changes. Hover and arrow keys
        // just move the highlight (see highlight()) — rebuilding here would
        // replace the <li> mid-click and swallow the click.
        function renderList() {
          list.innerHTML = "";
          filtered.forEach((cmd, i) => {
            const li = document.createElement("li");
            li.className = i === sel ? "sel" : "";
            const kind = document.createElement("span");
            kind.className = "pkind"; kind.textContent = cmd.kind;
            li.append(kind, cmd.label);
            list.append(li);
          });
        }
        function highlight() {
          [...list.children].forEach((li, i) => li.classList.toggle("sel", i === sel));
        }
        function close() { paletteOpen = false; back.remove(); }

        // Delegate on the stable <ul> so clicks land regardless of hover redraws.
        list.addEventListener("mousemove", (e) => {
          const i = [...list.children].indexOf(e.target.closest("li"));
          if (i >= 0 && i !== sel) { sel = i; highlight(); }
        });
        list.addEventListener("click", (e) => {
          const i = [...list.children].indexOf(e.target.closest("li"));
          if (filtered[i]) { filtered[i].run(); close(); }
        });

        input.addEventListener("input", () => {
          const q = input.value.toLowerCase().trim();
          filtered = q ? all.filter((c) => c.label.toLowerCase().includes(q)) : all;
          sel = 0; renderList();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown") { sel = Math.min(filtered.length - 1, sel + 1); highlight(); e.preventDefault(); }
          else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); highlight(); e.preventDefault(); }
          else if (e.key === "Enter") { if (filtered[sel]) { filtered[sel].run(); close(); } }
          else if (e.key === "Escape") close();
        });
        back.addEventListener("mousedown", (e) => { if (e.target === back) close(); });
        box.append(input, list);
        back.append(box);
        document.body.append(back);
        renderList();
        setTimeout(() => input.focus(), 0);
      }

      // ── Toast ─────────────────────────────────────────────────────────
      function toast(msg) {
        let t = qs(".toast");
        if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.append(t); }
        t.textContent = msg;
        requestAnimationFrame(() => t.classList.add("show"));
        clearTimeout(t._hide);
        t._hide = setTimeout(() => t.classList.remove("show"), 1400);
      }

      async function copyShareLink() {
        saveHash();
        try { await navigator.clipboard?.writeText(location.href); toast("Link copied to clipboard"); }
        catch { toast("Couldn't copy (permission?)"); }
      }

      // ── Tweaks panel ──────────────────────────────────────────────────
      const TWEAK_OPTS = {
        theme: [
          { value: "light",  label: "Light",  swatch: ["#ffffff","#f2effc","#7c4dff"] },
          { value: "dark",   label: "Dark",   swatch: ["#1e1338","#2f1d52","#b59bff"] },
          { value: "system", label: "System", swatch: ["#ffffff","#9e8dc4","#1e1338"] },
        ],
        layout: [
          // Split: Sources (template above data) beside a full-height Output.
          { value: "split", label: "Split", hint: "Sources ← → Output",
            icon: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="2.5" width="5.5" height="5" rx="1"/><rect x="1.5" y="8.5" width="5.5" height="5" rx="1"/><rect x="9" y="2.5" width="5.5" height="11" rx="1"/></svg>' },
          // Stacked: Sources (template beside data) above a full-width Output.
          { value: "stacked", label: "Stacked", hint: "Sources ↑ Output ↓",
            icon: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="1.5" width="5" height="5.5" rx="1"/><rect x="8.5" y="1.5" width="5" height="5.5" rx="1"/><rect x="2.5" y="9" width="11" height="5.5" rx="1"/></svg>' },
        ],
        // Monospace families only — code reads best fixed-width. Each is a stack
        // that degrades gracefully when the preferred face isn't installed.
        font: [
          { value: "plex",    label: "Plex Mono", stack: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace' },
          { value: "system",  label: "System",    stack: 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' },
          { value: "courier", label: "Courier",   stack: '"Courier New", Courier, monospace' },
        ],
        fontSize: [12, 13, 14, 16],
      };

      let tweaks = { theme: "system", layout: "split", lineNumbers: true, font: "plex", fontSize: 13 };
      try { const r = localStorage.getItem(LS_TWEAKS); if (r) tweaks = { ...tweaks, ...JSON.parse(r) }; } catch {}
      // Migrate older saved state: the former "dim" theme is now "dark", moods are gone.
      if (tweaks.theme === "dim") tweaks.theme = "dark";
      if (!["light", "dark", "system"].includes(tweaks.theme)) tweaks.theme = "system";
      tweaks.lineNumbers = tweaks.lineNumbers !== false; // default on
      if (!TWEAK_OPTS.font.some((o) => o.value === tweaks.font)) tweaks.font = "plex";
      if (!TWEAK_OPTS.fontSize.includes(tweaks.fontSize)) tweaks.fontSize = 13;
      delete tweaks.mood;

      function applyTweaks() {
        document.body.dataset.theme = tweaks.theme;
        document.body.classList.toggle("show-line-numbers", tweaks.lineNumbers);
        const lineNumberExt = tweaks.lineNumbers ? lineNumbers() : [];
        for (const view of [templateView, dataView, outputEditor])
          view.dispatch({ effects: lineNumberComp.reconfigure(lineNumberExt) });
        qs(".workspace")?.classList.toggle("stacked", tweaks.layout === "stacked");
        // Editor file-content font + size only (the UI chrome keeps --font-mono).
        const fontOpt = TWEAK_OPTS.font.find((o) => o.value === tweaks.font) || TWEAK_OPTS.font[0];
        const root = document.documentElement.style;
        root.setProperty("--editor-font", fontOpt.stack);
        root.setProperty("--editor-font-size", tweaks.fontSize + "px");
        window.dispatchEvent(new Event("resize"));
      }
      function saveTweaks() { try { localStorage.setItem(LS_TWEAKS, JSON.stringify(tweaks)); } catch {} }

      function mkEl(tag, attrs = {}, children = []) {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") n.className = v;
          else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
          else if (v != null && v !== false) n.setAttribute(k, v);
        }
        for (const c of [].concat(children)) {
          if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
        }
        return n;
      }

      // Parse an inline SVG string into an element (a <template> gives it the
      // correct SVG namespace, unlike document.createElement).
      function icon(svg) {
        const tpl = document.createElement("template");
        tpl.innerHTML = svg.trim();
        return tpl.content.firstChild;
      }

      function twSection(title, hint, children) {
        return mkEl("div", { class: "tw-section" }, [
          mkEl("div", { class: "tw-section-head" }, [
            mkEl("span", { class: "tw-section-title" }, title),
            hint ? mkEl("span", { class: "tw-section-hint" }, hint) : null,
          ]),
          mkEl("div", { class: "tw-section-body" }, [].concat(children)),
        ]);
      }

      let tweaksPanel = null;

      function buildTweaksPanel() {
        const panel = mkEl("div", { class: "tw-panel", role: "dialog", "aria-label": "Appearance" });

        const header = mkEl("div", { class: "tw-header" }, [
          mkEl("div", { class: "tw-title" }, [mkEl("span", { class: "tw-pill" }), "Appearance"]),
          mkEl("button", { class: "tw-close", title: "Close", onclick: hideTweaks }, "×"),
        ]);
        panel.append(header);

        panel.append(twSection("Theme", null,
          TWEAK_OPTS.theme.map((o) =>
            mkEl("button", {
              class: "tw-swatch" + (tweaks.theme === o.value ? " on" : ""),
              title: o.label, onclick: () => setTweak("theme", o.value),
            }, [
              mkEl("span", { class: "tw-swatch-grid", style: `--c1:${o.swatch[0]};--c2:${o.swatch[1]};--c3:${o.swatch[2]};` }),
              mkEl("span", { class: "tw-swatch-label" }, o.label),
            ])
          )
        ));

        panel.append(twSection("Layout", null, [
          mkEl("div", { class: "tw-segmented" },
            TWEAK_OPTS.layout.map((o) =>
              mkEl("button", {
                class: tweaks.layout === o.value ? "on" : "",
                title: o.hint, onclick: () => setTweak("layout", o.value),
              }, [icon(o.icon), mkEl("span", {}, o.label)])
            )
          )
        ]));

        panel.append(twSection("Line numbers", null, [
          mkEl("div", { class: "tw-segmented" },
            [{ on: true, label: "On" }, { on: false, label: "Off" }].map((o) =>
              mkEl("button", {
                class: tweaks.lineNumbers === o.on ? "on" : "",
                onclick: () => setTweak("lineNumbers", o.on),
              }, o.label)
            )
          )
        ]));

        panel.append(twSection("Editor font", "monospace", [
          mkEl("div", { class: "tw-segmented" },
            TWEAK_OPTS.font.map((o) =>
              mkEl("button", {
                class: tweaks.font === o.value ? "on" : "",
                style: `font-family:${o.stack}`,
                onclick: () => setTweak("font", o.value),
              }, o.label)
            )
          )
        ]));

        panel.append(twSection("Font size", null, [
          mkEl("div", { class: "tw-segmented" },
            TWEAK_OPTS.fontSize.map((px) =>
              mkEl("button", {
                class: tweaks.fontSize === px ? "on" : "",
                onclick: () => setTweak("fontSize", px),
              }, px + "px")
            )
          )
        ]));

        panel.append(mkEl("div", { class: "tw-foot" }, "Edits persist across reloads."));

        makeDraggable(panel, header, panelState.appearance);
        return panel;
      }

      function setTweak(key, value) {
        tweaks[key] = value;
        applyTweaks(); saveTweaks();
        // Rebuild panel to reflect new selection, keeping its current position
        // (otherwise the rebuilt panel jumps back to the default spot).
        if (tweaksPanel) {
          tweaksPanel.remove();
          tweaksPanel = buildTweaksPanel();
          document.body.append(tweaksPanel);
          applyPanelPos(tweaksPanel, panelState.appearance);
        }
      }

      // Persisted floating-panel layout (open + position + size), so the GUI
      // survives reloads. localStorage is the playground's persistence mechanism
      // (same as the splitters and Appearance settings).
      const LS_PANELS = "stem-playground:panels.v1";
      let panelState = { appearance: {}, deps: {}, search: {} };
      try {
        panelState = { appearance: {}, deps: {}, search: {}, ...JSON.parse(localStorage.getItem(LS_PANELS) || "{}") };
        panelState.search = panelState.search || {};
      } catch {}
      function savePanels() {
        try { localStorage.setItem(LS_PANELS, JSON.stringify(panelState)); } catch {}
      }

      // Apply a saved {left, top} to a panel, clamped into the viewport.
      function applyPanelPos(panel, st) {
        if (typeof st.left !== "number") return;
        const r = panel.getBoundingClientRect();
        panel.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, st.left)) + "px";
        panel.style.top = Math.max(8, Math.min(window.innerHeight - r.height - 8, st.top)) + "px";
        panel.style.right = "auto";
        panel.style.bottom = "auto";
      }

      // Drag a panel by its header, persisting the final position into `st`.
      function makeDraggable(panel, header, st) {
        header.addEventListener("mousedown", (e) => {
          if (e.target.classList.contains("tw-close")) return;
          const rect = panel.getBoundingClientRect();
          const dx = e.clientX - rect.left, dy = e.clientY - rect.top;
          const onMove = (ev) => {
            st.left = Math.max(8, Math.min(window.innerWidth - rect.width - 8, ev.clientX - dx));
            st.top = Math.max(8, Math.min(window.innerHeight - rect.height - 8, ev.clientY - dy));
            panel.style.left = st.left + "px";
            panel.style.top = st.top + "px";
            panel.style.right = "auto";
            panel.style.bottom = "auto";
          };
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            savePanels();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });
      }

      function showTweaks() {
        if (tweaksPanel) { hideTweaks(); return; }
        tweaksPanel = buildTweaksPanel();
        document.body.append(tweaksPanel);
        applyPanelPos(tweaksPanel, panelState.appearance);
        byId("tweaks-btn").classList.add("active");
        panelState.appearance.open = true; savePanels();
      }
      function hideTweaks() {
        if (tweaksPanel) { tweaksPanel.remove(); tweaksPanel = null; }
        byId("tweaks-btn").classList.remove("active");
        panelState.appearance.open = false; savePanels();
      }

      // ── Dependencies popup (draggable, resizable, persisted) ──────────
      let depsPanel = null;
      let depsResizeObserver = null;

      function buildDepsPanel() {
        const panel = makeEl("div", { class: "dep-panel", role: "dialog", "aria-label": "Dependencies" });
        if (typeof panelState.deps.width === "number") {
          panel.style.width = panelState.deps.width + "px";
          panel.style.height = panelState.deps.height + "px";
        } else {
          panel.style.right = "18px";
          panel.style.bottom = "42px";
        }
        const close = makeEl("button", { class: "tw-close", title: "Close" }, "×");
        close.addEventListener("click", hideDeps);
        const body = makeEl("div", { class: "dep-body" });
        const header = makeEl("div", { class: "tw-header" }, [
          makeEl("div", { class: "tw-title" }, [makeEl("span", { class: "tw-pill" }), "Dependencies"]),
          close,
        ]);
        panel.append(header, body);
        renderDeps(body, currentDependencyGraph());
        makeDraggable(panel, header, panelState.deps);
        // Persist size as the user resizes; the SVG viewBox auto-rescales, so no
        // re-layout is needed.
        depsResizeObserver = new ResizeObserver(() => {
          panelState.deps.width = panel.offsetWidth;
          panelState.deps.height = panel.offsetHeight;
          savePanels();
        });
        depsResizeObserver.observe(panel);
        return panel;
      }
      function showDeps() {
        if (depsPanel) { hideDeps(); return; }
        depsPanel = buildDepsPanel();
        document.body.append(depsPanel);
        applyPanelPos(depsPanel, panelState.deps);
        byId("deps-btn").classList.add("active");
        panelState.deps.open = true; savePanels();
      }
      function hideDeps() {
        if (depsResizeObserver) { depsResizeObserver.disconnect(); depsResizeObserver = null; }
        if (depsPanel) { depsPanel.remove(); depsPanel = null; }
        byId("deps-btn").classList.remove("active");
        panelState.deps.open = false; savePanels();
      }
      // Re-render the open dependency graph when the sources change.
      function refreshDepsPanel() {
        if (depsPanel) {
          const body = depsPanel.querySelector(".dep-body");
          body.textContent = "";
          renderDeps(body, currentDependencyGraph());
        }
      }

      // ── Find in all files (Search panel) ──────────────────────────────
      let searchPanel = null;
      let searchResizeObserver = null;

      // Every searchable source: the template tabs (main + partials), the YAML
      // data, and the JSONata transform (when present). The rendered output is
      // generated, not a source, so it's excluded.
      function searchSources() {
        const out = tabs.map((t) => ({ file: t.name, kind: "tmpl", source: t.source }));
        out.push({ file: "data.yaml", kind: "data", source: yamlSrc });
        if (transformSrc.trim()) out.push({ file: "transform", kind: "transform", source: transformSrc });
        return out;
      }

      // Every occurrence of `query` across all sources, grouped by file, each hit
      // carrying its line/column and the full line for a preview.
      function searchAll(query, caseSensitive) {
        if (!query) return [];
        const needle = caseSensitive ? query : query.toLowerCase();
        const groups = [];
        for (const f of searchSources()) {
          const hay = caseSensitive ? f.source : f.source.toLowerCase();
          const hits = [];
          let from = 0, idx;
          while ((idx = hay.indexOf(needle, from)) !== -1) {
            const lineStart = f.source.lastIndexOf("\n", idx - 1) + 1;
            const nl = f.source.indexOf("\n", idx);
            const lineEnd = nl === -1 ? f.source.length : nl;
            hits.push({
              line: f.source.slice(0, idx).split("\n").length,
              col: idx - lineStart + 1,
              lineText: f.source.slice(lineStart, lineEnd),
              matchInLine: idx - lineStart,
            });
            from = idx + needle.length;
            if (hits.length >= 999) break; // guard against pathological inputs
          }
          if (hits.length) groups.push({ file: f.file, kind: f.kind, hits });
        }
        return groups;
      }

      function renderSearchResults(panel, query) {
        const caseSensitive = panel.querySelector(".search-case input").checked;
        const results = panel.querySelector(".search-results");
        const count = panel.querySelector(".search-count");
        results.innerHTML = "";
        if (!query) {
          count.textContent = "";
          results.append(makeEl("div", { class: "search-empty" }, "Type to search all files."));
          return;
        }
        const groups = searchAll(query, caseSensitive);
        const total = groups.reduce((n, g) => n + g.hits.length, 0);
        count.textContent = total
          ? `${total} match${total === 1 ? "" : "es"} in ${groups.length} file${groups.length === 1 ? "" : "s"}`
          : "";
        if (!total) {
          results.append(makeEl("div", { class: "search-empty" }, "No matches."));
          return;
        }
        const qlen = query.length;
        for (const g of groups) {
          results.append(makeEl("div", { class: "search-file" }, [g.file, makeEl("span", { class: "n" }, String(g.hits.length))]));
          for (const h of g.hits) {
            const txt = makeEl("span", { class: "txt" }, [
              h.lineText.slice(0, h.matchInLine),
              makeEl("mark", {}, h.lineText.slice(h.matchInLine, h.matchInLine + qlen)),
              h.lineText.slice(h.matchInLine + qlen),
            ]);
            const row = makeEl("div", { class: "search-hit", title: `${g.file}:${h.line}:${h.col}` }, [
              makeEl("span", { class: "ln" }, `${h.line}:${h.col}`), txt,
            ]);
            row.addEventListener("click", () => openSearchResult(g.file, g.kind, h.line, h.col, qlen));
            results.append(row);
          }
        }
      }

      // Open a hit: switch to its file/tab and select the matched range.
      function openSearchResult(file, kind, line, col, len) {
        const select = (view) => {
          const ln = Math.max(1, Math.min(view.state.doc.lines, line));
          const lineObj = view.state.doc.line(ln);
          const fromPos = Math.min(lineObj.to, lineObj.from + Math.max(0, col - 1));
          const toPos = Math.min(lineObj.to, fromPos + len);
          view.focus();
          view.dispatch({ selection: { anchor: fromPos, head: toPos }, scrollIntoView: true });
        };
        if (kind === "data" || kind === "transform") {
          selectDataTab(kind === "transform" ? "transform" : "data");
          select(dataView);
        } else {
          const idx = tabIndexByFile(file);
          if (idx >= 0) selectTemplateTab(idx);
          select(templateView);
        }
      }

      function buildSearchPanel() {
        const panel = makeEl("div", { class: "search-panel", role: "dialog", "aria-label": "Search" });
        if (typeof panelState.search.width === "number") {
          panel.style.width = panelState.search.width + "px";
          panel.style.height = panelState.search.height + "px";
        } else { panel.style.right = "18px"; panel.style.top = "56px"; }
        const close = makeEl("button", { class: "tw-close", title: "Close" }, "×");
        close.addEventListener("click", hideSearch);
        const header = makeEl("div", { class: "tw-header" }, [
          makeEl("div", { class: "tw-title" }, [makeEl("span", { class: "tw-pill" }), "Search"]),
          close,
        ]);
        const input = makeEl("input", { type: "text", class: "search-input", placeholder: "Find in all files…", autocomplete: "off", spellcheck: "false" });
        const caseBox = makeEl("input", { type: "checkbox" });
        const caseLabel = makeEl("label", { class: "search-case", title: "Case sensitive" }, [caseBox, "Aa"]);
        const bar = makeEl("div", { class: "search-bar" }, [input, caseLabel]);
        const count = makeEl("div", { class: "search-count" });
        const results = makeEl("div", { class: "search-results" });
        panel.append(header, bar, count, results);
        const rerun = debounce(() => renderSearchResults(panel, input.value), 120);
        input.addEventListener("input", rerun);
        caseBox.addEventListener("change", () => renderSearchResults(panel, input.value));
        input.addEventListener("keydown", (e) => { if (e.key === "Escape") hideSearch(); });
        makeDraggable(panel, header, panelState.search);
        searchResizeObserver = new ResizeObserver(() => {
          panelState.search.width = panel.offsetWidth;
          panelState.search.height = panel.offsetHeight;
          savePanels();
        });
        searchResizeObserver.observe(panel);
        renderSearchResults(panel, "");
        return panel;
      }

      function showSearch() {
        if (searchPanel) {
          const i = searchPanel.querySelector(".search-input");
          i.focus(); i.select();
          return;
        }
        searchPanel = buildSearchPanel();
        document.body.append(searchPanel);
        applyPanelPos(searchPanel, panelState.search);
        byId("search-btn").classList.add("active");
        panelState.search.open = true; savePanels();
        searchPanel.querySelector(".search-input").focus();
      }
      function hideSearch() {
        if (searchResizeObserver) { searchResizeObserver.disconnect(); searchResizeObserver = null; }
        if (searchPanel) { searchPanel.remove(); searchPanel = null; }
        byId("search-btn").classList.remove("active");
        panelState.search.open = false; savePanels();
      }
      // Re-run the open search when sources change (line numbers may have moved).
      function refreshSearchPanel() {
        if (searchPanel) renderSearchResults(searchPanel, searchPanel.querySelector(".search-input").value);
      }

      // Restore floating panels saved from a previous session. Appearance opens
      // unless it was explicitly closed (preserving the first-load default);
      // Dependencies and Search open only when they were left open.
      function restorePanels() {
        if (panelState.appearance.open !== false) showTweaks();
        if (panelState.deps.open) showDeps();
        if (panelState.search.open) showSearch();
      }

      // ── Wire events ───────────────────────────────────────────────────
      byId("share-btn").addEventListener("click", copyShareLink);
      byId("cmd-btn").addEventListener("click", openPalette);
      byId("tweaks-btn").addEventListener("click", showTweaks);
      byId("deps-btn").addEventListener("click", showDeps);
      byId("search-btn").addEventListener("click", showSearch);

      // Close the example dropdown on an outside click or Escape.
      document.addEventListener("pointerdown", (e) => {
        if (!byId("example-menu").hidden && !byId("example-select").contains(e.target)) {
          closeExampleMenu();
        }
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !byId("example-menu").hidden) closeExampleMenu();
      });

      byId("escape-select").addEventListener("change", (e) => {
        escapeMode = e.target.value; run(); updateStatusMeta();
      });

      // Group label hover: show a tooltip listing the group's transformers by usage category.
      {
        const grpTip = byId("grp-tip");
        document.querySelectorAll("[data-group]").forEach(label => {
          label.addEventListener("mouseenter", () => {
            const m = GROUP_META[label.dataset.group]; if (!m) return;
            grpTip.innerHTML =
              `<strong>${label.dataset.group}</strong> <span style="color:${m.color};font-size:10px">● ${m.risk}</span>` +
              `<hr style="border:none;border-top:1px solid var(--border);margin:4px 0">` +
              m.sections.map(sec =>
                `<span style="opacity:.45;font-size:9px;text-transform:uppercase;letter-spacing:.06em">${sec.label}</span><br>` +
                sec.items.map(([n]) => `<code style="font-size:10px">${n}</code>`).join("  ")
              ).join("<br>");
            const r = label.getBoundingClientRect();
            grpTip.style.left = Math.min(r.left, window.innerWidth - 290) + "px";
            grpTip.style.top  = (r.bottom + 6) + "px";
            grpTip.hidden = false;
          });
          label.addEventListener("mouseleave", () => { grpTip.hidden = true; });
        });
      }

      // ── Diagnostics dock (Problems + Dependencies) ────────────────────
      // A persistent bottom dock surfacing compile/capability problems and the
      // partial dependency graph (built from the engine's `parse_ast`). Hidden
      // until toggled; refreshed by setOutput() on every run.
      let dockTab = "problems";
      let ctxTarget = null; // { file, start, end, label } — the last-clicked output span

      // A source slice can be a long, multi-line literal (e.g. a whole <style>
      // block); collapse it to one trimmed line for compact inspector labels.
      const oneLineLabel = (text, max = 60) => {
        const flat = text.replace(/\s+/g, " ").trim();
        return flat.length > max ? flat.slice(0, max) + "…" : flat;
      };

      function dockVisible() { return !byId("dock").hidden; }

      function makeEl(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else if (k === "style") node.style.cssText = v;
          else node.setAttribute(k, v);
        }
        for (const c of [].concat(children)) {
          if (c == null) continue;
          node.append(typeof c === "string" ? document.createTextNode(c) : c);
        }
        return node;
      }

      // Parse main + every partial to its pre-expansion AST, then derive the DAG.
      function currentDependencyGraph() {
        const asts = {};
        const parsed = renderer.parseAst(tabs[0].source);
        asts.main = parsed.ast ? parsed.ast.nodes : [];
        for (const [name, src] of Object.entries(partialsMap())) {
          const p = renderer.parseAst(src);
          asts[name] = p.ast ? p.ast.nodes : [];
        }
        return buildDependencyGraph(asts);
      }

      function renderDock() {
        const probCount = dockProblems.length;
        const probBadge = byId("dock-badge-problems");
        probBadge.textContent = String(probCount);
        probBadge.className =
          "badge" + (probCount ? (dockProblems.some((p) => p.severity === "error" || p.severity === "render") ? " danger" : " warn") : " success");

        // Auto-open on the 0->>0 transition (an error just appeared) so problems
        // surface without a click; won't fight a manual close while errors persist.
        if (probCount > 0 && !hadProblems && byId("dock").hidden) {
          byId("dock").hidden = false;
          byId("dock-toggle").classList.add("active");
          byId("dock-toggle").setAttribute("aria-pressed", "true");
          byId("dock").classList.remove("collapsed");
          dockTab = "problems";
          for (const el of document.querySelectorAll(".dock-tab")) {
            el.classList.toggle("active", el.dataset.dock === "problems");
          }
        }
        hadProblems = probCount > 0;

        if (!dockVisible() || byId("dock").classList.contains("collapsed")) return;
        const body = byId("dock-body");
        body.textContent = "";
        renderProblems(body);
      }

      // Context Inspector: snapshots of the render context at the last-clicked
      // output span, from the engine's `inspect_at` — one card per execution
      // (loop bodies yield one per iteration).
      function renderContext(body) {
        const pane = makeEl("div", { class: "ctx-pane" });
        if (!ctxTarget || !lastProgram) {
          pane.append(makeEl("div", { class: "ctx-hint" },
            "Click an expression in the Plain Text output to inspect its scope here. " +
            "Loop bodies produce one snapshot per iteration."));
          body.append(pane);
          return;
        }
        let snaps;
        try {
          snaps = renderer.inspectAt(
            lastProgram, lastData,
            { file: ctxTarget.file, start: ctxTarget.start, end: ctxTarget.end },
            { transformers: groups }
          );
        } catch (err) {
          pane.append(makeEl("div", { class: "ctx-hint" }, "inspect error: " + err.message));
          body.append(pane);
          return;
        }
        pane.append(makeEl("div", { class: "ctx-hint" },
          `${snaps.length} snapshot${snaps.length === 1 ? "" : "s"} at \`${oneLineLabel(ctxTarget.label)}\`` +
          " · re-execute-on-demand, no live trace"));
        snaps.forEach((s, i) => pane.append(renderSnap(s, i)));
        if (!snaps.length) {
          pane.append(makeEl("div", { style: "padding:8px 2px;color:var(--fg-muted);font-size:12px" },
            "This span was never reached during render."));
        }
        body.append(pane);
      }

      function renderSnap(snap, i) {
        const head = makeEl("div", { class: "ctx-snap-head" }, [
          makeEl("span", { class: "ix" }, "#" + (i + 1)),
          makeEl("span", { class: "src" }, oneLineLabel(ctxTarget.label)),
        ]);
        const rows = [
          ["@this", snap.this], ["@parent", snap.parent], ["@root", snap.root],
          ["@index", snap.index], ["@index1", snap.index1], ["@key", snap.key],
          ["@first", snap.first], ["@last", snap.last],
        ].filter(([, v]) => v !== null && v !== undefined);
        for (const [k, v] of Object.entries(snap.locals || {})) rows.push([k, v]);
        const table = makeEl("div", { class: "ctx-snap-table" });
        for (const [k, v] of rows) {
          table.append(makeEl("span", { class: "key" }, k));
          table.append(makeEl("span", { class: "val" }, [
            ctxSnippet(v),
            makeEl("span", { class: "ty" }, ctxType(v)),
          ]));
        }
        return makeEl("div", { class: "ctx-snap" }, [head, table]);
      }
      function ctxSnippet(v) {
        if (v === null || v === undefined) return "—";
        if (typeof v === "object") {
          try { return JSON.stringify(v).slice(0, 120); } catch { return "[object]"; }
        }
        if (typeof v === "string") return JSON.stringify(v.length > 80 ? v.slice(0, 80) + "…" : v);
        return String(v);
      }
      function ctxType(v) {
        if (v === null) return "null";
        if (Array.isArray(v)) return `array(${v.length})`;
        return typeof v;
      }

      // Point the Context Inspector at a clicked output segment (emit/expr runs
      // only; literal text has no inspectable scope). Opens the Context tab when
      // the dock is visible; otherwise stored for when it next opens.
      function setContextTarget(sv) {
        if (!sv || sv.start === null) return;
        const src = fileSource(sv.file);
        const [from, to] = byteRangeToCharRange(src, sv.start, sv.end);
        const label = src.slice(from, to).trim() || `${sv.file}:${sv.start}`;
        ctxTarget = { file: sv.file, start: sv.start, end: sv.end, label };
        selectDataTab("context");
      }

      // The active template tab's pre-expansion AST (real `parse_ast`), as an
      // indented outline. Clicking a row highlights its source span in the editor.
      function renderAst(body) {
        const source = activeTab().source;
        const parsed = renderer.parseAst(source);
        if (parsed.error) {
          body.append(makeEl("div", { class: "problem-empty" }, parsed.error.message));
          return;
        }
        const rows = astOutline(parsed.ast.nodes);
        if (!rows.length) {
          body.append(makeEl("div", { class: "problem-empty" }, "empty template — no nodes"));
          return;
        }
        const pane = makeEl("div", { class: "ast-pane" });
        rows.forEach((r, i) => {
          const row = makeEl("div", { class: "ast-row" });
          // A line-number gutter (the inspector panel isn't a CodeMirror editor,
          // so it has no gutter of its own) and the node-type keyword coloured.
          row.append(makeEl("span", { class: "ast-ln" }, String(i + 1)));
          const content = makeEl("span", { class: "ast-content", style: `padding-left:${r.depth * 16}px` });
          const sp = r.text.indexOf(" ");
          if (sp > 0) content.append(makeEl("span", { class: "ast-kw" }, r.text.slice(0, sp)), r.text.slice(sp));
          else content.append(makeEl("span", { class: "ast-kw" }, r.text));
          row.append(content);
          if (typeof r.start === "number") {
            row.classList.add("linked");
            row.addEventListener("mouseenter", () => {
              const [from, to] = byteRangeToCharRange(source, r.start, r.end);
              templateView.dispatch({ effects: setLinkHighlight.of({ from, to }) });
            });
            row.addEventListener("mouseleave", clearLink);
            row.addEventListener("click", () => {
              const [from] = byteRangeToCharRange(source, r.start, r.end);
              templateView.focus();
              templateView.dispatch({ selection: { anchor: from }, scrollIntoView: true });
            });
          }
          pane.append(row);
        });
        body.append(pane);
      }

      function renderProblems(body) {
        if (!dockProblems.length) {
          body.append(makeEl("div", { class: "problem-empty" }, [
            makeEl("b", {}, "✓ No errors. "),
            "Compile and capability checks passed.",
          ]));
          return;
        }
        for (const p of dockProblems) {
          const sev = p.severity === "cap" ? "cap" : p.severity === "render" ? "render" : "error";
          const row = makeEl("div", { class: `problem ${sev}`, title: "jump to source" }, [
            makeEl("span", { class: "sev" }, sev === "cap" ? "!" : "×"),
            makeEl("span", { class: "where" }, `${p.file}:${p.line}:${p.col}`),
            makeEl("span", { class: "msg" }, p.message),
            makeEl("span", { class: "src" }, p.severity === "cap" ? "capability" : "compile"),
          ]);
          row.addEventListener("click", () => openProblem(p));
          body.append(row);
        }
      }

      // Jump from a Problems row to its source location.
      function openProblem(p) {
        if (p.file === "data.yaml" || p.file === "transform") {
          selectDataTab(p.file === "transform" ? "transform" : "data");
          moveCaretTo(dataView, p.line, p.col);
          return;
        }
        const idx = tabIndexByFile(p.file);
        if (idx < 0) return;
        selectTemplateTab(idx);
        moveCaretTo(templateView, p.line, p.col);
      }
      function moveCaretTo(view, line, col) {
        const ln = Math.max(1, Math.min(view.state.doc.lines, line || 1));
        const lineObj = view.state.doc.line(ln);
        const pos = Math.min(lineObj.to, lineObj.from + Math.max(0, (col || 1) - 1));
        view.focus();
        view.dispatch({ selection: { anchor: pos }, scrollIntoView: true });
      }

      const SVG_NS = "http://www.w3.org/2000/svg";
      function svgEl(tag, attrs = {}) {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        return node;
      }

      // A tidy hierarchical (sitemap) layout: a spanning tree rooted at `main`
      // (first reference wins), depth = row, and each node centered over its
      // children — so a child sits directly under its parent (e.g. `row` under
      // `group`), like a site map. Returns id -> center {x, y}.
      function layeredLayout(deps, width, height) {
        const adj = new Map();
        for (const e of deps.edges) {
          if (e.missing) continue;
          if (!adj.has(e.from)) adj.set(e.from, []);
          adj.get(e.from).push(e.to);
        }
        // Spanning tree (BFS, first parent wins), then any unreached nodes as roots.
        const children = new Map(deps.nodes.map((n) => [n.id, []]));
        const seen = new Set();
        const roots = [];
        const visit = (root) => {
          seen.add(root);
          roots.push(root);
          const queue = [root];
          while (queue.length) {
            const cur = queue.shift();
            for (const to of adj.get(cur) || []) {
              if (seen.has(to) || !children.has(to)) continue;
              seen.add(to);
              children.get(cur).push(to);
              queue.push(to);
            }
          }
        };
        if (children.has("main")) visit("main");
        for (const n of deps.nodes) if (!seen.has(n.id)) visit(n.id);

        const depth = new Map();
        const setDepth = (id, d) => {
          depth.set(id, d);
          for (const c of children.get(id)) setDepth(c, d + 1);
        };
        for (const r of roots) setDepth(r, 0);

        // Post-order column: leaves get sequential slots, parents center over
        // their children, so a subtree stays grouped under its root.
        let leaf = 0;
        const col = new Map();
        const assignCol = (id) => {
          const kids = children.get(id);
          if (!kids.length) { col.set(id, leaf++); return col.get(id); }
          const c = kids.reduce((s, k) => s + assignCol(k), 0) / kids.length;
          col.set(id, c);
          return c;
        };
        for (const r of roots) assignCol(r);

        // Group ids by depth (left-to-right) so a dense level can be staggered:
        // adjacent siblings alternate up/down, letting columns pack at half the
        // box width without the boxes overlapping (the user's interleave fix).
        const byDepth = new Map();
        for (const n of deps.nodes) {
          const d = depth.get(n.id) || 0;
          (byDepth.get(d) || byDepth.set(d, []).get(d)).push(n.id);
        }
        for (const ids of byDepth.values()) ids.sort((a, b) => col.get(a) - col.get(b));

        // Fixed pitches → natural content size; the SVG viewBox scales to fit.
        const boxW = 104, boxH = 32, colPitch = 66, stagger = boxH / 2 + 10, m = 30;
        const rowPitch = boxH + 2 * stagger + 30;
        const pos = new Map();
        for (const [d, ids] of byDepth) {
          const dense = ids.length > 1; // colPitch < boxW, so any neighbour pair would touch
          ids.forEach((id, i) => {
            const x = m + boxW / 2 + col.get(id) * colPitch;
            let y = m + boxH / 2 + stagger + d * rowPitch;
            if (dense) y += i % 2 === 0 ? -stagger : stagger;
            pos.set(id, { x, y });
          });
        }
        const maxCol = Math.max(0, ...col.values());
        const maxD = Math.max(0, ...depth.values());
        const w = 2 * m + boxW + maxCol * colPitch;
        const h = 2 * m + boxH + 2 * stagger + maxD * rowPitch;
        return { pos, w, h };
      }

      function renderDeps(body, deps) {
        const boxW = 104, boxH = 32;
        // The tidy tree sizes its own canvas to the content (natural pitches);
        // the viewBox then scales to fit, so there is no stretched empty space.
        const { pos, w: W, h: H } = layeredLayout(deps);

        const cyclePairs = new Set();
        for (const c of deps.cycles) {

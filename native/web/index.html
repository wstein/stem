    <title>Stem Playground — IDE</title>
    <style>
      /* ── Design tokens ───────────────────────────────────────────── */
      :root {
        /* Light — violet-kissed whites */
        --bg: #ffffff;
        --bg-1: #faf8ff;      /* barely-violet wash */
        --bg-2: #f2effc;      /* violet-8 at 70% */
        --bg-3: #e8e3f8;
        --bg-toolbar: #ffffff;
        --bg-statusbar: #faf8ff;
        --bg-tab-active: #ffffff;
        --bg-tab-inactive: transparent;
        --bg-pane: #ffffff;
        --bg-gutter: #f7f4fe;

        --fg: #18181b;             /* near-black for readability */
        --fg-secondary: #3b1b6b;   /* brand violet-4 */
        --fg-muted: #6b5ca5;       /* muted purple */
        --fg-faint: #9e8dc4;       /* light purple-gray */

        --border: #ddd6f8;         /* violet-tinted */
        --border-strong: #c8bff2;

        /* Brand palette — Stem Identity v0.1 */
        --accent: #7c4dff;        /* Elixir Purple · violet-6 */
        --accent-2: #5a2ea6;      /* violet-5 */
        --accent-soft: #e7defc;   /* violet-8 */
        --accent-softer: #f0ebfe;
        --stem-green: #10b981;    /* Growth Green · green-5 */
        --stem-mint: #3ee0a3;     /* mint · green-6 */

        --danger: #b91c1c;
        --danger-faint: #fee2e2;
        --success: #10b981;       /* Growth Green */

        --tok-tag: #7c4dff;       /* violet-6 */
        --tok-cmt: #94a3b8;
        --tok-key: #1d4ed8;
        --tok-str: #047857;
        --tok-num: #b45309;

        --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

        --topbar-h: 44px;
        --statusbar-h: 26px;
        --pane-header-h: 38px;
        --tabs-h: 30px;
        --radius: 6px;

        --shadow-pop: 0 12px 32px -8px rgba(24,24,27,.18), 0 0 0 1px rgba(24,24,27,.06);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: var(--font-ui);
        font-size: 13px; line-height: 1.45;
        color: var(--fg); background: var(--bg-1);
        -webkit-font-smoothing: antialiased;
      }

      button { font: inherit; color: inherit; }
      input, select { font: inherit; color: inherit; }
      kbd {
        font: 11px/1 var(--font-mono);
        background: var(--bg-2); border: 1px solid var(--border);
        border-bottom-width: 2px; padding: 2px 5px; border-radius: 4px;
        color: var(--fg-secondary);
      }

      /* ── App shell ───────────────────────────────────────────────── */
      #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

      /* ── Top bar ─────────────────────────────────────────────────── */
      .topbar {
        height: var(--topbar-h); flex: 0 0 auto;
        display: flex; align-items: center; gap: 14px; padding: 0 12px;
        background: var(--bg-toolbar); border-bottom: 1px solid var(--border);
        user-select: none;
      }
      .brand {
        display: flex; align-items: center; gap: 8px;
        font-weight: 600; font-size: 13px; letter-spacing: -.01em; padding-right: 8px;
      }
      .brand .mark {
        width: 22px; height: 22px; flex: 0 0 22px; display: block;
      }
      .topbar .divider { width: 1px; height: 18px; background: var(--border); }
      .topbar-group { display: flex; align-items: center; gap: 6px; }
      .field-label { color: var(--fg-muted); font-size: 12px; padding-right: 2px; }

      select.select, button.btn {
        height: 26px; padding: 0 8px;
        border: 1px solid var(--border-strong); border-radius: var(--radius);
        background: var(--bg); color: var(--fg); font-size: 12px; cursor: pointer;
        transition: background 80ms ease, border-color 80ms ease;
      }
      select.select:hover, button.btn:hover { background: var(--bg-2); }
      select.select:focus, button.btn:focus {
        outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
      }
      button.btn .kbd-inline { color: var(--fg-faint); margin-left: 6px; font: 11px/1 var(--font-mono); }

      .spacer { flex: 1 1 auto; }
      .hint { font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; }

      /* ── Workspace ───────────────────────────────────────────────── */
      .workspace {
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: row;
        background: var(--border);
      }
      .pane {
        flex: 1 1 0; min-width: 220px; background: var(--bg-pane);
        display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      }

      /* ── Splitter ────────────────────────────────────────────────── */
      .splitter {
        flex: 0 0 6px; background: var(--border); cursor: col-resize;
        position: relative; transition: background 100ms ease;
      }
      .splitter::after { content: ""; position: absolute; inset: 0; margin: 0 -3px; }
      .splitter:hover, .splitter.dragging { background: var(--accent); }
      body.dragging-col { cursor: col-resize !important; }
      body.dragging-row { cursor: row-resize !important; }
      body.dragging-col *, body.dragging-row * { user-select: none !important; }
      body.dragging-col iframe, body.dragging-row iframe { pointer-events: none !important; }

      /* ── Pane header ─────────────────────────────────────────────── */
      .pane-header {
        flex: 0 0 var(--pane-header-h); height: var(--pane-header-h);
        display: flex; align-items: center; gap: 10px; padding: 0 12px;
        border-bottom: 1px solid var(--border); background: var(--bg-toolbar);
      }
      .pane-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
      .pane-title h2 {
        flex: 0 0 auto; margin: 0; font-size: 12px; font-weight: 600;
        letter-spacing: .04em; text-transform: uppercase; color: var(--fg-secondary);
      }
      .pane-title .sub {
        font-size: 11px; color: var(--fg-faint);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
      }
      .pane-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
      .pane-controls { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
      .pane-header .divider { width: 1px; height: 16px; background: var(--border); flex: 0 0 auto; }

      .segmented {
        display: inline-flex; border: 1px solid var(--border-strong);
        border-radius: var(--radius); overflow: hidden; background: var(--bg);
      }
      .segmented button {
        background: transparent; border: 0; padding: 0 10px; height: 24px;
        font-size: 12px; color: var(--fg-secondary); cursor: pointer;
      }
      .segmented button:hover { background: var(--bg-2); }
      .segmented button.on { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }

      /* ── Tabs ────────────────────────────────────────────────────── */
      .tabs-wrap {
        flex: 0 0 var(--tabs-h); height: var(--tabs-h);
        display: flex; align-items: stretch;
        border-bottom: 1px solid var(--border); background: var(--bg-2); min-width: 0;
      }
      .tabs {
        flex: 1 1 0; min-width: 0; height: 100%;
        display: flex; align-items: flex-end; padding: 0 4px; gap: 1px;
        overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
      }
      .tabs::-webkit-scrollbar { height: 4px; }
      .tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

      .tab {
        flex: 0 0 auto; height: calc(var(--tabs-h) - 1px);
        display: inline-flex; align-items: center; gap: 6px;
        padding: 0 10px 0 12px; border-right: 1px solid var(--border);
        background: var(--bg-tab-inactive); color: var(--fg-secondary);
        font-size: 12px; font-family: var(--font-mono);
        cursor: pointer; position: relative; user-select: none; white-space: nowrap;
      }
      .tab:hover { background: var(--bg-3); color: var(--fg); }
      .tab.active { background: var(--bg-tab-active); color: var(--fg); font-weight: 600; }
      .tab.active::after {
        content: ""; position: absolute; left: 0; right: 0; top: 0;
        height: 2px; background: var(--accent);
      }
      .tab.is-main::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: var(--accent); margin-right: 2px;
      }
      .tab .close {
        width: 16px; height: 16px; display: grid; place-items: center;
        border-radius: 3px; color: var(--fg-faint); font-size: 12px; margin-left: 2px;
      }
      .tab .close:hover { background: var(--border); color: var(--fg); }
      .tab-add {
        flex: 0 0 auto; height: calc(var(--tabs-h) - 1px);
        padding: 0 10px; border: 0; background: transparent;
        color: var(--fg-muted); font-family: var(--font-mono); font-size: 12px;
        cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
      }
      .tab-add:hover { color: var(--accent); background: var(--bg-3); }

      /* ── Inline tab rename (active partial tab) ──────────────────── */
      .tab .tab-edit {
        border: 0; background: transparent; color: inherit;
        font: inherit; padding: 0; margin: 0; outline: none; min-width: 3ch;
      }

      /* ── Editor panes (CodeMirror) ───────────────────────────────── */
      /* Template + data editors shown together, perpendicular to the workspace:
         stacked when the workspace is split (the default), side-by-side when the
         workspace is stacked. A draggable .esplitter sits between them. */
      .editors { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; min-width: 0; }
      .editors > .editor-pane { flex: 1 1 0; }
      .editor-cell { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .editor-cell > .editor-pane { flex: 1 1 auto; }
      .cell-label {
        flex: 0 0 auto; height: 24px; display: flex; align-items: center; gap: 6px;
        padding: 0 12px; font: 11px/1 var(--font-mono); color: var(--tok-key);
        background: var(--accent-softer); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      }
      .cell-dot { width: 6px; height: 6px; border-radius: 2px; background: var(--tok-key); }
      .yaml-ver {
        margin-left: auto; color: var(--fg-faint);
        font-size: 10px; font-weight: bold; letter-spacing: .02em; opacity: .7;
      }
      .workspace.stacked .editors { flex-direction: row; }
      .editor-pane { display: block; overflow: hidden; min-width: 0; min-height: 0; }

      .esplitter {
        flex: 0 0 6px; background: var(--border); position: relative;
        cursor: row-resize; transition: background 100ms ease;
      }
      .esplitter::after { content: ""; position: absolute; inset: -3px; }
      .workspace.stacked .esplitter { cursor: col-resize; }
      .esplitter:hover, .esplitter.dragging { background: var(--accent); }

      .editor-pane .cm-editor { height: 100%; font-size: 12.5px; }
      .editor-pane .cm-scroller { overflow: auto; }
      .editor-pane .cm-gutters {
        background: var(--bg-gutter); border-right: 1px solid var(--border);
        color: var(--fg-faint); min-width: 38px;
      }
      .editor-pane .cm-activeLineGutter { background: var(--accent-softer); color: var(--fg-muted); }
      .editor-pane .cm-content { padding: 8px 0; }
      .editor-pane .cm-line { padding: 0 12px; }
      .editor-pane .cm-selectionBackground { background: var(--accent-soft) !important; }

      /* Handlebars token colours for CM decorations */
      .cm-hb-comment { color: var(--tok-cmt); font-style: italic; }
      .cm-hb-block   { color: var(--tok-tag); font-weight: 500; }
      .cm-hb-partial { color: var(--tok-str); font-weight: 500; }
      .cm-hb-raw     { color: var(--tok-num); }
      .cm-hb-expr    { color: var(--tok-key); }
      /* YAML scalar keywords (true/false/null/…) and numbers — the YAML grammar
         leaves these as plain content, so they are highlighted via a decorator. */
      .cm-yaml-kw    { color: var(--tok-tag); font-weight: 600; }
      .cm-yaml-num   { color: var(--tok-num); }

      /* ── Output pane ─────────────────────────────────────────────── */
      .output-body {
        flex: 1 1 auto; min-height: 0; position: relative;
        background: var(--bg-pane); overflow: hidden;
      }
      .output-body iframe { width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }
      .output-body pre {
        margin: 0; padding: 12px 14px; width: 100%; height: 100%; overflow: auto;
        background: var(--bg-1); color: var(--fg);
        font: 12.5px/1.55 var(--font-mono); white-space: pre-wrap; word-break: break-word;
      }
      .output-body[data-empty="true"]::after {
        content: "no output"; position: absolute; inset: 0;
        display: grid; place-items: center;
        color: var(--fg-faint); font-size: 12px; pointer-events: none;
      }

      /* Source view: each run of output is a segment tracing back to the file
         (and, for expressions, the tag) that produced it. Hover to highlight +
         tooltip; click to jump to the source. */
      .output-body pre .seg { border-radius: 2px; cursor: pointer; }
      .output-body pre .seg.seg-expr {
        font-weight: 700; color: var(--tok-key);
        box-shadow: inset 0 -1px 0 var(--accent-soft);
      }
      .output-body pre .seg:hover,
      .output-body pre .seg.seg-linked {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      /* The editor/tab side of the link: hovering an output run highlights its
         source span in the editor (if shown) or tints its tab (if not). Visually
         kin to .seg:hover, distinct from the text selection and lint marks. */
      .cm-link-highlight {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent);
        border-radius: 2px;
      }
      .tab.tab-linked { box-shadow: inset 0 -2px 0 var(--accent); }
      .seg-tip {
        position: fixed; z-index: 60; max-width: 340px; padding: 6px 9px;
        border-radius: 7px; background: var(--bg-pane); color: var(--fg);
        border: 1px solid var(--border); box-shadow: var(--shadow-pop);
        font: 11.5px/1.45 system-ui, sans-serif; pointer-events: none;
      }
      .seg-tip .seg-tip-file { color: var(--accent-2); font-weight: 600; }
      .seg-tip code {
        display: block; margin-top: 3px; font: 11px/1.4 var(--font-mono);
        color: var(--fg-secondary); word-break: break-all;
      }
      .seg-tip .seg-tip-hint {
        display: flex; align-items: center; gap: 4px; margin-top: 5px;
        padding-top: 4px; border-top: 1px solid var(--border);
        color: var(--fg-faint); font-size: 10.5px;
      }
      .seg-tip[hidden] { display: none; }

      /* ── Status bar ──────────────────────────────────────────────── */
      .statusbar {
        flex: 0 0 var(--statusbar-h); height: var(--statusbar-h);
        display: flex; align-items: center; gap: 14px; padding: 0 12px;
        background: var(--bg-statusbar); border-top: 1px solid var(--border);
        font-size: 11.5px; color: var(--fg-secondary); user-select: none;
      }
      .statusbar .status-pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 2px 8px; border-radius: 999px;
      }
      .statusbar .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--success); display: inline-block;
      }
      .statusbar.has-error .dot { background: var(--danger); }
      .statusbar.has-error .status-pill {
        background: var(--danger-faint); color: var(--danger); font-weight: 500;
      }
      .statusbar:not(.has-error) .status-pill { color: var(--success); }
      .statusbar .status-msg { color: inherit; font-family: var(--font-mono); }
      .statusbar .meta { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }
      .statusbar .meta b { color: var(--fg-secondary); font-weight: 600; }

      /* ── Command palette ─────────────────────────────────────────── */
      .palette-backdrop {
        position: fixed; inset: 0; background: rgba(24,24,27,.28);
        display: grid; place-items: start center; padding-top: 14vh; z-index: 100;
      }
      .palette {
        width: 480px; max-width: 92vw; background: var(--bg);
        border-radius: 10px; box-shadow: var(--shadow-pop);
        overflow: hidden; border: 1px solid var(--border);
      }
      .palette input {
        width: 100%; border: 0; border-bottom: 1px solid var(--border);
        padding: 12px 14px; font-size: 14px; outline: none;
        background: var(--bg); color: var(--fg);
      }
      .palette ul { list-style: none; margin: 0; padding: 6px 0; max-height: 50vh; overflow-y: auto; }
      .palette li {
        padding: 8px 14px; display: flex; align-items: center; gap: 10px;
        cursor: pointer; font-size: 13px; color: var(--fg);
      }
      .palette li.sel { background: var(--accent-soft); color: var(--accent-2); }
      .palette li .pkind {
        font: 10px/1 var(--font-mono); color: var(--fg-muted); background: var(--bg-2);
        padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: .04em;
      }
      .palette li.sel .pkind { color: var(--accent-2); }

      /* Toast */
      .toast {
        position: fixed; bottom: calc(var(--statusbar-h) + 12px); left: 50%;
        transform: translateX(-50%) translateY(8px); opacity: 0;
        background: #18181b; color: #fff; padding: 8px 14px; border-radius: 6px;
        font-size: 12px; z-index: 200; pointer-events: none;
        transition: opacity 160ms ease, transform 160ms ease;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* ── Focus mode ──────────────────────────────────────────────── */
      .workspace.focus-sources .pane:not(.pane-sources),
      .workspace.focus-sources .splitter,
      .workspace.focus-output .pane:not(.pane-output),
      .workspace.focus-output .splitter { display: none; }
      .workspace.focus-sources .pane-sources,
      .workspace.focus-output .pane-output { flex: 1 1 100% !important; }

      .focus-toggle {
        width: 24px; height: 24px; border-radius: 4px;
        border: 1px solid transparent; background: transparent;
        display: grid; place-items: center; cursor: pointer; color: var(--fg-faint);
      }
      .focus-toggle:hover { background: var(--bg-2); color: var(--fg); }
      .focus-toggle.on { background: var(--accent-soft); color: var(--accent-2); }
      .focus-toggle svg { width: 13px; height: 13px; }

      /* ── Themes ──────────────────────────────────────────────────── */
      /* Dark — mid-dark violet. Used by the explicit Dark theme, and by
         System when the OS prefers a dark color scheme. Light is :root. */
      body[data-theme="dark"] {
        --bg: #1e1338; --bg-1: #251740; --bg-2: #2f1d52; --bg-3: #3b2568;
        --bg-toolbar: #1e1338; --bg-statusbar: #180f2e;
        --bg-tab-active: #2f1d52; --bg-pane: #231545; --bg-gutter: #1a1030;
        --fg: #e7defc; --fg-secondary: #b59bff; --fg-muted: #8065c4; --fg-faint: #4e3880;
        --border: #3b1b6b; --border-strong: #5a2ea6;
        --accent-soft: #3b1b6b; --accent-softer: #251740;
        --tok-tag: #b59bff; --tok-cmt: #5a4490; --tok-key: #93c5fd;
        --tok-str: #3ee0a3; --tok-num: #fbbf24;
        --success: #3ee0a3;
        --danger-faint: #3b0a0a;
        background-color: var(--bg) !important;
      }
      body[data-theme="dark"] iframe { background: #1a1030; }

      @media (prefers-color-scheme: dark) {
        body[data-theme="system"] {
          --bg: #1e1338; --bg-1: #251740; --bg-2: #2f1d52; --bg-3: #3b2568;
          --bg-toolbar: #1e1338; --bg-statusbar: #180f2e;
          --bg-tab-active: #2f1d52; --bg-pane: #231545; --bg-gutter: #1a1030;
          --fg: #e7defc; --fg-secondary: #b59bff; --fg-muted: #8065c4; --fg-faint: #4e3880;
          --border: #3b1b6b; --border-strong: #5a2ea6;
          --accent-soft: #3b1b6b; --accent-softer: #251740;
          --tok-tag: #b59bff; --tok-cmt: #5a4490; --tok-key: #93c5fd;
          --tok-str: #3ee0a3; --tok-num: #fbbf24;
          --success: #3ee0a3;
          --danger-faint: #3b0a0a;
          background-color: var(--bg) !important;
        }
        body[data-theme="system"] iframe { background: #1a1030; }
      }

      /* ── Stacked layout ──────────────────────────────────────────── */
      .workspace.stacked { flex-direction: column; }
      .workspace.stacked > .splitter {
        width: 100%; height: 6px; cursor: row-resize; flex: 0 0 6px;
      }
      .workspace.stacked .pane { min-width: 0; min-height: 160px; }

      /* ── Tweaks panel ────────────────────────────────────────────── */
      .tw-panel {
        position: fixed; right: 18px; bottom: 42px; width: 300px;
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 10px; box-shadow: var(--shadow-pop); z-index: 150;
        font-family: var(--font-ui); color: var(--fg); overflow: hidden;
      }
      .tw-header {
        display: flex; align-items: center; gap: 8px; padding: 10px 12px;
        border-bottom: 1px solid var(--border); background: var(--bg-1); cursor: move;
      }
      .tw-title {
        display: flex; align-items: center; gap: 8px;
        font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
      }
      .tw-pill {
        width: 8px; height: 8px; border-radius: 2px;
        background: linear-gradient(135deg, #7c4dff 0%, #10b981 100%);
      }
      .tw-close {
        margin-left: auto; width: 22px; height: 22px; border: 0;
        background: transparent; color: var(--fg-muted); font-size: 18px;
        line-height: 1; border-radius: 4px; cursor: pointer;
      }
      .tw-close:hover { background: var(--bg-2); color: var(--fg); }
      .tw-section { padding: 12px 12px 14px; border-bottom: 1px solid var(--border); }
      .tw-section:last-of-type { border-bottom: 0; }
      .tw-section-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
      .tw-section-title {
        font-size: 10px; font-weight: 700; letter-spacing: .1em;
        text-transform: uppercase; color: var(--fg-secondary);
      }
      .tw-section-hint { font-size: 11px; color: var(--fg-faint); margin-left: auto; }
      .tw-section-body { display: flex; gap: 6px; flex-wrap: wrap; }
      .tw-swatch {
        flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
        align-items: center; gap: 6px; padding: 8px 6px;
        border: 1px solid var(--border); border-radius: 6px; background: var(--bg); cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease;
      }
      .tw-swatch:hover { background: var(--bg-1); }
      .tw-swatch.on { border-color: var(--accent); background: var(--accent-softer); }
      .tw-swatch-grid {
        width: 100%; height: 28px; border-radius: 4px; border: 1px solid var(--border);
        background: linear-gradient(135deg, var(--c1) 0%, var(--c1) 40%, var(--c2) 40%, var(--c2) 70%, var(--c3) 70%);
      }
      .tw-swatch-label { font-size: 11px; font-weight: 600; color: var(--fg-secondary); }
      .tw-swatch.on .tw-swatch-label { color: var(--accent-2); }
      .tw-segmented { display: flex; flex: 1 1 100%; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
      .tw-segmented button {
        flex: 1 1 0; border: 0; background: var(--bg); padding: 8px 10px;
        font-size: 12px; font-weight: 500; color: var(--fg-secondary); cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }
      .tw-segmented button + button { border-left: 1px solid var(--border); }
      .tw-segmented button:hover { background: var(--bg-1); }
      .tw-segmented button.on { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
      .tw-foot {
        padding: 8px 12px 10px; font-size: 11px; color: var(--fg-faint);
        background: var(--bg-1); border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- ── Top bar ──────────────────────────────────────────────── -->
      <header class="topbar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M18 10 C14 10 13 12 13 16 L13 21 C13 23 12 24 10 24 C12 24 13 25 13 27 L13 32 C13 36 14 38 18 38"
                  stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M30 10 C34 10 35 12 35 16 L35 21 C35 23 36 24 38 24 C36 24 35 25 35 27 L35 32 C35 36 34 38 30 38"
                  stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="stem-line" d="M24 14 L24 40" stroke="var(--stem-green)" stroke-width="2.4" stroke-linecap="round"/>
            <path class="stem-line" d="M24 24 C21 22 19 22 17 23" stroke="var(--stem-green)" stroke-width="2" stroke-linecap="round"/>
            <path class="stem-line" d="M24 30 C27 28 29 28 31 29" stroke="var(--stem-green)" stroke-width="2" stroke-linecap="round"/>
            <circle class="stem-dot" cx="24" cy="14" r="2" fill="var(--stem-green)"/>
          </svg>
          <span>Stem Playground</span>
        </div>
        <div class="divider"></div>
        <div class="topbar-group">
          <span class="field-label">Example</span>
          <select id="example-select" class="select" aria-label="Load example"></select>
        </div>
        <div class="topbar-group">
          <button id="share-btn" class="btn" title="Copy a link that restores this template and data">Copy link</button>
          <button id="cmd-btn" class="btn" title="Open command palette">Commands <span class="kbd-inline">⌘⇧P</span></button>
          <button id="tweaks-btn" class="btn" title="Open Tweaks panel (theme, layout)">Tweaks</button>
        </div>
        <div class="spacer"></div>
      </header>

      <!-- ── Workspace ────────────────────────────────────────────── -->
      <main class="workspace">
        <!-- Sources pane: template + partial tabs + data.yaml tab -->
        <section class="pane pane-sources" aria-label="Sources">
          <header class="pane-header">
            <div class="pane-title">
              <h2>Sources</h2>
              <span class="sub" id="sources-sub">entry template · compiled in-browser</span>
            </div>
            <div class="pane-actions">
              <button class="focus-toggle" data-pane="sources" title="Focus this pane (Esc to exit)">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/>
                </svg>
              </button>
            </div>
          </header>

          <div class="tabs-wrap">
            <div class="tabs" id="tmpl-tabs"></div>
          </div>

          <!-- Template + data shown together: side-by-side (split) or
               stacked (template above data) per the workspace layout. -->
          <div class="editors">
            <div class="editor-pane" id="template-editor-container"></div>
            <div class="esplitter" id="editor-splitter" title="Drag to resize · double-click to reset"></div>
            <div class="editor-cell">
              <div class="cell-label"><span class="cell-dot"></span>data.yaml<span class="yaml-ver">YAML 1.2</span></div>
              <div class="editor-pane" id="data-editor-container"></div>
            </div>
          </div>
        </section>

        <div id="splitter-1" class="splitter" role="separator" aria-orientation="vertical"
             title="Drag to resize · double-click to reset"></div>

        <!-- Output pane -->
        <section class="pane pane-output" aria-label="Output">
          <header class="pane-header">
            <div class="pane-title">
              <h2>Output</h2>
              <span class="sub">rendered in a locked-down iframe</span>
            </div>
            <div class="divider"></div>
            <div class="pane-controls">
              <!-- The "source" view shows the rendered output as text (with
                   click-to-source provenance); the "rendered" view shows it
                   visually in the iframe. Labels read "Rendered" / "Preview";
                   the data-view keys are kept stable (used by examples + state). -->
              <div class="segmented" role="tablist">
                <button data-view="source">Rendered</button>
                <button data-view="rendered" class="on">Preview</button>
              </div>
              <span class="field-label" style="font-size:11px">Escape</span>
              <select id="escape-select" class="select" aria-label="Escape mode">
                <option value="">(as compiled)</option>
                <option value="html">html</option>
                <option value="xml">xml</option>
                <option value="json">json</option>
                <option value="none">none</option>
              </select>
            </div>
            <div class="pane-actions">
              <button class="focus-toggle" data-pane="output" title="Focus this pane (Esc to exit)">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/>
                </svg>
              </button>
            </div>
          </header>

          <div class="output-body" data-empty="true">
            <iframe id="output-preview" sandbox="allow-same-origin" title="Rendered output"></iframe>
            <pre id="output-source" hidden></pre>
          </div>
          <div id="seg-tip" class="seg-tip" role="tooltip" hidden></div>
        </section>
      </main>

      <!-- ── Status bar ────────────────────────────────────────────── -->
      <footer class="statusbar">
        <span class="status-pill">
          <span class="dot"></span>
          <span id="status-msg" class="status-msg">no errors</span>
        </span>
        <span class="spacer"></span>
        <span id="status-meta" class="meta"></span>
      </footer>
    </div>

    <script type="module">
      import { createRenderer } from "./stem.mjs";
      import {
        byteRangeToCharRange,
        charToByte,
        charToLineColumn,
        debounce,
        decodeState,
        encodeState
      } from "./playground_utils.mjs";
      import { EditorState, Annotation, StateField, StateEffect } from "https://esm.sh/@codemirror/state@6.5.2/es2022/state.mjs";
      import {
        Decoration,
        EditorView,
        MatchDecorator,
        ViewPlugin,
        keymap,
        lineNumbers,
        highlightActiveLine,
        highlightActiveLineGutter
      } from "https://esm.sh/@codemirror/view@6.38.8/X-ZEBjb2RlbWlycm9yL3N0YXRlQDYuNS4y/es2022/view.mjs";
      import { defaultKeymap, history as cmHistory, historyKeymap, indentWithTab } from "https://esm.sh/@codemirror/commands@6.10.3?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      import { defaultHighlightStyle, bracketMatching, syntaxHighlighting } from "https://esm.sh/@codemirror/language@6.11.3?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      import { lintGutter, linter, setDiagnosticsEffect } from "https://esm.sh/@codemirror/lint@6.8.5?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      import { yaml } from "https://esm.sh/@codemirror/lang-yaml@6.1.3?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8,@codemirror/language@6.11.3";
      import { html } from "https://esm.sh/@codemirror/lang-html@6.4.11?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8,@codemirror/language@6.11.3";
      import { load as loadYaml } from "./vendor/js-yaml.mjs";

      // ── Bootstrap ─────────────────────────────────────────────────────
      const WASM = "../stem_native/target/wasm32-unknown-unknown/release/stem_native.wasm";
      const LS_SPLIT  = "stem-playground:splits.v2";
      const LS_TWEAKS = "stem-playground:tweaks";

      const byId = (id) => document.getElementById(id);
      const qs   = (sel) => document.querySelector(sel);

      const renderer = await createRenderer(await (await fetch(WASM)).arrayBuffer());
      const examples = await (await fetch("./examples.json")).json();

      // ── State ─────────────────────────────────────────────────────────
      let tabs        = [{ name: "main", source: "" }];
      let activeTabIdx = 0;
      let activeView   = "tmpl";      // "tmpl" | "data"
      let outputView   = "rendered";  // "rendered" | "source"
      let escapeMode   = "";
      let focusMode    = null;
      let templateDiagnostics = [];

      const activeTab = () => tabs[activeTabIdx];

      function partialsMap() {
        const map = {};
        for (let i = 1; i < tabs.length; i++) map[tabs[i].name] = tabs[i].source;
        return map;
      }

      // ── CodeMirror ────────────────────────────────────────────────────
      const hbExprMark    = Decoration.mark({ class: "cm-hb-expr" });
      const hbCommentMark = Decoration.mark({ class: "cm-hb-comment" });
      const hbBlockMark   = Decoration.mark({ class: "cm-hb-block" });
      const hbPartialMark = Decoration.mark({ class: "cm-hb-partial" });
      const hbRawMark     = Decoration.mark({ class: "cm-hb-raw" });

      const handlebarsDecorator = new MatchDecorator({
        regexp: /\{\{!--[\s\S]*?--\}\}|\{\{![\s\S]*?\}\}|\{\{\{[\s\S]*?\}\}\}|\{\{[\s\S]*?\}\}/g,
        decoration(match) {
          const t = match[0];
          if (t.startsWith("{{!--") || t.startsWith("{{!")) return hbCommentMark;
          if (t.startsWith("{{{"))  return hbRawMark;
          if (t.startsWith("{{>") || t.startsWith("{{ >")) return hbPartialMark;
          if (t.startsWith("{{#") || t.startsWith("{{/") || /^\{\{\s*else\b/.test(t)) return hbBlockMark;
          return hbExprMark;
        }
      });

      const handlebarsHighlighting = ViewPlugin.fromClass(
        class {
          constructor(view) { this.decorations = handlebarsDecorator.createDeco(view); }
          update(update) { this.decorations = handlebarsDecorator.updateDeco(update, this.decorations); }
        },
        { decorations: (v) => v.decorations }
      );

        // YAML scalar-value highlighting. The YAML grammar tags bare scalars as
        // plain content, so booleans/null keywords and numbers get no color. This
        // decorator highlights them when they sit in value position — after `key:`
        // or a `-` sequence dash and spanning the rest of the line (an optional
        // trailing comment aside) — so keys and string values are left untouched.
        const yamlKwMark = Decoration.mark({ class: "cm-yaml-kw" });
        const yamlNumMark = Decoration.mark({ class: "cm-yaml-num" });
        const yamlDecorator = new MatchDecorator({
          regexp: /(?<=:[^\S\n]+|^[^\S\n]*-[^\S\n]+)(?:true|false|null|True|False|Null|TRUE|FALSE|NULL|~|[-+]?\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?)(?=[^\S\n]*(?:#.*)?$)/gm,
          decoration: (match) => (/^[-+.\d]/.test(match[0]) ? yamlNumMark : yamlKwMark)
        });

        const yamlHighlighting = ViewPlugin.fromClass(
          class {
            constructor(view) { this.decorations = yamlDecorator.createDeco(view); }
            update(update) { this.decorations = yamlDecorator.updateDeco(update, this.decorations); }
          },
          { decorations: (v) => v.decorations }
        );

      // Link highlight: a single transient decoration over the source span of
      // the output run currently hovered. It is a decoration (not a selection),
      // so the caret never moves — hovering only highlights; clicking moves the
      // caret. Lives on the template editor only (the data editor hosts no
      // provenance). `setLinkHighlight.of({from,to})` sets it; `.of(null)` clears.
      const linkMark = Decoration.mark({ class: "cm-link-highlight" });
      const setLinkHighlight = StateEffect.define();
      const linkHighlightField = StateField.define({
        create() { return Decoration.none; },
        update(deco, tr) {
          deco = deco.map(tr.changes);
          for (const e of tr.effects) {
            if (e.is(setLinkHighlight)) {
              deco = e.value
                ? Decoration.set([linkMark.range(e.value.from, e.value.to)])
                : Decoration.none;
            }
          }
          return deco;
        },
        provide: (f) => EditorView.decorations.from(f),
      });

      // Make CM fill its container (height driven by flex parent)
      const fillTheme = EditorView.theme({
        "&": { height: "100%" },
        ".cm-scroller": { overflow: "auto" }
      });

      const sharedExts = [
        lineNumbers(), highlightActiveLineGutter(), highlightActiveLine(),
        bracketMatching(), syntaxHighlighting(defaultHighlightStyle),
        cmHistory(), keymap.of([...defaultKeymap, ...historyKeymap, indentWithTab]),
        fillTheme,
      ];

      const templateView = new EditorView({
        parent: byId("template-editor-container"),
        state: EditorState.create({
          doc: "",
          extensions: [
            ...sharedExts,
            html(),
            handlebarsHighlighting,
            linkHighlightField,
            lintGutter(),
            linter(() => templateDiagnostics),
            EditorView.updateListener.of((u) => {
              if (u.docChanged && !isProgrammatic(u)) {
                activeTab().source = u.state.doc.toString();
                scheduleRun();
              }
              if (u.selectionSet) { updateStatusMeta(); syncOutputToCaret(); }
            })
          ]
        })
      });

      const dataView = new EditorView({
        parent: byId("data-editor-container"),
        state: EditorState.create({
          doc: "",
          extensions: [
            ...sharedExts,
            yaml(),
            yamlHighlighting,
            EditorView.updateListener.of((u) => {
              if (u.docChanged && !isProgrammatic(u)) scheduleRun();
              if (u.selectionSet) updateStatusMeta();
            })
          ]
        })
      });

      // Marks editor doc swaps we make ourselves (tab switch, example load, hash
      // restore) so the update listeners can tell them apart from user typing and
      // skip the recompile those programmatic swaps don't warrant.
      const programmatic = Annotation.define();
      const isProgrammatic = (u) => u.transactions.some((tr) => tr.annotation(programmatic));

      function setEditorText(view, text) {
        const cur = view.state.doc.toString();
        if (cur !== text) {
          view.dispatch({
            changes: { from: 0, to: cur.length, insert: text },
            annotations: programmatic.of(true),
          });
        }
      }

      // Both editors are visible, so "active view" follows whichever has focus —
      // it drives the status bar, copy, and save actions.
      byId("template-editor-container").addEventListener("focusin", () => { activeView = "tmpl"; updateStatusMeta(); });
      byId("data-editor-container").addEventListener("focusin", () => { activeView = "data"; updateStatusMeta(); });

      // ── Tabs ──────────────────────────────────────────────────────────
      function renderTabs() {
        const bar = byId("tmpl-tabs");
        bar.innerHTML = "";

        tabs.forEach((tab, i) => {
          const isActive = activeView === "tmpl" && i === activeTabIdx;
          const t = document.createElement("div");
          t.className = "tab" + (isActive ? " active" : "") + (i === 0 ? " is-main" : "");
          t.title = i === 0 ? "entry template" : `partial · {{> ${tab.name}}}`;
          t.addEventListener("click", () => selectTemplateTab(i));

          if (i !== 0 && isActive) {
            // Active partial: rename it inline, right on the tab.
            const input = document.createElement("input");
            input.className = "tab-edit";
            input.value = tab.name;
            input.spellcheck = false;
            input.size = Math.max(tab.name.length, 4);
            input.setAttribute("aria-label", "partial name");
            input.title = `referenced as {{> ${tab.name}}}`;
            input.addEventListener("click", (e) => e.stopPropagation());
            input.addEventListener("input", () => {
              tab.name = input.value;
              input.size = Math.max(input.value.length, 4);
              input.title = `referenced as {{> ${input.value}}}`;
              byId("sources-sub").textContent = `partial · referenced as {{> ${input.value}}}`;
              scheduleRun();
            });
            t.append(input);
          } else {
            t.append(document.createTextNode(i === 0 ? "main" : (tab.name || "(unnamed)")));
          }

          if (i !== 0) {
            const x = document.createElement("span");
            x.className = "close"; x.title = "remove partial"; x.textContent = "×";
            x.addEventListener("click", (e) => { e.stopPropagation(); removeTab(i); });
            t.append(x);
          }
          bar.append(t);
        });

        const add = document.createElement("button");
        add.className = "tab-add"; add.title = "add partial"; add.textContent = "＋ partial";
        add.addEventListener("click", addPartial);
        bar.append(add);
      }

      function selectTemplateTab(i) {
        activeView = "tmpl"; activeTabIdx = i; showActiveTab();
      }
      function selectDataTab() {
        // The data editor is always visible now; just move focus to it.
        activeView = "data"; dataView.focus(); updateStatusMeta();
      }
      function addPartial() {
        let n = 1, name;
        do { name = "partial" + n++; } while (tabs.some((t) => t.name === name));
        tabs.push({ name, source: "" });
        activeView = "tmpl"; activeTabIdx = tabs.length - 1;
        showActiveTab(); run(); // the partial set changed, so re-render
      }
      function removeTab(i) {
        if (i === 0) return;
        if (!confirm(`Remove the "${tabs[i].name}" partial? This can't be undone.`)) return;
        if (activeTabIdx === i) activeTabIdx = i - 1;
        else if (activeTabIdx > i) activeTabIdx -= 1;
        tabs.splice(i, 1);
        showActiveTab(); run(); // the partial set changed, so re-render
      }

      // Display the active tab in the template editor. Switching which source is
      // shown does not change the compiled program, so this never recompiles or
      // rebuilds the output — only callers that change the sources call run().
      function showActiveTab() {
        setEditorText(templateView, activeTab().source); // programmatic → no auto-run
        byId("sources-sub").textContent = activeTabIdx === 0
          ? "entry template · compiled in-browser"
          : `partial · referenced as {{> ${activeTab().name}}}`;

        renderTabs();
        updateStatusMeta();
        caretLinkKey = null; syncOutputToCaret();
      }

      // ── Compile + render ──────────────────────────────────────────────
      function applyEscape(program, mode) {
        if (!mode) return program;
        const rewrite = (instructions) =>
          instructions.map((inst) => {
            const next = { ...inst };
            if (next.t === "emit") next.escape = mode;
            for (const key of ["then", "else", "body"]) {
              if (Array.isArray(next[key])) next[key] = rewrite(next[key]);
            }
            return next;
          });
        return { ...program, instructions: rewrite(program.instructions) };
      }

      function previewDoc(body) {
        const csp = "default-src 'none'; img-src * data:; style-src 'unsafe-inline'; font-src *;";
        return (
          '<!doctype html><html><head><meta charset="utf-8">' +
          `<meta http-equiv="Content-Security-Policy" content="${csp}">` +
          "<style>html,body{margin:0}body{font:13px/1.5 system-ui,sans-serif;padding:14px;color:#18181b;background:#fff}</style>" +
          `</head><body>${body}</body></html>`
        );
      }

      function setOutput(str, segments = []) {
        byId("output-preview").srcdoc = previewDoc(str);
        renderSourceView(str, segments);
        qs(".output-body").dataset.empty = str ? "false" : "true";
      }

      // The file behind a segment ("main" is tab 0; partials are the rest).
      function tabIndexByFile(file) {
        return file === "main" ? 0 : tabs.findIndex((t, i) => i > 0 && t.name === file);
      }
      function fileSource(file) {
        const i = tabIndexByFile(file);
        return i >= 0 ? tabs[i].source : "";
      }

      // Build the Source view as a run of segment spans, each tracing a slice of
      // the output back to the template/partial (and, for expressions, the tag)
      // that produced it. Segment offsets are output BYTE offsets, so they are
      // converted to JS char offsets to slice the output string. Text nodes are
      // built via the DOM (never innerHTML) so output content cannot inject HTML.
      function renderSourceView(output, segments) {
        const pre = byId("output-source");
        pre.textContent = "";
        if (!segments.length) { pre.textContent = output; return; }

        let cursor = 0; // chars already appended
        for (const seg of segments) {
          const [from, to] = byteRangeToCharRange(output, seg.out, seg.out + seg.len);
          if (from > cursor) pre.appendChild(document.createTextNode(output.slice(cursor, from)));
          const span = document.createElement("span");
          span.className = "seg" + (seg.kind === "emit" ? " seg-expr" : "");
          span.dataset.file = seg.file;
          span.dataset.kind = seg.kind;
          if (typeof seg.start === "number") {
            span.dataset.start = String(seg.start);
            span.dataset.end = String(seg.end);
          }
          span.textContent = output.slice(from, to);
          pre.appendChild(span);
          cursor = to;
        }
        if (cursor < output.length) pre.appendChild(document.createTextNode(output.slice(cursor)));
      }

      function run() {
        // run() is synchronous, so once it returns the output and its segments
        // match the current sources again — clear the stale-offset guard.
        renderPending = false;
        const dataSource = dataView.state.doc.toString();
        const mainSource = tabs[0].source;
        // Compile with span provenance so the rendered output can be mapped back
        // to its source files/tags in the Source view.
        const compiled = renderer.compile(mainSource, partialsMap(), { map: true });

        if (compiled.error) {
          if (activeTabIdx === 0) {
            const [from, to] = byteRangeToCharRange(mainSource, compiled.error.start, compiled.error.end);
            updateDiagnostics([{ from, to, severity: "error", message: compiled.error.message }]);
            const pos = charToLineColumn(mainSource, from);
            setError(`compile error: ${compiled.error.message} (Ln ${pos.line}, Col ${pos.column})`);
          } else {
            clearDiagnostics();
            setError("compile error: " + compiled.error.message);
          }
          setOutput(""); saveHash(); return;
        }

        clearDiagnostics();

        let data;
        try {
          data = loadYaml(dataSource || "null");
          if (typeof data === "undefined") data = null;
        } catch (err) {
          setError("invalid YAML: " + err.message);
          setOutput(""); saveHash(); return;
        }

        try {
          const program = applyEscape(compiled.program, escapeMode);
          const { output, segments } = renderer.render(program, data, { map: true });
          setOutput(output, segments);
          setError("");
        } catch (err) {
          setError("render error: " + err.message);
          setOutput("");
        }
        saveHash();
        // Re-apply the caret→output highlight against the freshly rendered runs.
        caretLinkKey = null;
        syncOutputToCaret();
      }

      const debouncedRun = debounce(run, 100);

      // True between a source edit and the debounced render that follows it: in
      // that window the output segments still carry the pre-edit byte offsets, so
      // the hover link-highlight is suppressed to avoid pointing at stale source.
      let renderPending = false;
      function scheduleRun() { renderPending = true; debouncedRun(); }

      function updateDiagnostics(diags) {
        templateDiagnostics = diags;
        templateView.dispatch({ effects: setDiagnosticsEffect.of(diags) });
      }
      function clearDiagnostics() {
        if (!templateDiagnostics.length) return;
        templateDiagnostics = [];
        templateView.dispatch({ effects: setDiagnosticsEffect.of([]) });
      }

      // ── Status bar ────────────────────────────────────────────────────
      function setError(msg) {
        const bar = qs(".statusbar");
        const txt = byId("status-msg");
        if (msg) { bar.classList.add("has-error"); txt.textContent = msg; }
        else { bar.classList.remove("has-error"); txt.textContent = "no errors"; }
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      function updateStatusMeta() {
        const view = activeView === "data" ? dataView : templateView;
        const sel  = view.state.selection.main;
        const line = view.state.doc.lineAt(sel.head);
        const col  = sel.head - line.from + 1;
        const fileName = activeView === "data" ? "data.yaml" : activeTab().name;
        const lang = activeView === "data" ? "YAML" : "Handlebars";
        byId("status-meta").innerHTML =
          `<b>${escapeHtml(fileName)} · Ln ${line.number}, Col ${col}</b>` +
          `  ·  ${lang}  ·  UTF-8  ·  Escape: <b>${escapeMode || "as compiled"}</b>`;
      }

      // ── Output view ───────────────────────────────────────────────────
      function setOutputView(view) {
        outputView = view;
        const rendered = view !== "source";
        byId("output-preview").hidden = !rendered;
        byId("output-source").hidden = rendered;
        hideSegTip(); clearLink();
        for (const b of document.querySelectorAll(".segmented button"))
          b.classList.toggle("on", b.dataset.view === view);
        caretLinkKey = null; syncOutputToCaret();
      }

      // ── Source-map interactions (Source view) ─────────────────────────
      const segTip = byId("seg-tip");
      function hideSegTip() { segTip.hidden = true; }

      function appendHint() {
        const hint = document.createElement("div");
        hint.className = "seg-tip-hint";
        hint.textContent = "click to jump to source";
        segTip.append(hint);
      }

      function showSegTip(seg) {
        const file = seg.dataset.file;
        const isExpr = seg.dataset.kind === "emit";
        segTip.textContent = "";

        // "expression from <file> template" / "literal from <file> partial".
        const head = document.createElement("div");
        head.append(document.createTextNode((isExpr ? "expression" : "literal") + " from "));
        const fileEl = document.createElement("span");
        fileEl.className = "seg-tip-file";
        fileEl.textContent = file;
        head.append(fileEl, document.createTextNode(file === "main" ? " template" : " partial"));
        segTip.append(head);

        // For expressions, show the originating tag (literals just echo the
        // output, so a snippet would be redundant).
        if (isExpr && seg.dataset.start !== undefined) {
          const src = fileSource(file);
          const [s, e] = byteRangeToCharRange(src, Number(seg.dataset.start), Number(seg.dataset.end));
          const tag = src.slice(s, e).trim();
          if (tag) {
            const code = document.createElement("code");
            code.textContent = tag;
            segTip.append(code);
          }
        }

        appendHint();

        // Position above the segment, flipping below / clamping to the viewport.
        segTip.hidden = false;
        const r = seg.getBoundingClientRect();
        const t = segTip.getBoundingClientRect();
        let top = r.top - t.height - 6;
        if (top < 4) top = r.bottom + 6;
        let left = Math.min(r.left, window.innerWidth - t.width - 6);
        segTip.style.top = `${top}px`;
        segTip.style.left = `${Math.max(4, left)}px`;
      }

      // Mirror an output-run hover into the source. `linkState` (the run's
      // "file:start:end") dirty-checks the editor/tab mutation so a sweep across
      // many segments doesn't thrash; `linkedTabEl` tracks any tinted tab.
      let linkState = null;
      let linkedTabEl = null;

      function clearLink() {
        if (linkState === null && !linkedTabEl) return;
        linkState = null;
        if (linkedTabEl) { linkedTabEl.classList.remove("tab-linked"); linkedTabEl = null; }
        templateView.dispatch({ effects: setLinkHighlight.of(null) });
      }

      // If the run's source file is the one shown in the template editor,
      // highlight its span there (no caret move); otherwise tint that file's tab.
      // Suppressed mid-edit (renderPending), when the segment offsets are stale.
      function linkHover(seg) {
        if (renderPending || seg.dataset.start === undefined) return;
        const file = seg.dataset.file;
        const start = Number(seg.dataset.start), end = Number(seg.dataset.end);
        const idx = tabIndexByFile(file);
        const active = idx === activeTabIdx;

        // Refine the tooltip hint every hover (the tooltip is rebuilt each time).
        const hint = segTip.querySelector(".seg-tip-hint");
        if (hint) {
          hint.textContent = active ? "click to place the cursor"
            : idx >= 0 ? `click to open the ${file} tab`
            : "click to jump to source";
        }

        const key = `${file}:${start}:${end}`;
        if (key === linkState) return; // highlight already applied — skip the work
        linkState = key;
        if (linkedTabEl) { linkedTabEl.classList.remove("tab-linked"); linkedTabEl = null; }

        if (active) {
          const [from, to] = byteRangeToCharRange(tabs[idx].source, start, end);
          templateView.dispatch({ effects: setLinkHighlight.of({ from, to }) });
        } else {
          templateView.dispatch({ effects: setLinkHighlight.of(null) });
          const tabEl = idx >= 0 ? byId("tmpl-tabs").children[idx] : null;
          if (tabEl) { tabEl.classList.add("tab-linked"); linkedTabEl = tabEl; }
        }
      }

      // Reverse direction: the template caret highlights the output run(s) it
      // produced. The output spans already carry their source file + byte span
      // (data-*), so a caret byte offset matches a run when the file agrees and
      // start <= byte < end.
      let caretLinkKey = null; // dirty-check: `${file}:${byteOffset}`

      function clearOutputLink() {
        for (const el of byId("output-source").querySelectorAll(".seg.seg-linked"))
          el.classList.remove("seg-linked");
      }

      function syncOutputToCaret() {
        // Suppressed mid-render (offsets stale) and when the text view is hidden.
        if (renderPending || outputView !== "source") { clearOutputLink(); caretLinkKey = null; return; }
        const file = activeTabIdx === 0 ? "main" : activeTab().name;
        const byte = charToByte(templateView.state.doc.toString(), templateView.state.selection.main.head);
        const key = `${file}:${byte}`;
        if (key === caretLinkKey) return;
        caretLinkKey = key;
        clearOutputLink();
        for (const el of byId("output-source").querySelectorAll(".seg")) {
          if (el.dataset.file === file && el.dataset.start !== undefined &&
              Number(el.dataset.start) <= byte && byte < Number(el.dataset.end)) {
            el.classList.add("seg-linked");
          }
        }
      }

      // Jump from a rendered run to the file/tag that produced it: open the file's
      // tab and, for an expression, select its source span in the editor.
      function openSourceLocation(file, start, end) {
        const idx = tabIndexByFile(file);
        if (idx < 0) return;
        clearLink();
        selectTemplateTab(idx);
        templateView.focus();
        if (start !== null) {
          const [from, to] = byteRangeToCharRange(tabs[idx].source, start, end);
          templateView.dispatch({ selection: { anchor: from, head: to }, scrollIntoView: true });
        }
        hideSegTip();
      }

      (() => {
        const pre = byId("output-source");
        // Debounce hover so sweeping the pointer across many runs only shows the
        // tooltip + link-highlight for the run the pointer settles on. The timer
        // is cancelled the moment the pointer leaves a run, so leaving never
        // shows a stale tooltip.
        let hoverTimer = null;
        const cancelHover = () => { if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; } };
        pre.addEventListener("mouseover", (e) => {
          const seg = e.target.closest?.(".seg");
          if (!seg) return;
          cancelHover();
          hoverTimer = setTimeout(() => { hoverTimer = null; showSegTip(seg); linkHover(seg); }, 55);
        });
        pre.addEventListener("mouseout", (e) => {
          if (e.target.closest?.(".seg")) { cancelHover(); hideSegTip(); clearLink(); }
        });
        pre.addEventListener("scroll", () => { cancelHover(); hideSegTip(); clearLink(); });
        pre.addEventListener("click", (e) => {
          const seg = e.target.closest?.(".seg");
          if (!seg) return;
          const start = seg.dataset.start !== undefined ? Number(seg.dataset.start) : null;
          const end = seg.dataset.end !== undefined ? Number(seg.dataset.end) : null;
          openSourceLocation(seg.dataset.file, start, end);
        });
      })();

      // ── Splitter ──────────────────────────────────────────────────────
      let splits = { w0: null, h0: null, ew: null, eh: null };
      try { const r = localStorage.getItem(LS_SPLIT); if (r) splits = { ...splits, ...JSON.parse(r) }; } catch {}

      function saveSplits() { try { localStorage.setItem(LS_SPLIT, JSON.stringify(splits)); } catch {} }

      function isStacked() { return qs(".workspace")?.classList.contains("stacked"); }

      // Generic two-child flex splitter. axisRow() reports whether the container
      // currently lays its children in a row (resize width) or column (resize
      // height) — so one helper drives both the workspace and the editors, whose
      // orientations are perpendicular and flip with the layout.
      function makeSplitter({ el, container, first, second, axisRow, keyRow, keyCol, min, ratio }) {
        function size() {
          if (!container) return;
          const row = axisRow();
          const total = row ? container.clientWidth : container.clientHeight;
          if (total <= 0) return;
          const usable = total - 6;
          const key = row ? keyRow : keyCol;
          let s = splits[key] ?? Math.round(usable * ratio);
          s = Math.max(min, Math.min(usable - min, s));
          splits[key] = s;
          first.style.flex = `0 0 ${s}px`;
          second.style.flex = "1 1 0";
        }
        el.addEventListener("mousedown", (e) => {
          e.preventDefault();
          el.classList.add("dragging");
          const row = axisRow();
          document.body.classList.add(row ? "dragging-col" : "dragging-row");
          const rect = container.getBoundingClientRect();
          const key = row ? keyRow : keyCol;
          const usable = (row ? rect.width : rect.height) - 6;
          const startS = splits[key] ?? Math.round(usable * ratio);
          const startPos = row ? e.clientX : e.clientY;
          const onMove = (ev) => {
            const cur = row ? ev.clientX : ev.clientY;
            splits[key] = Math.max(min, Math.min(usable - min, startS + (cur - startPos)));
            size();
          };
          const onUp = () => {
            el.classList.remove("dragging");
            document.body.classList.remove("dragging-col", "dragging-row");
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            saveSplits();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });
        el.addEventListener("dblclick", () => {
          splits[keyRow] = null; splits[keyCol] = null; size(); saveSplits();
        });
        return size;
      }

      let sizeWorkspace = () => {};
      let sizeEditors = () => {};
      function applySplits() { sizeWorkspace(); sizeEditors(); }

      // ── Focus mode ────────────────────────────────────────────────────
      function setFocus(mode) {
        focusMode = mode;
        const ws = qs(".workspace");
        ws.classList.remove("focus-sources", "focus-output");
        for (const b of document.querySelectorAll(".focus-toggle")) b.classList.remove("on");
        if (mode) {
          ws.classList.add("focus-" + mode);
          const btn = document.querySelector(`.focus-toggle[data-pane="${mode}"]`);
          if (btn) btn.classList.add("on");
        }
      }
      function toggleFocus(mode) { setFocus(focusMode === mode ? null : mode); }

      // ── Examples ──────────────────────────────────────────────────────
      function buildExampleSelect() {
        const sel = byId("example-select");
        const custom = document.createElement("option");
        custom.value = "-1"; custom.textContent = "(custom)";
        sel.append(custom);
        examples.forEach((ex, i) => {
          const opt = document.createElement("option");
          opt.value = String(i); opt.textContent = ex.label;
          sel.append(opt);
        });
      }

      async function loadExample(idx) {
        const ex = examples[idx];
        if (!ex) return;
        const dir = `./examples/${ex.id}/`;
        const [mainSrc, dataText, ...partialSrcs] = await Promise.all([
          fetch(dir + ex.main).then((r) => r.text()),
          fetch(dir + ex.data).then((r) => r.text()),
          ...ex.partials.map((name) => fetch(`${dir}${name}.stem`).then((r) => r.text())),
        ]);
        tabs = [{ name: "main", source: mainSrc }];
        ex.partials.forEach((name, i) => tabs.push({ name, source: partialSrcs[i] }));
        activeTabIdx = 0; activeView = "tmpl";
        // Examples ship their data as YAML, so load it into the editor verbatim.
        setEditorText(dataView, dataText);
        escapeMode = "";
        byId("escape-select").value = "";
        byId("example-select").value = String(idx);
        setOutputView(ex.view === "source" ? "source" : "rendered");
        showActiveTab(); run();
      }

      // ── URL state ─────────────────────────────────────────────────────
      function snapshotState() {
        return {
          tabs: tabs.map((t) => ({ n: t.name, s: t.source })),
          d: dataView.state.doc.toString(),
          e: escapeMode, v: outputView,
          av: activeView, ai: activeTabIdx,
        };
      }

      function saveHash() {
        try { history.replaceState(null, "", "#" + encodeState(snapshotState())); } catch {}
      }

      function restoreHash() {
        if (!location.hash.length) return false;
        try {
          const s = decodeState(location.hash.slice(1));
          tabs = Array.isArray(s.tabs) && s.tabs.length
            ? s.tabs.map((t, i) => ({ name: i === 0 ? "main" : (t.n ?? "partial"), source: t.s ?? "" }))
            : [{ name: "main", source: "" }];
          activeTabIdx = Math.max(0, Math.min(tabs.length - 1, s.ai ?? 0));
          activeView = s.av === "data" ? "data" : "tmpl";
          setEditorText(dataView, s.d ?? "");
          escapeMode = s.e ?? "";
          byId("escape-select").value = escapeMode;
          byId("example-select").value = "-1";
          setOutputView(s.v === "source" ? "source" : "rendered");
          showActiveTab(); run();
          return true;
        } catch { return false; }
      }

      // ── Command palette ───────────────────────────────────────────────
      function buildCommands() {
        return [
          ...examples.map((ex, i) => ({
            label: `Load example · ${ex.label}`, kind: "example",
            run: () => loadExample(i),
          })),
          { label: "Open data.yaml",     kind: "sources", run: selectDataTab },
          { label: "Open main template", kind: "sources", run: () => selectTemplateTab(0) },
          { label: "Add partial",        kind: "sources", run: addPartial },
          { label: "Toggle focus · Sources", kind: "view", run: () => toggleFocus("sources") },
          { label: "Toggle focus · Output",  kind: "view", run: () => toggleFocus("output") },
          { label: "View · Preview",  kind: "view", run: () => { setOutputView("rendered"); run(); } },
          { label: "View · Rendered", kind: "view", run: () => { setOutputView("source"); run(); } },
          { label: "Reset layout", kind: "view",
            run: () => { splits = { w0: null, h0: null, ew: null, eh: null }; applySplits(); saveSplits(); setFocus(null); } },
          { label: "Copy share link", kind: "share", run: copyShareLink },
          ...["", "html", "xml", "json", "none"].map((m) => ({
            label: `Escape · ${m || "(as compiled)"}`, kind: "render",
            run: () => { escapeMode = m; byId("escape-select").value = m; run(); updateStatusMeta(); },
          })),
        ];
      }

      let paletteOpen = false;
      function openPalette() {
        if (paletteOpen) return;
        paletteOpen = true;
        const all = buildCommands();
        let filtered = all, sel = 0;

        const back = document.createElement("div");
        back.className = "palette-backdrop";
        const box = document.createElement("div");
        box.className = "palette";
        const input = document.createElement("input");
        input.type = "text"; input.placeholder = "Type a command…"; input.spellcheck = false;
        const list = document.createElement("ul");

        function renderList() {
          list.innerHTML = "";
          filtered.forEach((cmd, i) => {
            const li = document.createElement("li");
            li.className = i === sel ? "sel" : "";
            li.addEventListener("click", () => { cmd.run(); close(); });
            li.addEventListener("mouseenter", () => { sel = i; renderList(); });
            const kind = document.createElement("span");
            kind.className = "pkind"; kind.textContent = cmd.kind;
            li.append(kind, cmd.label);
            list.append(li);
          });
        }
        function close() { paletteOpen = false; back.remove(); }

        input.addEventListener("input", () => {
          const q = input.value.toLowerCase().trim();
          filtered = q ? all.filter((c) => c.label.toLowerCase().includes(q)) : all;
          sel = 0; renderList();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown") { sel = Math.min(filtered.length - 1, sel + 1); renderList(); e.preventDefault(); }
          else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); renderList(); e.preventDefault(); }
          else if (e.key === "Enter") { if (filtered[sel]) { filtered[sel].run(); close(); } }
          else if (e.key === "Escape") close();
        });
        back.addEventListener("mousedown", (e) => { if (e.target === back) close(); });
        box.append(input, list);
        back.append(box);
        document.body.append(back);
        renderList();
        setTimeout(() => input.focus(), 0);
      }

      // ── Toast ─────────────────────────────────────────────────────────
      function toast(msg) {
        let t = qs(".toast");
        if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.append(t); }
        t.textContent = msg;
        requestAnimationFrame(() => t.classList.add("show"));
        clearTimeout(t._hide);
        t._hide = setTimeout(() => t.classList.remove("show"), 1400);
      }

      async function copyShareLink() {
        saveHash();
        try { await navigator.clipboard?.writeText(location.href); toast("Link copied to clipboard"); }
        catch { toast("Couldn't copy (permission?)"); }
      }

      // ── Tweaks panel ──────────────────────────────────────────────────
      const TWEAK_OPTS = {
        theme: [
          { value: "light",  label: "Light",  swatch: ["#ffffff","#f2effc","#7c4dff"] },
          { value: "dark",   label: "Dark",   swatch: ["#1e1338","#2f1d52","#b59bff"] },
          { value: "system", label: "System", swatch: ["#ffffff","#9e8dc4","#1e1338"] },
        ],
        layout: [
          { value: "split",   label: "Split",   hint: "Sources ← → Output" },
          { value: "stacked", label: "Stacked", hint: "Sources ↑ Output ↓" },
        ],
      };

      let tweaks = { theme: "system", layout: "split" };
      try { const r = localStorage.getItem(LS_TWEAKS); if (r) tweaks = { ...tweaks, ...JSON.parse(r) }; } catch {}
      // Migrate older saved state: the former "dim" theme is now "dark", moods are gone.
      if (tweaks.theme === "dim") tweaks.theme = "dark";
      if (!["light", "dark", "system"].includes(tweaks.theme)) tweaks.theme = "system";
      delete tweaks.mood;

      function applyTweaks() {
        document.body.dataset.theme = tweaks.theme;
        qs(".workspace")?.classList.toggle("stacked", tweaks.layout === "stacked");
        window.dispatchEvent(new Event("resize"));
      }
      function saveTweaks() { try { localStorage.setItem(LS_TWEAKS, JSON.stringify(tweaks)); } catch {} }

      function mkEl(tag, attrs = {}, children = []) {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") n.className = v;
          else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
          else if (v != null && v !== false) n.setAttribute(k, v);
        }
        for (const c of [].concat(children)) {
          if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
        }
        return n;
      }

      function twSection(title, hint, children) {
        return mkEl("div", { class: "tw-section" }, [
          mkEl("div", { class: "tw-section-head" }, [
            mkEl("span", { class: "tw-section-title" }, title),
            hint ? mkEl("span", { class: "tw-section-hint" }, hint) : null,
          ]),
          mkEl("div", { class: "tw-section-body" }, [].concat(children)),
        ]);
      }

      let tweaksPanel = null;

      function buildTweaksPanel() {
        const panel = mkEl("div", { class: "tw-panel", role: "dialog", "aria-label": "Tweaks" });

        const header = mkEl("div", { class: "tw-header" }, [
          mkEl("div", { class: "tw-title" }, [mkEl("span", { class: "tw-pill" }), "Tweaks"]),
          mkEl("button", { class: "tw-close", title: "Close", onclick: hideTweaks }, "×"),
        ]);
        panel.append(header);

        panel.append(twSection("Theme", null,
          TWEAK_OPTS.theme.map((o) =>
            mkEl("button", {
              class: "tw-swatch" + (tweaks.theme === o.value ? " on" : ""),
              title: o.label, onclick: () => setTweak("theme", o.value),
            }, [
              mkEl("span", { class: "tw-swatch-grid", style: `--c1:${o.swatch[0]};--c2:${o.swatch[1]};--c3:${o.swatch[2]};` }),
              mkEl("span", { class: "tw-swatch-label" }, o.label),
            ])
          )
        ));

        panel.append(twSection("Layout", null, [
          mkEl("div", { class: "tw-segmented" },
            TWEAK_OPTS.layout.map((o) =>
              mkEl("button", {
                class: tweaks.layout === o.value ? "on" : "",
                title: o.hint, onclick: () => setTweak("layout", o.value),
              }, o.label)
            )
          )
        ]));

        panel.append(mkEl("div", { class: "tw-foot" }, "Edits persist across reloads."));

        // Draggable by header
        header.addEventListener("mousedown", (e) => {
          if (e.target.classList.contains("tw-close")) return;
          const rect = panel.getBoundingClientRect();
          const dx = e.clientX - rect.left, dy = e.clientY - rect.top;
          const onMove = (ev) => {
            panel.style.left   = Math.max(8, Math.min(window.innerWidth  - rect.width  - 8, ev.clientX - dx)) + "px";
            panel.style.top    = Math.max(8, Math.min(window.innerHeight - rect.height - 8, ev.clientY - dy)) + "px";
            panel.style.right  = "auto";
            panel.style.bottom = "auto";
          };
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });

        return panel;
      }

      function setTweak(key, value) {
        tweaks[key] = value;
        applyTweaks(); saveTweaks();
        // Rebuild panel to reflect new selection
        if (tweaksPanel) {
          tweaksPanel.remove();
          tweaksPanel = buildTweaksPanel();
          document.body.append(tweaksPanel);
        }
      }

      function showTweaks() {
        if (tweaksPanel) { hideTweaks(); return; }
        tweaksPanel = buildTweaksPanel();
        document.body.append(tweaksPanel);
      }
      function hideTweaks() {
        if (tweaksPanel) { tweaksPanel.remove(); tweaksPanel = null; }
      }

      // ── Wire events ───────────────────────────────────────────────────
      byId("share-btn").addEventListener("click", copyShareLink);
      byId("cmd-btn").addEventListener("click", openPalette);
      byId("tweaks-btn").addEventListener("click", showTweaks);

      byId("example-select").addEventListener("change", (e) => {
        const v = Number(e.target.value);
        if (v >= 0) loadExample(v);
      });

      byId("escape-select").addEventListener("change", (e) => {
        escapeMode = e.target.value; run(); updateStatusMeta();
      });

      for (const b of document.querySelectorAll(".segmented button")) {
        b.addEventListener("click", () => { setOutputView(b.dataset.view); run(); });
      }

      for (const b of document.querySelectorAll(".focus-toggle")) {
        b.addEventListener("click", () => toggleFocus(b.dataset.pane));
      }

      window.addEventListener("keydown", (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.shiftKey && e.key.toLowerCase() === "p") {
          e.preventDefault(); openPalette();
        } else if (e.key === "Escape" && focusMode) {
          setFocus(null);
        }
      });

      window.addEventListener("resize", applySplits);

      // ── Boot ──────────────────────────────────────────────────────────
      buildExampleSelect();
      sizeWorkspace = makeSplitter({
        el: byId("splitter-1"), container: qs(".workspace"),
        first: document.querySelectorAll(".pane")[0], second: document.querySelectorAll(".pane")[1],
        axisRow: () => !isStacked(), keyRow: "w0", keyCol: "h0", min: 240, ratio: 0.55,
      });
      sizeEditors = makeSplitter({
        el: byId("editor-splitter"), container: qs(".editors"),
        first: byId("template-editor-container"), second: qs(".editor-cell"),
        axisRow: () => isStacked(), keyRow: "ew", keyCol: "eh", min: 120, ratio: 0.5,
      });
      applyTweaks();
      setOutputView(outputView);

      if (!restoreHash()) await loadExample(3); // default: HTML cards
      applySplits();
      updateStatusMeta();
      showTweaks(); // open the Tweaks panel on first load
    </script>
  </body>
</html>

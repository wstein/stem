          for (let i = 0; i < c.length - 1; i++) cyclePairs.add(c[i] + "→" + c[i + 1]);
        }

        const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "dep-svg", preserveAspectRatio: "xMidYMid meet" });
        const defs = svgEl("defs");
        const marker = svgEl("marker", { id: "dep-arrow", viewBox: "0 0 10 10", refX: "9", refY: "5", markerUnits: "userSpaceOnUse", markerWidth: "8", markerHeight: "8", orient: "auto" });
        marker.append(svgEl("path", { d: "M0,0 L10,5 L0,10 z", fill: "currentColor" }));
        defs.append(marker);
        svg.append(defs);

        for (const e of deps.edges) {
          const a = pos.get(e.from), b = pos.get(e.to);
          if (!a || !b) continue;
          const cls = "dep-edge" + (cyclePairs.has(e.from + "→" + e.to) ? " cycle" : "") + (e.missing ? " missing" : "");
          // Shorten both ends to the node box edges so the arrowhead is visible.
          const ang = Math.atan2(b.y - a.y, b.x - a.x);
          const x1 = a.x + Math.cos(ang) * 34, y1 = a.y + Math.sin(ang) * 20;
          const x2 = b.x - Math.cos(ang) * 34, y2 = b.y - Math.sin(ang) * 20;
          const path = svgEl("path", { class: cls, d: `M${x1},${y1} L${x2},${y2}` });
          const tip = e.missing
            ? `unknown partial: ${e.to}`
            : cyclePairs.has(e.from + "→" + e.to)
              ? `partial recursion detected for '${e.to}'`
              : null;
          if (tip) {
            const title = svgEl("title");
            title.textContent = tip;
            path.append(title);
          }
          svg.append(path);
        }

        for (const n of deps.nodes) {
          const p = pos.get(n.id);
          if (!p) continue;
          const inCycle = deps.cycles.some((c) => c.includes(n.id));
          const g = svgEl("g", { class: "dep-node" + (n.isMain ? " main" : "") + (inCycle ? " cycle" : "") + (n.missing ? " missing" : ""), transform: `translate(${p.x - boxW / 2},${p.y - boxH / 2})` });
          const rect = svgEl("rect", { width: boxW, height: boxH, rx: "6" });
          g.append(rect);
          const text = svgEl("text", { x: boxW / 2, y: boxH / 2 + 4, "text-anchor": "middle" });
          text.textContent = n.id;
          g.append(text);
          g.style.cursor = "pointer";
          g.addEventListener("click", () => {
            const idx = tabs.findIndex((t) => t.name === n.id);
            if (idx >= 0) selectTemplateTab(idx);
          });
          svg.append(g);
        }

        const wrap = makeEl("div", { class: "dep-pane" });
        const svgWrap = makeEl("div", { class: "dep-svg-wrap" });
        svgWrap.append(svg);
        wrap.append(svgWrap);

        const side = makeEl("div", { class: "dep-side" });
        side.append(makeEl("h4", {}, "Edges"));
        const edges = makeEl("ul");
        if (!deps.edges.length) edges.append(makeEl("li", {}, "no partial references"));
        for (const e of deps.edges.slice(0, 30)) {
          const cyc = cyclePairs.has(e.from + "→" + e.to);
          const li = makeEl("li", { class: (cyc ? "cycle" : "") + (e.missing ? "" : " linked") }, [
            e.from, makeEl("span", { class: "arrow" }, " → "),
            e.to + (e.missing ? "  ⚠" : "") + (cyc ? "  ↺ cycle" : ""),
          ]);
          // Click a (defined) edge to jump to the target partial's tab.
          if (!e.missing) {
            li.title = `open ${e.to}`;
            li.addEventListener("click", () => {
              const idx = tabs.findIndex((t) => t.name === e.to);
              if (idx >= 0) selectTemplateTab(idx);
            });
          }
          edges.append(li);
        }
        side.append(edges);
        if (deps.cycles.length) {
          side.append(makeEl("h4", {}, "Cycles"));
          const cl = makeEl("ul");
          for (const c of deps.cycles) cl.append(makeEl("li", { class: "cycle" }, c.join(" → ")));
          side.append(cl);
        }
        wrap.append(side);
        body.append(wrap);
      }

      function setDockVisible(visible) {
        byId("dock").hidden = !visible;
        const toggle = byId("dock-toggle");
        toggle.classList.toggle("active", visible);
        toggle.setAttribute("aria-pressed", String(visible));
        if (visible) renderDock();
      }

      function selectDockTab(tab) {
        dockTab = tab;
        for (const el of document.querySelectorAll(".dock-tab")) {
          el.classList.toggle("active", el.dataset.dock === tab);
        }
        if (byId("dock").classList.contains("collapsed")) byId("dock").classList.remove("collapsed");
        renderDock();
      }

      byId("dock-toggle").addEventListener("click", () => setDockVisible(byId("dock").hidden));
      // Close (hide) the diagnostics dock, like the panel close buttons.
      byId("dock-collapse").addEventListener("click", () => setDockVisible(false));
      for (const tab of document.querySelectorAll(".dock-tab")) {
        tab.addEventListener("click", () => selectDockTab(tab.dataset.dock));
      }
      // Drag the grip to resize the dock height. Pointer capture keeps move/up
      // events flowing to the grip even when the pointer crosses the output
      // iframe (which would otherwise swallow them); the body class belts it.
      byId("dock-grip").addEventListener("pointerdown", (e) => {
        const dock = byId("dock");
        const grip = byId("dock-grip");
        if (dock.classList.contains("collapsed")) return;
        e.preventDefault();
        grip.classList.add("dragging");
        document.body.classList.add("dragging-dock");
        grip.setPointerCapture(e.pointerId);
        const startY = e.clientY;
        const startH = dock.offsetHeight;
        const onMove = (ev) => {
          dock.style.height = Math.max(80, Math.min(560, startH + (startY - ev.clientY))) + "px";
        };
        const onUp = () => {
          grip.classList.remove("dragging");
          document.body.classList.remove("dragging-dock");
          grip.removeEventListener("pointermove", onMove);
          grip.removeEventListener("pointerup", onUp);
          renderDock();
        };
        grip.addEventListener("pointermove", onMove);
        grip.addEventListener("pointerup", onUp);
      });

      byId("caps-select").addEventListener("change", () => {
        groups = [...document.querySelectorAll("#caps-select .cap")]
          .filter((box) => box.checked)
          .map((box) => box.value);
        run();
      });

      byId("allow-scripts").addEventListener("change", (e) => {
        allowScripts = e.target.checked;
        renderPreview();
      });

      // Fill the searchable highlight picker: Plain text, then every language in
      // the CodeMirror registry (alphabetical) as <datalist> options. Empty input
      // means "use the example's required language" (shown grayed as placeholder).
      {
        const dl = byId("out-lang-list");
        const names = ["Plain text",
          ...cmLanguages.map((l) => l.name).sort((a, b) => a.localeCompare(b))];
        for (const name of names) {
          const opt = document.createElement("option");
          opt.value = name;
          dl.append(opt);
        }
        const input = byId("out-lang-input");
        input.value = "";
        updateLangPlaceholder();
        // Commit on change/Enter: snap to a known language; empty reverts to example default.
        input.addEventListener("change", () => {
          const norm = normalizeLangChoice(input.value);
          if (norm === "Auto") { outLangChoice = "Auto"; input.value = ""; updateOutLang(); persistOutLang(); }
          else if (norm) { outLangChoice = norm; input.value = norm; updateOutLang(); persistOutLang(); }
          else { input.value = outLangChoice === "Auto" ? "" : outLangChoice; }
        });
      }

      for (const b of document.querySelectorAll(".focus-toggle")) {
        b.addEventListener("click", () => toggleFocus(b.dataset.pane));
      }

      window.addEventListener("keydown", (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.shiftKey && e.key.toLowerCase() === "p") {
          e.preventDefault(); openPalette();
        } else if (mod && e.shiftKey && e.key.toLowerCase() === "f") {
          e.preventDefault(); showSearch();
        } else if (e.key === "Escape" && focusMode) {
          setFocus(null);
        }
      });

      window.addEventListener("resize", applySplits);

      // ── Boot ──────────────────────────────────────────────────────────
      buildExampleSelect();
      sizeWorkspace = makeSplitter({
        el: byId("splitter-1"), container: qs(".workspace"),
        first: document.querySelectorAll(".pane")[0], second: document.querySelectorAll(".pane")[1],
        axisRow: () => !isStacked(), keyRow: "w0", keyCol: "h0", min: 240, ratio: 0.55,
      });
      sizeEditors = makeSplitter({
        el: byId("editor-splitter"), container: qs(".editors"),
        first: byId("template-editor-container"), second: qs(".editor-cell"),
        axisRow: () => isStacked(), keyRow: "ew", keyCol: "eh", min: 120, ratio: 0.5,
      });
      applyTweaks();
      setOutputView(outputView);
      renderDataTabs(); // paint the data-pane tabs before the async example load

      // The highlighter is a sticky preference. Capture it before the startup
      // load (which loads an example and resets the choice to "Auto"), then
      // re-apply it afterwards so a reload restores the user's last pick.
      const savedOutLang = (() => { try { return localStorage.getItem(LS_OUTLANG); } catch { return null; } })();

      // Default load is keyed by id, not array position, so reordering the
      // examples.json catalog (e.g. simple -> advanced) never breaks it.
      if (!(await restoreHash())) {
        const def = examples.findIndex((e) => e.id === "greeting");
        await loadExample(def < 0 ? 0 : def);
      }
      if (savedOutLang && savedOutLang !== "Auto") {
        outLangChoice = savedOutLang;
        byId("out-lang-input").value = savedOutLang;
        updateLangPlaceholder();
        updateOutLang();
      }
      persistOutLang();
      applySplits();
      updateStatusMeta();
      restorePanels(); // restore persisted floating panels (Appearance / Dependencies)
    </script>
  </body>
</html>

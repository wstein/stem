# Raw statistics only — the Model. No colors, no coordinates: the transform
# (Controller) turns these numbers into drawable geometry for the SVG template.
title: Stem by the numbers
subtitle: One engine, two backends, byte-for-byte the same output.

# Donut — render time per phase (microseconds). The transform derives each
# phase's share of the total; the data stays raw measurements.
phases:
  - { label: Parse, value: 210 }
  - { label: Compile, value: 395 }
  - { label: Render, value: 560 }

# Bars — transformer stdlib, registered names per capability group. Counts come
# straight from lib/stem/transformers/<group>.ex (39 names across 5 groups).
groups:
  - { label: Strings, value: 13 }
  - { label: Collections, value: 13 }
  - { label: Minimum, value: 8 }
  - { label: Predicates, value: 3 }
  - { label: I18n, value: 2 }

# Waffle — line coverage (%)
coverage: 98

# Sparkline — commits per sprint
throughput: [12, 18, 16, 27, 31, 38]

# SPDX-License-Identifier: Apache-2.0
[package]
name = "stem_native"
version = "0.0.1"
edition = "2021"
description = "PoC native (Rust/WASM) renderer for Stem portable bytecode"

# Library: the rlib backs the WASI bin; the cdylib is the browser target
# (wasm32-unknown-unknown) exporting a small C ABI via stem_alloc/stem_render.
[lib]
name = "stem_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# Bin: the WASI stdin/stdout renderer used by mix stem.native.verify / fuzz.
[[bin]]
name = "stem_native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

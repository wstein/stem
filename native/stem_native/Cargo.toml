# SPDX-License-Identifier: Apache-2.0
[package]
name = "stem_native"
version = "0.0.1"
edition = "2021"
description = "PoC native (Rust/WASM) renderer for Stem portable bytecode"

# Library: the rlib backs the WASI bin and in-process Rust hosts; the cdylib is
# the browser target (wasm32-unknown-unknown), exporting compile/render via
# wasm-bindgen.
[lib]
name = "stem_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# Bin: the WASI stdin/stdout renderer used by mix stem.native.verify / fuzz.
[[bin]]
name = "stem_native"
path = "src/main.rs"

[dependencies]
# The Stem compiler, factored out so the compile-time macros can use it without
# the renderer (see native/stem_macros).
stem_compile = { path = "../stem_compile" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: parse floats with a correctly-rounded algorithm so a JSON
# float decodes to the same f64 the BEAM holds — required for byte-parity float
# rendering (the default fast parser can be a ULP off; see gap G2).
serde_json = { version = "1", features = ["float_roundtrip"] }
# Ryū shortest-float digits. The BEAM's `:short` formatting is also Ryū, so this
# matches its digit choice and round-half-to-even tie-breaking exactly (Rust's
# std `Display` uses a different algorithm that can break shortest-decimal ties
# the other way). We keep the digits and apply Erlang's notation policy.
ryu = "1"

# Browser interop: wasm-bindgen + serde-wasm-bindgen let JS pass and receive
# values (objects/arrays) directly instead of marshalling JSON strings through
# linear memory by hand. Scoped to wasm32-unknown-unknown (the browser target)
# so host builds and the wasm32-wasip1 conformance bin are unaffected.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

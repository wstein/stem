[package]
name = "stem_native"
version = "0.0.1"
edition = "2021"
description = "PoC native (Rust/WASM) renderer for Stem portable bytecode"

[[bin]]
name = "stem_native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

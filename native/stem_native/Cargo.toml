# SPDX-License-Identifier: Apache-2.0
[package]
name = "stem_native"
version = "0.0.1"
edition = "2021"
description = "PoC native (Rust/WASM) renderer for Stem portable bytecode"

# Library: the rlib backs the WASI bin; the cdylib is the browser target
# (wasm32-unknown-unknown) exporting a small C ABI via stem_alloc/stem_render.
[lib]
name = "stem_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# Bin: the WASI stdin/stdout renderer used by mix stem.native.verify / fuzz.
[[bin]]
name = "stem_native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: parse floats with a correctly-rounded algorithm so a JSON
# float decodes to the same f64 the BEAM holds — required for byte-parity float
# rendering (the default fast parser can be a ULP off; see gap G2).
serde_json = { version = "1", features = ["float_roundtrip"] }
# Ryū shortest-float digits. The BEAM's `:short` formatting is also Ryū, so this
# matches its digit choice and round-half-to-even tie-breaking exactly (Rust's
# std `Display` uses a different algorithm that can break shortest-decimal ties
# the other way). We keep the digits and apply Erlang's notation policy.
ryu = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

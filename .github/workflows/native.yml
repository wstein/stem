# SPDX-License-Identifier: Apache-2.0
#
# Keeps the native (Rust/WASM) engine honest as the conformance corpus grows:
# builds the wasm and asserts it renders identically to the BEAM reference.
name: native

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Set up Rust (wasm targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch deps
        run: mix deps.get

      - name: Rust crates — format, lint, and unit tests
        run: |
          for crate in stem_compile stem_native stem_macros stem_examples; do
            ( cd "native/$crate" \
              && cargo fmt --check \
              && cargo clippy --all-targets -- -D warnings \
              && cargo test )
          done

      - name: Build native engine (wasip1 + browser)
        working-directory: native/stem_native
        run: |
          cargo build --release --target wasm32-wasip1
          cargo build --release --target wasm32-unknown-unknown --lib

      - name: Compile parity — native bytecode matches the BEAM
        run: mix stem.native.compile_diff

      - name: Conformance — native matches the BEAM byte-for-byte
        run: mix stem.native.verify

      - name: Differential fuzz (fixed seed for reproducibility)
        run: mix stem.native.fuzz --count 1000 --seed 12345

      # wasm-bindgen CLI version must match the wasm-bindgen crate.
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Generate browser bindings (wasm-bindgen)
        run: native/web/build.sh

      - name: Browser glue renders correctly (no WASI)
        run: node native/web/validate.mjs

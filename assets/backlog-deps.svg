<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
      .box.lsp { fill:#f5f3ff; stroke:#7c4dff; stroke-width:2.2; }
      .lbl { fill:#1e293b; font-size:13px; font-weight:600; }
      .sub { fill:#64748b; font-size:11px; }
      .grp { fill:#64748b; font-size:11px; font-weight:700; letter-spacing:.05em; }
      .edge { stroke:#94a3b8; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .edge.opt { stroke-dasharray:5 4; }
      .elbl { fill:#64748b; font-size:10px; }
      .note { fill:#94a3b8; font-size:11px; font-style:italic; }
    </style>
  </defs>

  <!-- group labels -->
  <text x="24"  y="28"  class="grp">GRAMMARS &amp; PORTS (standalone tasks)</text>
  <text x="24"  y="162" class="grp">LANGUAGE SERVER</text>
  <text x="24"  y="292" class="grp">EDITOR INTEGRATIONS</text>
  <text x="24"  y="402" class="grp">PLAYGROUND (independent)</text>

  <!-- edges (under boxes). Arrow A -> B reads "A needs B". -->
  <!-- VS Code needs TextMate + LSP -->
  <path class="edge" d="M280,310 L120,88"/>
  <text x="150" y="200" class="elbl">needs</text>
  <path class="edge" d="M300,310 L400,224"/>
  <!-- JetBrains needs LSP ; optionally the JVM port (in-process) -->
  <path class="edge" d="M540,310 L450,224"/>
  <path class="edge opt" d="M560,310 L720,88"/>
  <text x="600" y="200" class="elbl">in-process</text>
  <!-- LSP can use Tree-sitter (semantic tokens) and a port as an alt core -->
  <path class="edge opt" d="M410,180 L260,88"/>
  <text x="300" y="140" class="elbl">semantic tokens</text>
  <path class="edge opt" d="M440,180 L560,88"/>
  <text x="470" y="140" class="elbl">alt core</text>
  <path class="edge opt" d="M455,182 L710,88"/>
  <text x="600" y="150" class="elbl">alt core</text>

  <!-- GRAMMARS & PORTS (y 44..88) -->
  <rect class="box" x="24"  y="44" width="140" height="44" rx="8"/>
  <text x="94"  y="71" class="lbl" text-anchor="middle">TextMate grammar</text>
  <rect class="box" x="190" y="44" width="140" height="44" rx="8"/>
  <text x="260" y="71" class="lbl" text-anchor="middle">Tree-sitter grammar</text>
  <rect class="box" x="500" y="44" width="140" height="44" rx="8"/>
  <text x="570" y="71" class="lbl" text-anchor="middle">JS port (ST4-style)</text>
  <rect class="box" x="660" y="44" width="140" height="44" rx="8"/>
  <text x="730" y="71" class="lbl" text-anchor="middle">JVM port (ST4-style)</text>

  <!-- LANGUAGE SERVER (y 180..224) -->
  <rect class="box lsp" x="350" y="180" width="160" height="44" rx="8"/>
  <text x="430" y="203" class="lbl" text-anchor="middle">LSP server</text>
  <text x="430" y="217" class="sub" text-anchor="middle">P0 · shared brain</text>
  <text x="528" y="208" class="note">builds on the existing Rust / Elixir engine</text>

  <!-- EDITOR INTEGRATIONS (y 310..354) -->
  <rect class="box" x="210" y="310" width="140" height="44" rx="8"/>
  <text x="280" y="337" class="lbl" text-anchor="middle">VS Code extension</text>
  <rect class="box" x="480" y="310" width="140" height="44" rx="8"/>
  <text x="550" y="337" class="lbl" text-anchor="middle">JetBrains plugin</text>

  <!-- PLAYGROUND (y 420..464) -->
  <rect class="box" x="24"  y="420" width="140" height="44" rx="8"/>
  <text x="94"  y="447" class="lbl" text-anchor="middle">AST viewer (Ph.2)</text>
  <rect class="box" x="190" y="420" width="140" height="44" rx="8"/>
  <text x="260" y="447" class="lbl" text-anchor="middle">Per-editor find</text>
  <rect class="box" x="356" y="420" width="140" height="44" rx="8"/>
  <text x="426" y="447" class="lbl" text-anchor="middle">Preact migration</text>

  <!-- legend -->
  <line x1="560" y1="430" x2="600" y2="430" class="edge"/>
  <text x="606" y="434" class="sub">needs (required)</text>
  <line x1="560" y1="450" x2="600" y2="450" class="edge opt"/>
  <text x="606" y="454" class="sub">optional / alternative</text>
</svg>
